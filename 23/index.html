 {tag:'외교 · 교역',region:'해상 교역 지역 → 전 세계',title:'지역 갈등 완화와 항로 정상화, 교역의 연결이 복원되다',body:'주요 해상 교역 지역의 긴장이 낮아지면서 항로가 정상화됐습니다. 선박 보험료와 운송 비용이 안정되고, 기업들은 지연됐던 국제 거래를 다시 추진하기 시작했습니다.',concept:'평화와 경제적 상호 의존',chain:['갈등 완화','교역 비용·위험 감소','연결망 회복'],effects:[5,9,4,7,6,3],why:['부품 수급과 해외 수출의 불확실성이 줄었습니다.','매입 운임과 지연 부담이 줄고 배송 수요가 회복됐습니다.','설비 운송 비용이 줄어 해외 판매 여건이 좋아졌습니다.','곡물 운송 비용이 안정돼 수입 비용 부담이 줄었습니다.','부품과 완성차의 국제 배송이 원활해졌습니다.','국제 교류에 대한 전반적인 기대가 개선됐습니다.'],question:'갈등이 완화될 때 모든 국가와 산업이 같은 만큼 이익을 얻을까요? 연결망 속 위치의 차이를 생각해 보세요.'}

 const INITIAL_CASH=1000000;
 function create(names,roundCount){if(!Array.isArray(names)||names.length<2||names.length>6||![4,6,8].includes(roundCount))throw Error('수업 설정을 확인해 주세요.');return{version:1,id:Date.now(),round:0,roundCount,order:roundCount===4?[0,1,2,5]:Array.from({length:roundCount},(_,i)=>i),phase:'trading',active:0,prices:STOCKS.map(s=>s.base),history:[STOCKS.map(s=>s.base)],teams:names.map((name,id)=>({id,name:String(name).trim().slice(0,16)||`${id+1}팀`,cash:INITIAL_CASH,holdings:STOCKS.map(()=>0),average:STOCKS.map(()=>0),done:false,notes:[],reflection:'',snapshots:[{stock:0,total:INITIAL_CASH}]})),trades:[],classNotes:{}}}
 const event=s=>EVENTS[s.order[s.round]];
 const stockValue=(t,prices)=>t.holdings.reduce((v,q,i)=>v+q*prices[i],0);
 function trade(s,index,side,qty){if(s.phase!=='trading')throw Error('현재는 거래 시간이 아닙니다.');const t=s.teams[s.active];if(t.done)throw Error('이번 라운드 거래를 제출했습니다.');if(!Number.isInteger(index)||index<0||index>=STOCKS.length||!['buy','sell'].includes(side)||!Number.isSafeInteger(qty)||qty<=0)throw Error('거래 수량은 1주 이상의 정수로 입력해 주세요.');const price=s.prices[index],amount=price*qty;if(side==='buy'){if(amount>t.cash)throw Error('현금이 부족합니다. 수량을 줄여 주세요.');t.average[index]=(t.average[index]*t.holdings[index]+amount)/(t.holdings[index]+qty);t.cash-=amount;t.holdings[index]+=qty}else{if(qty>t.holdings[index])throw Error('보유한 수량보다 많이 팔 수 없습니다.');t.cash+=amount;t.holdings[index]-=qty;if(!t.holdings[index])t.average[index]=0}s.trades.push({round:s.round,team:t.id,index,side,qty,price,amount});return s}
 function endTurn(s,note=''){if(s.phase!=='trading')throw Error('이미 모든 팀이 거래를 마쳤습니다.');const t=s.teams[s.active];t.notes[s.round]=String(note).slice(0,200);t.done=true;if(s.active<s.teams.length-1)s.active++;else s.phase='ready';return s}
 function resolve(s){if(s.phase!=='ready')throw Error('모든 팀의 거래를 먼저 마쳐 주세요.');const e=event(s);s.prices=s.prices.map((p,i)=>Math.max(100,Math.round(p*(1+e.effects[i]/100)/100)*100));s.history.push([...s.prices]);for(const t of s.teams){const stock=stockValue(t,s.prices);t.snapshots.push({stock,total:stock+t.cash})}s.phase='reveal';return s}
 function advance(s){if(s.phase!=='reveal')throw Error('시장 반응을 먼저 공개해 주세요.');if(s.round===s.roundCount-1){s.phase='finished'}else{s.round++;s.active=0;s.phase='trading';s.teams.forEach(t=>t.done=false)}return s}
 function ranking(s){const list=s.teams.map(t=>({team:t,stock:stockValue(t,s.prices),total:stockValue(t,s.prices)+t.cash})).sort((a,b)=>b.stock-a.stock||a.team.id-b.team.id);return list.map((v,i)=>({...v,rank:i&&v.stock===list[i-1].stock?list.findIndex(x=>x.stock===v.stock)+1:i+1}))}
 function valid(s){try{return s.version===1&&['trading','ready','reveal','finished'].includes(s.phase)&&[4,6,8].includes(s.roundCount)&&Number.isInteger(s.round)&&s.round>=0&&s.round<s.roundCount&&Array.isArray(s.order)&&s.order.length===s.roundCount&&s.order.every(i=>Number.isInteger(i)&&EVENTS[i])&&Array.isArray(s.prices)&&s.prices.length===6&&s.prices.every(p=>Number.isSafeInteger(p)&&p>0)&&s.teams.length>=2&&s.teams.length<=6&&Number.isInteger(s.active)&&s.active>=0&&s.active<s.teams.length&&s.teams.every(t=>typeof t.name==='string'&&Number.isSafeInteger(t.cash)&&t.cash>=0&&t.holdings.length===6&&t.holdings.every(q=>Number.isSafeInteger(q)&&q>=0)&&t.average.length===6&&t.average.every(v=>Number.isFinite(v)&&v>=0)&&Array.isArray(t.notes)&&Array.isArray(t.snapshots))&&Array.isArray(s.trades)&&Array.isArray(s.history)&&s.history.length>0&&s.history.every(row=>row.length===6&&row.every(p=>Number.isSafeInteger(p)&&p>0))&&s.classNotes&&typeof s.classNotes==='object'}catch{return false}}
 return{INITIAL_CASH,create,event,stockValue,trade,endTurn,resolve,advance,ranking,valid};
})();
</script>
<script id="market-ui">
(()=>{
const $=s=>document.querySelector(s),app=$('#app'),modal=$('#modal'),KEY='worldmarket-classroom-v1';
const COLORS=['#345ded','#dd8054','#28948a','#9267cc','#cd638a','#8b9c3e'];
let state=null,saved=null,setupTeams=4,setupRounds=6,teamDrafts=['1팀','2팀','3팀','4팀','5팀','6팀'],toastTimer,tradeDraft=null,storageOK=true;
const money=n=>Math.round(n).toLocaleString('ko-KR'),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arrow='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function mapSvg(){return `<svg class="world-map" viewBox="0 0 560 248" role="img" aria-label="북미, 유럽, 동아시아가 무역과 금융으로 연결된 세계 도식"><defs><pattern id="map-dots" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#334967"/></pattern><linearGradient id="route" x1="0" x2="1"><stop stop-color="#86baff"/><stop offset="1" stop-color="#6d86ff"/></linearGradient></defs><rect width="560" height="248" fill="url(#map-dots)" opacity=".7"/><g fill="#2b4260" stroke="#486080" stroke-width=".8"><path d="m35 51 35-18 42 8 22-17 33 13-7 17-24 9-1 20-24 13-13 26-20-13-9-27-20-9z"/><path d="m121 122 24 4 19 23 3 30-18 35-17-9-7-38-14-27z"/><path d="m239 48 25-14 35 5 7 20-28 11-25-6-15 13-13-11z"/><path d="m243 87 38-12 36 20 6 32-23 33-19 12-11-32-26-16-11-19z"/><path d="m304 44 40-14 70 11 48 22 26 31-23 12-32-16-19 7-3 29-26 2-18-37-35-10-20 2-22-22z"/><path d="m407 141 16 7 10 22-15 8-13-17z"/><path d="m446 174 32-12 31 19-4 25-35 4-29-15z"/><path d="m196 19 26-7 9 17-18 14-15-9z"/></g><g stroke="url(#route)" stroke-width="1.6" stroke-dasharray="5 5" fill="none"><path d="M96 76Q180-8 266 59"/><path d="M266 59Q344 5 420 87"/><path d="M96 76Q254 192 420 87"/></g><g fill="#91b3ff"><circle cx="96" cy="76" r="4"/><circle cx="266" cy="59" r="4"/><circle cx="420" cy="87" r="4"/></g><g font-family="system-ui,sans-serif" font-size="10" fill="#bdcce4"><text x="70" y="100">NORTH AMERICA</text><text x="245" y="37">EUROPE</text><text x="411" y="69">EAST ASIA</text></g><circle cx="420" cy="87" r="13" fill="none" stroke="#7f9dfc" opacity=".5"/></svg>`}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3000)}
function save(){if(!state)return;try{localStorage.setItem(KEY,JSON.stringify(state));saved=state;storageOK=true}catch{storageOK=false}$('#save-status').textContent=storageOK?'이 브라우저에 진행 상황 자동 저장':'자동 저장 불가 · 이 창을 유지해 주세요'}
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&MarketEngine.valid(s))saved=s}catch{}
function dialog(title,body,extra=''){modal.innerHTML=`<div class="dialog-inner"><div class="dialog-head"><h2 id="modal-title">${title}</h2><button class="dialog-close" data-action="close" aria-label="창 닫기">×</button></div>${body}${extra}</div>`;if(!modal.open)modal.showModal()}
function updateHeader(){const inGame=!!state;$('#reset-button').hidden=!inGame;$('#header-chip').textContent=inGame?(state.phase==='finished'?'수업 결과':`${state.round+1} / ${state.roundCount} 라운드`):'고3 · 세계화 수업'}
function renderSetup(){state=null;updateHeader();app.className='shell setup';app.innerHTML=`${saved?`<div class="resume"><div><b>이어서 할 수 있는 수업이 있어요</b><p>${saved.teams.length}개 팀 · ${saved.round+1} / ${saved.roundCount} 라운드${saved.phase==='finished'?' · 종료된 수업':''}</p></div><button class="btn small" data-action="resume">수업 이어하기 ${arrow}</button></div>`:''}<div class="setup-grid"><section class="setup-copy"><div class="eyebrow">WORLD NEWS. YOUR NEXT MOVE.</div><h1>세계가 움직이면,<br><span>내 주식도 움직인다.</span></h1><p class="intro">먼 나라의 정책, 기후, 문화가 우리 기업에 도착하는 순간.<br>뉴스의 연결을 읽고, 우리 팀의 다음 투자를 결정하세요.</p><div class="setup-map"><div class="map-label"><span>THE WORLD IS CONNECTED</span><span>LIVE CLASS SIMULATION</span></div>${mapSvg()}<div class="map-caption"><span>01 무역과 공급망</span><span>02 금융과 환율</span><span>03 문화와 환경</span></div></div><div class="setup-stats"><div><b>6개</b><span>세계와 연결된 산업</span></div><div><b>100만원</b><span>팀마다 같은 시작 자금</span></div><div><b>2–6팀</b><span>한 기기에서 함께</span></div></div></section><section class="panel setup-form"><div class="section-head" style="margin-bottom:0"><div><h2>우리 반 시장 열기</h2><p class="muted" style="font-size:12px">별도 가입 없이, 팀을 정하면 준비 끝.</p></div><span class="chip blue">수업 준비</span></div><div class="field"><label class="field-label">참여 팀 수</label><div class="segmented">${[2,3,4,5,6].map(n=>`<button data-action="teams" data-value="${n}" class="${setupTeams===n?'active':''}" aria-pressed="${setupTeams===n}">${n}팀</button>`).join('')}</div></div><div class="field"><label class="field-label">팀 이름 <span class="muted" style="font-weight:400">· 별명으로 입력해도 좋아요</span></label><div class="team-fields">${Array.from({length:setupTeams},(_,i)=>`<label class="team-input"><i style="background:${COLORS[i]}"></i><span class="sr-only">${i+1}번째 팀 이름</span><input class="input" data-team="${i}" value="${escape(teamDrafts[i])}" maxlength="16" autocomplete="off"></label>`).join('')}</div></div><div class="field"><label class="field-label">수업 길이</label><div class="segmented">${[{n:4,t:'4라운드 · 짧게'},{n:6,t:'6라운드 · 기본'},{n:8,t:'8라운드 · 확장'}].map(x=>`<button data-action="rounds" data-value="${x.n}" class="${setupRounds===x.n?'active':''}" aria-pressed="${setupRounds===x.n}">${x.t}</button>`).join('')}</div></div><div class="rule-box"><p><b>우승은 마지막 보유 주식 평가액으로!</b></p><p>보유 주식 수 × 최종 주가를 모두 더해 가장 큰 팀이 이깁니다. <b>남은 현금은 점수에서 제외</b>하며, 동점이면 공동 우승입니다.</p><p>각 팀은 같은 뉴스와 같은 가격으로 거래합니다. 전원 제출 후 주가를 한 번에 반영합니다.</p></div><button class="btn wide" data-action="start">모의 주식시장 시작하기 ${arrow}</button><p class="footnote" style="text-align:center;margin-top:11px">가상 거래 · 수수료 없음 · 빚내기·공매도 없음</p></section></div><section class="steps"><div class="step"><b><span>01 READ</span>세계 뉴스를 읽어요</b><p>어떤 나라와 산업이 연결되는지 살펴봅니다.</p></div><div class="step"><b><span>02 TRADE</span>사거나, 팔거나, 기다려요</b><p>팀별로 거래하고 선택한 이유를 남깁니다.</p></div><div class="step"><b><span>03 CONNECT</span>주가와 연결을 확인해요</b><p>시장 반응을 비교하고 세계화를 설명합니다.</p></div></section>`}
function captureTeams(){document.querySelectorAll('[data-team]').forEach(el=>teamDrafts[Number(el.dataset.team)]=el.value)}
function spark(values,color='#345ded'){const v=values.length===1?[values[0],values[0]]:values,min=Math.min(...v)*.96,max=Math.max(...v)*1.04;const points=v.map((p,i)=>`${3+i/(v.length-1)*60},${26-(p-min)/(max-min||1)*22}`).join(' ');return `<svg class="spark" width="66" height="32" viewBox="0 0 66 32" role="img" aria-label="이전 라운드까지의 주가 추이"><polyline fill="none" stroke="${color}" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" points="${points}"/></svg>`}
function actualChange(index){if(state.history.length<2)return 0;const h=state.history;return(h[h.length-1][index]/h[h.length-2][index]-1)*100}
function percent(v){return`${v>0?'+':''}${v.toFixed(1)}%`}
function leaderboard(){return `<section class="panel leaderboard"><div class="section-head" style="margin-bottom:3px"><h3>팀 순위</h3><span class="chip">주식 평가액</span></div>${MarketEngine.ranking(state).map(r=>`<div class="leader-row ${state.phase==='trading'&&r.team.id===state.active?'active':''}"><span class="rank">${r.rank}</span><b>${escape(r.team.name)}</b><span class="num">${money(r.stock)}원</span></div>`).join('')}<p class="leader-note">현금 제외 · ${state.phase==='reveal'?'공개된 새 주가 기준':'현재 주가 기준'}</p></section>`}
function portfolio(){const t=state.teams[state.active],val=MarketEngine.stockValue(t,state.prices),editable=state.phase==='trading';return `<section class="panel portfolio"><div class="team-title"><div class="team-label"><i class="team-dot" style="background:${COLORS[t.id]}"></i>${escape(t.name)}</div><span class="badge">${editable?'거래 중':'거래 완료'}</span></div><div class="portfolio-label">보유 주식 평가액 <span style="font-size:10px">· 승리 기준</span></div><div class="portfolio-value num">${money(val)}<small> 원</small></div><div class="asset-row"><span>거래할 수 있는 현금</span><b class="num">${money(t.cash)}원</b></div><div class="asset-row"><span>현금 포함 총 자산</span><b class="num">${money(val+t.cash)}원</b></div><div class="divider"></div><div class="section-head" style="margin-bottom:12px"><h3 style="font-size:12px">우리 팀의 포트폴리오</h3><span class="muted" style="font-size:10px">${t.holdings.filter(q=>q>0).length}개 종목</span></div>${val?t.holdings.map((q,i)=>q?`<div class="holding"><div><b>${STOCKS[i].name}</b><div class="quantity">${q}주 · 평균 ${money(t.average[i])}원</div></div><div style="text-align:right"><b class="num">${money(q*state.prices[i])}원</b><div class="quantity ${state.prices[i]>=t.average[i]?'up':'down'}">${percent((state.prices[i]/t.average[i]-1)*100)}</div></div></div>`:'').join(''):'<div class="empty-holdings">아직 보유한 주식이 없어요.<br>뉴스를 읽고 첫 투자를 시작해 보세요.</div>'}${editable?`<div class="divider"></div><label class="reason-label" for="reason">우리 팀의 선택 이유 <span>선택 · 200자</span></label><textarea id="reason" class="input reason" maxlength="200" placeholder="예: 운송비가 오르면 수입 원가가 높아지므로…">${escape(t.notes[state.round]||'')}</textarea><div class="turn-queue">${state.teams.map(x=>`<span class="queue-item ${x.done?'done':x.id===state.active?'now':''}">${escape(x.name)} ${x.done?'✓':x.id===state.active?'거래 중':''}</span>`).join('')}</div><button class="btn wide" data-action="end-turn">${escape(t.name)} 거래 마치기 ${arrow}</button><p class="turn-tip">제출 후에는 이번 라운드의 거래를 바꿀 수 없어요.</p>`:''}</section>`}
function marketTable(){const t=state.teams[state.active],trade=state.phase==='trading';return `<section class="panel market"><div class="market-head section-head"><div><h2>글로벌 주식시장</h2><p>뉴스를 읽고, 어떤 산업에 변화가 올지 예측해 보세요.</p></div><span class="market-key">빨강 상승 · 파랑 하락</span></div><div class="table-scroll"><table class="stock-table"><caption class="sr-only">가상 기업 주가와 현재 팀의 보유 수량 및 거래 버튼</caption><thead><tr><th scope="col">기업 / 산업</th><th scope="col">현재가 / 직전 대비</th><th scope="col">주가 추이</th><th scope="col">우리 팀 보유</th><th scope="col">거래</th></tr></thead><tbody>${STOCKS.map((s,i)=>{const c=actualChange(i);return `<tr><td><div class="stock-name"><span class="stock-icon" style="background:${s.color};color:${s.ink}" aria-hidden="true">${s.symbol}</span><div><b>${s.name}</b><small>${s.sector} · ${s.code}</small></div></div></td><td class="num"><span class="stock-price">${money(state.prices[i])}</span><span class="stock-change ${c>0?'up':c<0?'down':'flat'}">${percent(c)}</span></td><td>${spark(state.history.map(v=>v[i]),c<0?'#5180c9':'#d5787b')}</td><td class="num" style="font-size:12px">${t.holdings[i]}<span class="muted" style="font-size:10px"> 주</span></td><td><div class="trade-actions"><button class="buy-btn" data-action="buy" data-index="${i}" ${!trade?'disabled':''} aria-label="${s.name} 매수">매수</button><button class="sell-btn" data-action="sell" data-index="${i}" ${!trade||!t.holdings[i]?'disabled':''} aria-label="${s.name} 매도">매도</button></div></td></tr>`}).join('')}</tbody></table></div><div class="market-tip">${trade?'이번 뉴스의 반응은 아직 미반영 · 모든 팀이 거래를 마치면 새 주가가 공개됩니다.':'주가 변동률은 100원 단위 반올림 후 계산 · 가상 뉴스에 대한 단순화된 시장 반응입니다.'}</div></section>`}
function newsCard(){const e=MarketEngine.event(state);return `<section class="news"><div class="news-inner"><div><div class="news-meta"><span class="chip dark">WORLD BRIEF ${String(state.round+1).padStart(2,'0')}</span><span>${e.tag}</span></div><h2>${e.title}</h2><p>${e.body}</p><div class="news-region"><span>↗</span>${e.region}</div></div><div class="news-art">${mapSvg()}</div></div><div class="news-bottom"><span>${e.concept}</span><span>수업을 위해 만든 가상 상황</span></div></section>`}
function render(){updateHeader();app.className='shell game';if(state.phase==='finished'){renderResults();return}const reveal=state.phase==='reveal';app.innerHTML=`<div class="round-heading"><div><div class="eyebrow" style="margin-bottom:5px">THE WORLD IS YOUR CLASSROOM</div><h1>${state.round+1}라운드 <span style="color:#a6b0bf;font-weight:500">/ ${state.roundCount}</span> <span style="font-size:13px;margin-left:8px;color:var(--muted);font-weight:550">${reveal?'시장 반응 공개':state.phase==='ready'?'거래 제출 완료':'뉴스를 읽고 거래하기'}</span></h1><p>${state.round===state.roundCount-1?'마지막 라운드입니다. 남은 현금은 최종 점수에 포함되지 않습니다.':reveal?'새 주가와 기업별 연결 경로를 비교하고, 우리 반의 생각을 나눠 보세요.':'모든 팀의 거래 가격은 같습니다. 주가가 변하기 전에 팀의 선택을 마쳐 주세요.'}</p></div><div class="round-strip" aria-label="라운드 진행">${Array.from({length:state.roundCount},(_,i)=>`<span class="round-dot ${i===state.round?'current':i<state.round?'complete':''}" aria-label="${i+1}라운드${i===state.round?' 현재':''}">${i<state.round?'✓':i+1}</span>`).join('')}</div></div><div class="game-grid"><div>${newsCard()}${state.phase==='ready'?`<section class="panel ready-panel"><h2>모든 팀이 선택을 마쳤습니다.</h2><p>누구의 예측이 시장과 연결될까요? 주가와 그 이유를 함께 확인해 보세요.</p><button class="btn" data-action="resolve">시장 반응 공개하기 ${arrow}</button></section>`:''}${reveal?revealPanel():marketTable()}<div class="lesson-link"><span style="font-size:18px;color:var(--blue)">↗</span><button data-action="connections"><b>기업은 세계와 어떻게 연결될까요?</b><br>6개 가상 기업의 공급망과 영향을 받는 요인 살펴보기</button><span class="arrow">→</span></div></div><aside class="sidebar">${portfolio()}${leaderboard()}</aside></div>`}
function revealPanel(){const e=MarketEngine.event(state);return `<section class="panel reveal"><div class="reveal-intro"><span class="round-stamp">↗</span><div><h2>뉴스가 시장에 도착했습니다.</h2><p>${e.chain.join(' → ')}</p></div></div><div class="effects">${STOCKS.map((s,i)=>{const c=actualChange(i);return `<article class="effect"><div class="effect-top"><b>${s.name} <span style="font-size:10px;font-weight:400;color:var(--muted)">${s.sector}</span></b><span class="num ${c>0?'up':c<0?'down':'flat'}">${percent(c)}</span></div><p>${e.why[i]}</p><p style="margin-top:5px;color:#4e6480" class="num">${money(state.history[state.history.length-2][i])} → ${money(state.prices[i])}원</p></article>`}).join('')}</div><div class="discussion"><h3>함께 연결해 보기</h3><p>${e.question}</p><label class="sr-only" for="class-note">학급 토론 메모</label><textarea id="class-note" class="input reason" maxlength="600" placeholder="우리 반의 연결 설명을 한 줄로 남겨 보세요. (선택)">${escape(state.classNotes[state.round]||'')}</textarea></div><p class="footnote" style="margin-top:13px">실제 주가는 여러 요인이 함께 결정합니다. 위 결과는 인과관계 토론을 위한 가상 모형이며 항상 이렇게 움직이는 법칙은 아닙니다.</p><div class="reveal-next"><span class="footnote">${state.round===state.roundCount-1?'모든 라운드의 주가 반영이 끝났습니다.':'다음 뉴스가 나오면 모든 팀이 다시 거래할 수 있어요.'}</span><button class="btn" data-action="advance">${state.round===state.roundCount-1?'최종 순위 확인하기':'다음 라운드로'} ${arrow}</button></div></section>`}
function chart(){const w=650,h=235,pad={l:66,r:20,t:17,b:28},max=Math.max(1000000,...state.teams.flatMap(t=>t.snapshots.map(v=>v.stock)))*1.12,innerW=w-pad.l-pad.r,innerH=h-pad.t-pad.b;return `<svg class="graph" viewBox="0 0 ${w} ${h}" role="img" aria-label="라운드별 팀 주식 평가액 변화. 표에는 최종 평가액이 있습니다.">${[0,1,2,3].map(i=>{const y=pad.t+innerH-i/3*innerH;return `<path d="M${pad.l} ${y}H${w-pad.r}" stroke="#e6ebf3"/><text x="${pad.l-10}" y="${y+4}" text-anchor="end" fill="#94a0b2" font-size="10">${money(max*i/3/10000)}만</text>`}).join('')}${Array.from({length:state.roundCount+1},(_,i)=>`<text x="${pad.l+i/state.roundCount*innerW}" y="${h-7}" text-anchor="middle" fill="#94a0b2" font-size="10">${i===0?'시작':i+'R'}</text>`).join('')}${state.teams.map(t=>`<polyline points="${t.snapshots.map((v,i)=>`${pad.l+i/state.roundCount*innerW},${pad.t+innerH-v.stock/max*innerH}`).join(' ')}" fill="none" stroke="${COLORS[t.id]}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}</svg><div class="chart-legend">${state.teams.map(t=>`<span><i style="background:${COLORS[t.id]}"></i>${escape(t.name)}</span>`).join('')}</div>`}
function renderResults(){const ranking=MarketEngine.ranking(state),winners=ranking.filter(r=>r.rank===1);app.innerHTML=`<section class="result-hero"><div class="trophy" aria-hidden="true"><svg width="38" height="38" viewBox="0 0 40 40" fill="none"><path d="M12 5h16v10a8 8 0 0 1-16 0V5Z" stroke="currentColor" stroke-width="2.3"/><path d="M12 9H6v4a7 7 0 0 0 8 7M28 9h6v4a7 7 0 0 1-8 7M20 23v9m-8 3h16m-12-3h8" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg></div><div class="eyebrow">MARKET CLOSED · LESSON OPEN</div><h1>${winners.map(r=>escape(r.team.name)).join(' · ')}${winners.length>1?' 공동 우승!':' 우승!'}</h1><p>${state.roundCount}개의 세계 뉴스를 지나, 우리 반의 투자가 완성됐습니다.</p></section><div class="result-grid"><section class="panel results-panel"><div class="section-head"><h2>최종 투자 순위</h2><span class="chip blue">주식 평가액 기준</span></div><table class="results-table"><caption class="sr-only">최종 팀별 순위, 주식 평가액, 남은 현금, 총 자산</caption><thead><tr><th scope="col">팀 / 순위</th><th scope="col">주식 평가액</th><th scope="col">남은 현금</th><th scope="col">총 자산</th></tr></thead><tbody>${ranking.map(r=>`<tr><td><b>${r.rank}위 ${escape(r.team.name)}</b></td><td class="num"><b>${money(r.stock)}원</b></td><td class="num">${money(r.team.cash)}원</td><td class="num">${money(r.total)}원</td></tr>`).join('')}</tbody></table><p class="winner-note">보유 주식 수 × 최종 주가를 합산해 순위를 매겼습니다. 현금은 점수에서 제외했고, 주식 평가액이 같으면 같은 순위입니다.</p><div class="graph-wrap"><h3 style="font-size:13px">라운드별 보유 주식 평가액</h3><p class="footnote">주가 변화와 주식 보유 비중이 함께 반영됩니다. 수익률 그래프는 아닙니다.</p>${chart()}</div></section><section class="panel results-panel"><div class="eyebrow">REFLECTION</div><h2>수익 너머의 세계화</h2><p class="muted" style="font-size:12px;margin-top:10px;line-height:1.9">한 지역의 사건은 무역, 금융, 문화의 연결망을 따라 다른 곳의 생활과 기업에 영향을 주었습니다. 우리 팀의 선택을 그 연결로 설명해 보세요.</p><div class="discussion"><h3>마지막 토론</h3><p>① 국경을 넘어 전달된 영향 하나를 화살표로 설명한다면?<br>② 같은 사건에서 이익을 본 집단과 손해를 본 집단은?<br>③ 주가와 별개로 환경·노동·불평등에는 어떤 변화가 있었을까?</p></div>${state.teams.map(t=>`<div class="field" style="margin-top:17px"><label class="field-label" for="reflection-${t.id}"><i class="team-dot" style="display:inline-block;background:${COLORS[t.id]};margin-right:6px"></i>${escape(t.name)}의 한 줄 회고</label><textarea class="input reason" id="reflection-${t.id}" data-reflection="${t.id}" maxlength="300" placeholder="처음에는 …라고 생각했지만, …의 연결을 알게 되었다.">${escape(t.reflection||'')}</textarea></div>`).join('')}</section></div><section class="panel results-panel" style="margin-top:22px"><div class="section-head" style="margin-bottom:4px"><h2 style="font-size:18px">우리 반의 뉴스와 선택 기록</h2><span class="muted" style="font-size:11px">펼쳐서 복기해 보세요</span></div>${state.order.map((eventId,r)=>`<details class="round-archive"><summary>${r+1}R · ${EVENTS[eventId].title}</summary><div class="archive-body"><p><b>${EVENTS[eventId].chain.join(' → ')}</b></p>${state.teams.map(t=>`<p><b style="color:${COLORS[t.id]}">${escape(t.name)}</b> · ${escape(t.notes[r]||'선택 이유를 남기지 않았어요.')}<br>${state.trades.filter(x=>x.team===t.id&&x.round===r).map(x=>`${STOCKS[x.index].name} ${x.side==='buy'?'매수':'매도'} ${x.qty}주 (${money(x.price)}원)`).join(' / ')||'거래 없이 보유 상태 유지'}</p>`).join('')}${state.classNotes[r]?`<p><b>우리 반 토론</b> · ${escape(state.classNotes[r])}</p>`:''}</div></details>`).join('')}</section><div class="result-actions no-print"><button class="btn" data-action="export">결과·거래 기록 CSV 저장 ↓</button><button class="btn secondary" data-action="print">결과 인쇄</button><button class="btn secondary" data-action="reset">새 수업 시작</button></div><p class="footnote" style="text-align:center;margin-bottom:10px">CSV에는 최종 순위, 라운드별 주가, 모든 거래, 팀의 선택 이유와 수업 회고가 함께 저장됩니다.</p>`}
function openTrade(index,side){if(!state||state.phase!=='trading')return;const t=state.teams[state.active],s=STOCKS[index],max=side==='buy'?Math.floor(t.cash/state.prices[index]):t.holdings[index];tradeDraft={index,side};dialog(`${s.name} ${side==='buy'?'매수':'매도'}`,`<p class="dialog-subtitle">${s.region} · ${s.sector}<br>${s.about}</p><div class="trade-info"><span class="muted">현재 주가</span><b class="num">${money(state.prices[index])}<small> 원</small></b></div><div class="asset-row"><span>${side==='buy'?'사용할 수 있는 현금':'보유 수량'}</span><b>${side==='buy'?money(t.cash)+'원':max+'주'}</b></div><div class="field"><label class="field-label" for="trade-qty">${side==='buy'?'매수':'매도'} 수량 <span class="muted" style="font-weight:400">· 최대 ${max}주</span></label><input id="trade-qty" class="input num" type="number" inputmode="numeric" min="1" max="${max}" step="1" value="${max>0?1:0}"><div class="quick-qty">${[1,5,10].map(n=>`<button data-action="qty" data-value="${n}">${n}주</button>`).join('')}<button data-action="qty" data-value="${max}">최대</button></div></div><div class="trade-total"><div class="asset-row"><span>총 ${side==='buy'?'매수':'매도'} 금액</span><b class="num" id="trade-amount"></b></div><div class="asset-row"><span>거래 후 현금</span><b class="num" id="trade-cash"></b></div></div><p class="error" id="trade-error" aria-live="polite"></p><div class="dialog-actions"><button class="btn secondary" data-action="close">취소</button><button id="trade-confirm" class="btn" data-action="confirm-trade">${side==='buy'?'매수':'매도'}하기</button></div>`);updateTrade()}
function updateTrade(){if(!tradeDraft||!$('#trade-qty'))return;const {index,side}=tradeDraft,t=state.teams[state.active],q=Number($('#trade-qty').value),max=side==='buy'?Math.floor(t.cash/state.prices[index]):t.holdings[index],valid=Number.isSafeInteger(q)&&q>0&&q<=max,amount=Number.isSafeInteger(q)&&q>=0?q*state.prices[index]:0;$('#trade-amount').textContent=money(amount)+'원';$('#trade-cash').textContent=money(t.cash+(side==='buy'?-amount:amount))+'원';$('#trade-error').textContent=valid?'':max===0?(side==='buy'?'이 주식을 살 현금이 부족합니다.':'보유한 주식이 없습니다.'):`1~${max}주의 정수로 입력해 주세요.`;$('#trade-confirm').disabled=!valid}
function connections(){dialog('기업과 세계의 연결',`<p class="dialog-subtitle">같은 뉴스도 기업이 연결된 위치에 따라 다른 영향을 줍니다.</p>${STOCKS.map(s=>`<div class="guide-section"><div class="stock-name"><span class="stock-icon" style="background:${s.color};color:${s.ink}">${s.symbol}</span><div><b>${s.name} · ${s.sector}</b><small>${s.region}</small></div></div><p style="margin-top:10px">${s.about}</p><p style="color:var(--blue);font-size:11px;margin-top:5px">살펴볼 요인: ${s.watch}</p></div>`).join('')}<p class="footnote">모든 가격은 원화 표시로 단순화했습니다. 해외 기업의 실제 가격이나 실시간 환율을 사용하지 않습니다.</p>`)}
function guide(){dialog('수업 가이드',`<span class="chip blue">고3 · 세계화와 상호 의존</span><div class="guide-section"><h3>한 기기에서 2~6팀이 차례로 거래합니다</h3><p>교사 PC를 화면에 띄우거나 팀 대표가 돌아가며 조작하세요. 다른 기기와 자동으로 연결되는 온라인 대전은 아닙니다. 같은 브라우저에서 진행 상황이 저장됩니다.</p></div><div class="guide-section"><h3>50분 수업의 흐름 · 기본 6라운드</h3><div class="guide-row"><b>5분</b><span>팀 구성, 100만원 지급, 우승 기준과 거래 방법 확인</span></div><div class="guide-row"><b>30분</b><span>라운드마다 뉴스 읽기 → 팀 토의 → 매수·매도 → 전원 제출 → 주가·해설 공개</span></div><div class="guide-row"><b>15분</b><span>최종 순위 확인, 연결 경로 그리기, 세계화의 이익과 부담 토론</span></div><p style="margin-top:10px">팀이 많거나 토의를 길게 하려면 4라운드를 선택하세요. 각 라운드는 교사가 진행 속도를 조절합니다.</p></div><div class="guide-section"><h3>승리 규칙</h3><p>마지막 뉴스의 주가까지 반영한 <b>보유 주식 평가액</b>이 가장 큰 팀이 이깁니다. 현금은 점수에 포함되지 않으며, 같으면 공동 순위입니다. 매수는 현금 한도, 매도는 보유 수량 안에서만 가능하고 수수료는 없습니다.</p></div><div class="guide-section"><h3>이 게임이 보여 주는 세계화</h3><p>무역과 국제 분업, 해상 운송, 탄소 규범, 자금 이동과 환율, 디지털 문화, 기후와 식량이 서로 다른 산업으로 전달되는 경로를 살펴봅니다. 각 라운드의 설명은 수업용 가상 모형입니다. 실제 주가는 뉴스 외에도 여러 요인이 함께 결정합니다.</p></div><div class="guide-section"><h3>수업을 마칠 때</h3><p>결과 화면에서 팀 회고를 남기고 CSV로 최종 순위·주가·거래·선택 이유를 저장할 수 있습니다. 새 수업을 시작하면 이 브라우저의 이전 수업 저장 내용이 바뀝니다.</p></div><p class="footnote">참고 링크: <a href="https://main.krxverse.co.kr/_contents/ACA/02/02010400/ACA02010400P1.jsp" target="_blank" rel="noopener">한국거래소 모의증권투자게임</a>. 이 게임은 독립적으로 제작한 수업용 시뮬레이션이며 KRX 공식 게임이 아닙니다.</p>`)}
function exportCSV(){if(!state)return;const rows=[['월드마켓 — 세계화 투자 교실'],['승리 기준','최종 보유 주식 평가액 (현금 제외)'],[],['최종 순위','팀','주식 평가액(원)','현금(원)','총 자산(원)']];MarketEngine.ranking(state).forEach(r=>rows.push([r.rank,r.team.name,r.stock,r.team.cash,r.total]));rows.push([],['라운드별 주가','기업','주가(원)']);state.history.forEach((p,r)=>p.forEach((price,i)=>rows.push([r===0?'시작':r,STOCKS[i].name,price])));rows.push([],['거래 라운드','팀','기업','구분','수량(주)','주가(원)','총액(원)']);state.trades.forEach(x=>rows.push([x.round+1,state.teams[x.team].name,STOCKS[x.index].name,x.side==='buy'?'매수':'매도',x.qty,x.price,x.amount]));rows.push([],['라운드','뉴스','팀','선택 이유']);for(let r=0;r<state.roundCount;r++)state.teams.forEach(t=>rows.push([r+1,EVENTS[state.order[r]].title,t.name,t.notes[r]||'']));rows.push([],['라운드','학급 토론 메모']);Object.entries(state.classNotes).forEach(([r,n])=>rows.push([Number(r)+1,n]));rows.push([],['팀','최종 회고']);state.teams.forEach(t=>rows.push([t.name,t.reflection||'']));const cell=x=>{let s=String(x??'');if(typeof x==='string'&&/^\s*[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};const blob=new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='월드마켓_수업결과.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('수업 결과와 거래 기록을 저장했습니다.')}
function finishTurn(){const t=state.teams[state.active];MarketEngine.endTurn(state,$('#reason')?.value||t.notes[state.round]||'');save();render();if(state.phase==='trading'){const next=state.teams[state.active];dialog('다음 팀의 차례입니다',`<div class="pass-card"><div class="pass-symbol" style="color:${COLORS[next.id]}">${state.active+1}</div><h3 style="font-size:27px">${escape(next.name)}</h3><p class="dialog-subtitle">같은 뉴스, 같은 가격으로 거래합니다.<br>우리 팀의 선택을 준비해 주세요.</p><button class="btn wide" data-action="close">${escape(next.name)} 거래 시작하기 ${arrow}</button></div>`)}else toast('모든 팀이 제출했습니다. 시장 반응을 공개해 주세요.')}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;try{
 if(a==='guide')guide();else if(a==='close'){modal.close();tradeDraft=null}else if(a==='teams'){captureTeams();setupTeams=Number(b.dataset.value);renderSetup()}else if(a==='rounds'){captureTeams();setupRounds=Number(b.dataset.value);renderSetup()}else if(a==='start'){captureTeams();if(saved){dialog('새 수업을 시작할까요?',`<p class="dialog-subtitle">저장된 수업 대신 지금 설정한 팀으로 새 수업을 시작합니다. 이전 기록이 필요하다면 먼저 이어서 열고 CSV로 저장해 주세요.</p><div class="dialog-actions"><button class="btn secondary" data-action="close">돌아가기</button><button class="btn" data-action="start-confirm">새 수업 시작</button></div>`)}else start()}else if(a==='start-confirm'){modal.close();start()}else if(a==='resume'){state=JSON.parse(JSON.stringify(saved));render();save()}else if(a==='reset'){dialog('새 수업 준비',`<p class="dialog-subtitle">수업 설정 화면으로 돌아갑니다. 새로운 수업을 시작하기 전까지 현재 저장 내용은 유지됩니다.</p><div class="dialog-actions">${state?'<button class="btn secondary" data-action="export">현재 기록 CSV 저장</button>':''}<button class="btn" data-action="setup">설정 화면으로</button></div>`)}else if(a==='setup'){modal.close();renderSetup()}else if(a==='buy'||a==='sell')openTrade(Number(b.dataset.index),a);else if(a==='qty'){$('#trade-qty').value=b.dataset.value;updateTrade()}else if(a==='confirm-trade'){const q=Number($('#trade-qty').value),{index,side}=tradeDraft;MarketEngine.trade(state,index,side,q);modal.close();tradeDraft=null;save();render();toast(`${STOCKS[index].name} ${q}주를 ${side==='buy'?'매수':'매도'}했습니다.`)}else if(a==='end-turn')finishTurn();else if(a==='resolve'){MarketEngine.resolve(state);save();render();window.scrollTo({top:0,behavior:'smooth'})}else if(a==='advance'){MarketEngine.advance(state);save();render();window.scrollTo({top:0,behavior:'smooth'})}else if(a==='connections')connections();else if(a==='export')exportCSV();else if(a==='print')window.print();
 }catch(e){toast(e.message||'입력한 내용을 확인해 주세요.')}});
document.addEventListener('input',ev=>{if(ev.target.id==='trade-qty')updateTrade();else if(ev.target.id==='reason'&&state){state.teams[state.active].notes[state.round]=ev.target.value;save()}else if(ev.target.id==='class-note'&&state){state.classNotes[state.round]=ev.target.value;save()}else if(ev.target.dataset.reflection!==undefined&&state){state.teams[Number(ev.target.dataset.reflection)].reflection=ev.target.value;save()}});
modal.addEventListener('click',ev=>{if(ev.target===modal){const r=modal.getBoundingClientRect();if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom){modal.close();tradeDraft=null}}});
function start(){state=MarketEngine.create(teamDrafts.slice(0,setupTeams),setupRounds);save();render();window.scrollTo({top:0,behavior:'smooth'})}
renderSetup();
})();
</script>
</body>
</html>
