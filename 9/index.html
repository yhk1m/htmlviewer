<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
<title>부산 과제학습답사</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column; sticky search+team bar, fixed bottom tab bar (일정·객실·KTX·경비). Harbor teal + buoy orange for "팀별로 다른 것". */
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --sunk:#E3EBED; --ink:#10212E; --muted:#5A6B77; --line:#D3DDE1;
  --accent:#0A6C76; --accent-ink:#FFFFFF; --accent-soft:#D8ECEE;
  --signal:#D9561A; --signal-soft:#FBE7DB;
  --faded:#B3BEC4; --hit:#FFE68A; --hit-ink:#3A2C00; --staff:#EAE6F4; --staff-ink:#4A3F78;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A141C; --surface:#12202B; --sunk:#0E1A23; --ink:#E4ECF0; --muted:#93A3AF; --line:#22343F;
  --accent:#4BC0C9; --accent-ink:#06262A; --accent-soft:#123239;
  --signal:#FF8A4F; --signal-soft:#3A2217;
  --faded:#4C5C67; --hit:#6B5A12; --hit-ink:#FFF4C7; --staff:#2A2540; --staff-ink:#C9C0F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A141C; --surface:#12202B; --sunk:#0E1A23; --ink:#E4ECF0; --muted:#93A3AF; --line:#22343F;
  --accent:#4BC0C9; --accent-ink:#06262A; --accent-soft:#123239;
  --signal:#FF8A4F; --signal-soft:#3A2217;
  --faded:#4C5C67; --hit:#6B5A12; --hit-ink:#FFF4C7; --staff:#2A2540; --staff-ink:#C9C0F0; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
  padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top */
.top{padding-block:20px 6px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}
h1{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.15;margin:4px 0 10px;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}

/* sticky bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:8px;align-items:center}
.bar{padding-block:10px 0}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font:inherit;padding:0 36px 0 38px}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted)}
.clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;width:34px;height:34px;border-radius:8px;color:var(--muted);font-size:18px;cursor:pointer}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-shrink:0}
.seg button{border:0;background:none;border-radius:8px;padding:0 12px;height:36px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

/* search results */
#results{padding-block:12px 0;display:grid;gap:10px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.res h3{margin:0 0 8px;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.res dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.res dt{color:var(--muted);font-size:13px;padding-top:2px}
.res dd{margin:0;min-width:0}
.jump{border:0;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:3px 9px;font-weight:600;cursor:pointer;text-align:left}
.empty-note{color:var(--muted);font-size:14px;padding:6px 2px}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em;background:var(--accent-soft);color:var(--accent)}
.chip.b{background:var(--signal-soft);color:var(--signal)}
.chip.ghost{background:var(--sunk);color:var(--muted)}

/* sections */
main{padding-block:14px 8px}
section[hidden]{display:none}
h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:8px 0 12px}
.sub{font-size:13px;color:var(--muted);margin:-6px 0 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* overview strip */
.brief{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:20px}
.brief div{background:var(--surface);padding:11px 12px;min-width:0}
.brief .k{font-size:12px;color:var(--muted);font-weight:600}
.brief .v{font-weight:600;margin-top:2px}
.brief .v .mono{font-size:17px}
.brief .wide{grid-column:1/-1}

/* timeline */
.day{margin-bottom:22px}
.dayhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.dayhead .n{font-family:var(--f-display);font-size:22px}
.dayhead .d{color:var(--muted);font-size:14px}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.tl li{position:relative;padding:0 0 14px 18px}
.tl li::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl li.meal::before{background:var(--accent)}
.tl li.diff::before{border-color:var(--signal);background:var(--signal)}
.tl .t{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl .w{font-weight:700;font-size:16px;margin-top:1px}
.tl .x{font-size:14px;color:var(--muted)}
.tl li.past .t,.tl li.past .w,.tl li.past .x{color:var(--faded)}
.tl li.past::before{border-color:var(--faded);background:var(--surface)}
.tl li.past .dn{color:var(--faded);background:var(--sunk)}
.tl .dn{display:inline-block;margin-top:5px;font-size:13px;color:var(--signal);background:var(--signal-soft);border-radius:6px;padding:2px 8px;font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:-4px 0 14px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);display:inline-block}
.dot.f{background:var(--accent)} .dot.s{border-color:var(--signal);background:var(--signal)}

/* hotel */
.floors{margin-bottom:14px}
.plan{display:grid;grid-template-columns:1fr 54px 1fr;gap:6px 0;align-items:stretch}
.room{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 9px;min-width:0;min-height:62px;scroll-margin-top:150px;scroll-margin-bottom:20px}
.room .rn{display:flex;justify-content:space-between;align-items:center;gap:4px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.room .rn b{color:var(--ink);font-size:14px;font-weight:600}
.room .ppl{font-size:14px;font-weight:600;line-height:1.35;margin-top:2px;word-break:keep-all}
.room.vacant{background:transparent;border-style:dashed}
.room.vacant .ppl{color:var(--muted);font-weight:400;font-size:13px}
.room.teacher{background:var(--staff);border-color:transparent}
.room.teacher .ppl{color:var(--staff-ink)}
.room.hit,.seat.hit{background:var(--hit);border-color:var(--hit);color:var(--hit-ink)}
.room.hit .ppl,.room.hit .rn,.room.hit .rn b{color:var(--hit-ink)}
.room .tag{font-family:var(--f-body);font-size:11px;font-weight:700;border-radius:4px;padding:0 4px;background:var(--sunk);color:var(--muted)}
.hall{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.02em;
  background:repeating-linear-gradient(0deg,transparent 0 6px,var(--line) 6px 7px);background-size:2px 100%;background-repeat:no-repeat;background-position:center}
.hall span{background:var(--bg);padding:2px 2px;line-height:1.2}
.hall .ev{color:var(--accent)} .hall .ex{color:var(--signal)}
.suites{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.mini-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:14px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line);background:var(--surface)}
.sw.t{background:var(--staff);border-color:transparent}.sw.v{background:transparent;border-style:dashed}.sw.h{background:var(--hit);border-color:var(--hit)}

/* train */
.trainhead{padding:12px 14px;display:grid;gap:2px;margin-bottom:12px}
.trainhead .tn{font-weight:700;font-size:16px}
.trainhead .tt{font-family:var(--f-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.trainhead .tt small{font-size:13px;color:var(--muted);font-family:var(--f-body);font-weight:500;margin-left:6px}
.car{margin-bottom:18px}
.carhead{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 6px}
.carhead b{font-family:var(--f-display);font-weight:400;font-size:20px}
.carhead span{font-size:12px;color:var(--muted)}
.seats{display:grid;grid-template-columns:28px 1fr 1fr 14px 1fr 1fr;gap:4px;align-items:stretch}
.seats .colh{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-align:center}
.rowno{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.rowno i{font-style:normal;font-size:9px;color:var(--signal);font-family:var(--f-body);font-weight:700}
.seat{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 3px;text-align:center;font-size:13px;font-weight:600;line-height:1.2;min-height:40px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;word-break:keep-all;scroll-margin-top:150px;scroll-margin-bottom:20px}
.seat small{font-family:var(--f-mono);font-size:10px;color:var(--muted);font-weight:500}
.seat.hit small{color:var(--hit-ink)}
.seat.empty{background:transparent;border-style:dashed}
.seat.staff{background:var(--staff);border-color:transparent;color:var(--staff-ink);font-size:11.5px}
.gap-row{grid-column:1/-1;text-align:center;font-size:11px;color:var(--muted);padding:2px 0}

/* cost */
.total{padding:16px;margin-bottom:12px}
.total .k{font-size:13px;color:var(--muted);font-weight:600}
.total .big{font-family:var(--f-mono);font-size:34px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.2}
.total .big small{font-family:var(--f-body);font-size:16px;font-weight:600;margin-left:2px}
.split{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.split b{color:var(--ink);font-family:var(--f-mono);font-weight:600}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:12px;gap:2px}
.stack i{display:block;height:100%;background:var(--accent)}
.stack i.c{background:var(--signal)}
.lines{list-style:none;margin:0;padding:0}
.lines li{padding:12px 14px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.lines li:first-child{border-top:0}
.lines .nm{font-weight:600}
.lines .amt{font-family:var(--f-mono);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.lines .why{grid-column:1/-1;font-size:13px;color:var(--muted)}
.lines .df{font-size:12px;font-weight:700;color:var(--signal);text-align:right}
.grp{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:16px 2px 6px}
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th,.cmp td{padding:9px 12px;border-top:1px solid var(--line);text-align:right}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp thead th{border-top:0;font-size:12px;color:var(--muted);font-weight:600}
.cmp td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.foot{font-size:12px;color:var(--muted);margin-top:12px}

/* bottom nav */
nav.tabs{max-width:640px;margin:8px auto 0;display:grid;grid-template-columns:repeat(4,1fr);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.tabs button{border:0;background:none;height:44px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;
  border-bottom:3px solid transparent;white-space:nowrap;padding:0 2px}
nav.tabs svg{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
@media (max-width:360px){nav.tabs svg{display:none}}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top wrap">
  <div class="eyebrow">2026학년도 1학년 과제학습답사 · 부산권</div>
  <h1>부산 과제학습답사</h1>
  <div class="facts">
    <span><b>10.21(수) – 10.23(금)</b> 2박 3일</span>
    <span>숙소 <b>아스티 호텔 부산</b></span>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="이름으로 방·좌석 찾기" aria-label="이름 검색">
      <button class="clear" id="qclear" aria-label="검색어 지우기" hidden>×</button>
    </div>
    <div class="seg" role="group" aria-label="팀 선택">
      <button id="teamA" data-team="A" aria-pressed="false">A팀</button>
      <button id="teamB" data-team="B" aria-pressed="false">B팀</button>
    </div>
  </div>
  <nav class="tabs" aria-label="메뉴">
  
    <button data-tab="schedule"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>일정</button>
    <button data-tab="rooms"><svg viewBox="0 0 24 24"><path d="M3 19V9l9-5 9 5v10"/><path d="M9 19v-5h6v5"/></svg>객실</button>
    <button data-tab="train"><svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="14" rx="4"/><path d="M5 11h14M8.5 21l2-3.5M15.5 21l-2-3.5"/><circle cx="9" cy="14.3" r=".6"/><circle cx="15" cy="14.3" r=".6"/></svg>좌석</button>
    <button data-tab="cost"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>경비</button>
</nav>
</div>

<div class="wrap" id="results" hidden></div>

<main class="wrap">
  <section id="schedule"></section>
  <section id="rooms" hidden></section>
  <section id="train" hidden></section>
  <section id="cost" hidden></section>
</main>



<script>
/* ===================== DATA (시트: 과제학습답사(부산)) ===================== */
const TEAMS = {
  A:{name:"A팀", classes:"1반 · 8반", students:65, detail:"1반 33명 · 8반 32명", teachers:"이용기(1반) · 이영신(8반)",
     meet:"07:40", train:"KTX-산천 19열차", dep:"08:35", arr:"11:04", dur:"2시간 29분", bus:"1호차 1반 · 2호차 8반"},
  B:{name:"B팀", classes:"9반 · 11반", students:61, detail:"9반 31명 · 11반 30명", teachers:"김용현(9반) · 김상현(11반) · 김병수(추가 인솔)",
     meet:"07:20", train:"KTX-산천 101열차", dep:"08:08", arr:"11:16", dur:"3시간 08분", bus:"1호차 9반 · 2호차 11반"}
};

// [시간, 제목, 내용, 종류(meal), A·B 차이 안내]
const SCHED = {
 A:[
  [["07:40","서울역 집결","서울역 3층 대합실 · 인원 점검 후 KTX 탑승","", "B팀보다 20분 늦게 집결"],
   ["08:35–11:04","KTX-산천 19열차","서울역 → 부산역","", "B팀과 다른 열차"],
   ["11:04–11:30","부산역 도착 · 버스 탑승","전용버스 2대 (센텀뉴부산관광)"],
   ["12:00–13:00","점심 · 돼지국밥","몽실종가돼지국밥 감천문화마을본점","meal"],
   ["13:30–14:40","흰여울문화마을","해안 절벽 예술마을 탐방·산책","", "B팀은 국립해양박물관 먼저"],
   ["15:00–16:00","국립해양박물관","해양문화·해양산업 전시 관람","", "B팀은 이 시간에 흰여울문화마을"],
   ["16:30–17:30","광안리 해수욕장","백사장 산책 및 해변 관람"],
   ["17:30–18:30","저녁 · 낙곱새","개미집 광안리 본점","meal", "B팀은 18:00 신도시점"],
   ["19:00–19:20","숙소 도착 · 체크인","아스티 호텔 · 객실 배정"],
   ["19:20–22:00","사제간의 시간 · 자유시간","학급별 담임교사 면담 및 휴식"],
   ["22:00","점호 · 취침","안전 취침 점검"]],
  [["08:00–09:30","기상 · 조식","호텔 조식 후 버스 출발","meal"],
   ["10:30–11:40","해동용궁사","해안 사찰 관람 및 역사 탐방"],

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const S={team:store.get("busan.team")==="A"?"A":"B", tab:"schedule", floor:9, trip:"go", q:""};
const $=s=>document.querySelector(s);
const won=n=>n.toLocaleString("ko-KR");
const norm=s=>s.replace(/\s+/g,"");

/* parse seats into flat index */
const SEATS=[];
function parseRows(str){
  return str.split("\n").map(l=>{const p=l.split("|");const rev=/r$/.test(p[0]);return{row:parseInt(p[0]),rev,s:{A:p[1]||"",B:p[2]||"",C:p[3]||"",D:p[4]||""}}});
}
for(const [key,tr] of Object.entries(TRAINS)){
  tr.cars.forEach(c=>{c.parsed=parseRows(c.rows);c.parsed.forEach(r=>{for(const col of "ABCD"){const who=r.s[col];if(who)SEATS.push({key,car:c.no,seat:r.row+col,who,rev:r.rev,row:r})}})});
}
const personName=w=>w.replace(/^교사\s*/,"");
const isStaff=w=>/^교사|안전요원|여행사/.test(w);

/* hotel rooms flat */
const ROOMS=[];
for(const [f,fl] of Object.entries(HOTEL)){
  fl.top.forEach((m,i)=>ROOMS.push(mkRoom(+f,i+1,RTYPE[i],m)));
  fl.bot.forEach((m,i)=>ROOMS.push(mkRoom(+f,24-i,RTYPE[i],m)));
  ROOMS.push(mkRoom(+f,12,"패밀리스위트",fl.s12));
  ROOMS.push(mkRoom(+f,13,"마루스위트",fl.s13));
}
function mkRoom(f,n,type,m){
  const teacher=/T$/.test(m);const ppl=m?(teacher?[m.slice(0,-1)]:m.split(" ")):[];
  return{f,n,no:String(f*100+n),type,teacher,ppl};
}
function teamOf(name){
  const a=SEATS.find(s=>s.key==="goA"&&personName(s.who)===name), b=SEATS.find(s=>s.key==="goB"&&personName(s.who)===name);
  return a&&b?"AB":a?"A":b?"B":"";
}
const roomById=no=>ROOMS.find(r=>r.no===no);

    <div><div class="k">오는 열차 (10/23)</div><div class="v">KTX 40열차<br><span class="mono" style="font-size:14px">14:00→16:45</span></div></div>
    <div class="wide"><div class="k">인솔 교사</div><div class="v">${t.teachers}</div></div>
    <div class="wide"><div class="k">전세버스 (센텀뉴부산관광)</div><div class="v">${t.bus}</div></div>
    <div class="wide"><div class="k">숙소</div><div class="v">아스티 호텔 부산 · 2~3인 1실</div><div style="font-size:12px;color:var(--muted)">부산 동구 중앙대로 214 · 부산역 도보 1분</div></div>
  </div>
  <div class="legend"><span><i class="dot"></i>활동</span><span><i class="dot f"></i>식사</span><span><i class="dot s"></i>${S.team==="A"?"B":"A"}팀과 다른 일정</span></div>`;
  SCHED[S.team].forEach((day,i)=>{
    h+=`<div class="day"><div class="dayhead"><span class="n">${DAYS[i][0]}</span><span class="d">${DAYS[i][1]}</span></div><ol class="tl">`;
    day.forEach(([tm,w,x,k,d])=>{const end=(tm.split("–")[1]||tm).trim();const past=Date.now()-new Date(`2026-10-${21+i}T${end.padStart(5,"0")}:00+09:00`).getTime()>=3600000;
      h+=`<li class="${past?"past ":""}${d?"diff":k==="meal"?"meal":""}"><div class="t">${tm}</div><div class="w">${w}</div><div class="x">${x}</div>${d?`<span class="dn">${d}</span>`:""}</li>`});
    h+=`</ol></div>`;
  });
  $("#schedule").innerHTML=h;
}

function roomHTML(r){
  const vac=!r.ppl.length, any=r.ppl.some(hit);
  const tm=r.teacher?"":[...new Set(r.ppl.map(teamOf).filter(x=>x&&x!=="AB"))];
  const chip=!vac&&!r.teacher&&tm.length===1?`<span class="chip ${tm[0]==="B"?"b":""}" style="height:16px;font-size:10px;padding:0 5px">${tm[0]}</span>`:"";
  return `<div class="room ${vac?"vacant":""} ${r.teacher?"teacher":""} ${any?"hit":""}" id="r${r.no}">
    <div class="rn"><b>${r.no}</b><span style="display:flex;gap:3px;align-items:center">${chip}<span class="tag">${r.type}</span></span></div>
    <div class="ppl">${vac?"배정 없음":r.teacher?r.ppl[0]+" 선생님":r.ppl.join(" · ")}</div></div>`;
}
function renderRooms(){
  const f=S.floor, R=n=>roomById(String(f*100+n));
  let h=`<h2>객실 배정</h2><p class="sub">아스티 호텔 부산 · 8~10층 · 복도를 사이에 두고 마주 보는 방끼리 나란히 배치했어요.</p>
  <div class="seg floors" role="group" aria-label="층 선택" style="display:inline-flex">
    ${[8,9,10].map(x=>`<button data-floor="${x}" aria-pressed="${x===f}">${x}층</button>`).join("")}</div>
  <div class="plan">`;
  for(let c=1;c<=11;c++){
    const mark=c===3||c===6?`<span class="ex">비상구</span>`:c===4?`<span class="ev">EV</span>`:"";
    h+=roomHTML(R(c))+`<div class="hall">${mark?`<span>${mark}</span>`:""}</div>`+roomHTML(R(25-c));
  }
  h+=`</div><div class="grp" style="margin-top:18px">스위트 · STATION VIEW</div><div class="suites">${roomHTML(R(12))}${roomHTML(R(13))}</div>
  <div class="mini-legend"><span><i class="sw t"></i>교사 객실</span><span><i class="sw v"></i>배정 없음</span><span><i class="sw h"></i>검색한 이름</span><span><b style="color:var(--accent)">A</b>/<b style="color:var(--signal)">B</b> 가는 열차 기준 팀</span></div>
  <p class="foot">층별 배정: 안전요원 5명·교사 5명 10객실 포함</p>`;
  $("#rooms").innerHTML=h;
}

function seatHTML(who,code){
  if(!who) return `<div class="seat empty"><small>${code}</small></div>`;
  const staff=isStaff(who);
  return `<div class="seat ${staff?"staff":""} ${hit(personName(who))?"hit":""}" id="s-${code}">${staff?who.replace("교사 ","교사<br>"):who}<small>${code}</small></div>`;
}
function renderTrain(){
  const key=S.trip==="go"?"go"+S.team:"back", tr=TRAINS[key];
  let h=`<h2>KTX 좌석</h2>
  <div class="seg" role="group" aria-label="날짜 선택" style="margin-bottom:12px">
    <button data-trip="go" aria-pressed="${S.trip==="go"}">가는 날 10/21</button>
    <button data-trip="back" aria-pressed="${S.trip==="back"}">오는 날 10/23</button></div>
  <div class="card trainhead"><div style="font-size:12px;color:var(--muted);font-weight:600">${tr.title} · ${tr.note}</div>
    <div class="tn">${tr.name}</div><div class="tt">${tr.dep} → ${tr.arr}<small>${S.trip==="go"?TEAMS[S.team].dur:"2시간 45분"}</small></div></div>`;
  tr.cars.forEach(c=>{
    h+=`<div class="car"><div class="carhead"><b>${c.no}호차</b><span>${c.cap} · 통로는 B·C 사이</span></div><div class="seats">
      <div></div><div class="colh">A</div><div class="colh">B</div><div></div><div class="colh">C</div><div class="colh">D</div>`;
    let skipped=0;
    const flush=()=>{if(skipped){h+=`<div class="gap-row">빈 열 ${skipped}개 생략</div>`;skipped=0}};
    c.parsed.forEach(r=>{
      if(!Object.values(r.s).some(Boolean)){skipped++;return}
      flush();
      const id=n=>`${c.no}-${r.row}${n}`;
      h+=`<div class="rowno">${r.row}${r.rev?"<i>역방향</i>":""}</div>${seatHTML(r.s.A,id("A"))}${seatHTML(r.s.B,id("B"))}<div></div>${seatHTML(r.s.C,id("C"))}${seatHTML(r.s.D,id("D"))}`;
    });
    flush();
    h+=`</div></div>`;
  });
  h+=`<p class="foot">점선 칸은 비어 있는 좌석이에요. 칸 아래 작은 글씨가 호차-좌석 번호입니다.</p>`;
  $("#train").innerHTML=h;
}

function renderCost(){
  const T=S.team, ix=T==="A"?2:3, n=TEAMS[T].students;
  const total=COST.reduce((a,c)=>a+c[ix],0), per=COST.filter(c=>c[0]==="개인").reduce((a,c)=>a+c[ix],0), com=total-per;
  let h=`<h2>${TEAMS[T].name} 1인당 예상 경비</h2>
  <div class="card total"><div class="k">학생 1인당 합계</div><div class="big">${won(total)}<small>원</small></div>
   <div class="split"><span>개인경비 <b>${won(per)}</b></span><span>공통경비 <b>${won(com)}</b></span><span>팀 총액 (${n}명) <b>${won(total*n)}</b></span></div>
   <div class="stack">${COST.map(c=>`<i class="${c[0]==="공통"?"c":""}" style="width:${(c[ix]/total*100).toFixed(2)}%" title="${c[1]}"></i>`).join("")}</div>
   <div class="split" style="margin-top:6px"><span><i class="sw" style="background:var(--accent);border:0"></i>개인경비</span><span><i class="sw" style="background:var(--signal);border:0"></i>공통경비</span></div></div>`;
  ["개인","공통"].forEach(g=>{
    h+=`<div class="grp">${g}경비${g==="공통"?" · 팀 학생 수로 나눈 금액":""}</div><ul class="card lines">`;
    COST.filter(c=>c[0]===g).forEach(c=>{
      const d=c[3]-c[2], dd=T==="B"?d:-d;
      h+=`<li><span class="nm">${c[1]}</span><span class="amt">${won(c[ix])}원</span><span class="why">${T==="B"&&c[5]?c[5]:c[4]}</span>${dd?`<span class="df" style="grid-column:1/-1">${S.team==="A"?"B":"A"}팀보다 ${dd>0?"+":"−"}${won(Math.abs(dd))}원</span>`:""}</li>`;
    });
    h+=`</ul>`;
  });
  h+=`<div class="grp">A팀 · B팀 비교</div><div class="card" style="overflow-x:auto"><table class="cmp"><thead><tr><th>항목</th><th>A팀</th><th>B팀</th><th>차액(B−A)</th></tr></thead><tbody>
  ${COST.map(c=>`<tr><td>${c[1]}</td><td class="n">${won(c[2])}</td><td class="n">${won(c[3])}</td><td class="n" style="color:${c[3]-c[2]?"var(--signal)":"var(--muted)"}">${c[3]-c[2]?(c[3]-c[2]>0?"+":"−")+won(Math.abs(c[3]-c[2])):"0"}</td></tr>`).join("")}
  <tr style="font-weight:700"><td>합계</td><td class="n">550,400</td><td class="n">558,500</td><td class="n" style="color:var(--signal)">+8,100</td></tr></tbody></table></div>
  <p class="foot">B팀이 1인당 8,100원 더 많아요. 식비 +7,000원(2일차 점심), 공통경비 +6,500원(학생 수 차이), KTX −5,400원.</p>`;
  $("#cost").innerHTML=h;
}

/* search */
function renderResults(){
  const box=$("#results");
  if(S.q.length<2){box.hidden=true;box.innerHTML="";return}
  const names=new Set();
  ROOMS.forEach(r=>r.ppl.forEach(p=>{if(norm(p).includes(S.q))names.add(p)}));
  SEATS.forEach(s=>{if(!isStaff(s.who)||/^교사/.test(s.who)){const p=personName(s.who);if(norm(p).includes(S.q))names.add(p)}});
  box.hidden=false;
  if(!names.size){box.innerHTML=`<div class="empty-note">‘${S.q}’ 이름을 찾지 못했어요. 성을 빼고 이름만 넣어 보세요.</div>`;return}
  box.innerHTML=[...names].slice(0,8).map(name=>{
    const rooms=ROOMS.filter(r=>r.ppl.includes(name));
    const go=SEATS.filter(s=>s.key!=="back"&&personName(s.who)===name), back=SEATS.filter(s=>s.key==="back"&&personName(s.who)===name);
    const tm=teamOf(name), teacher=SEATS.some(s=>s.who==="교사 "+name)||rooms.some(r=>r.teacher);
    const dup=rooms.length>1||go.length>1||back.length>1;
    const roomLine=rooms.length?rooms.map(r=>`<button class="jump" data-room="${r.no}">${r.no}호 · ${r.type}</button>${r.teacher?"":r.ppl.length>1?` <span style="color:var(--muted)">같은 방: ${r.ppl.filter(p=>p!==name).join(", ")}</span>`:""}`).join("<br>"):`<span style="color:var(--muted)">시트에 없음</span>`;
    const seatLine=(arr,trip)=>arr.length?arr.map(s=>`<button class="jump" data-seat="${s.key}|${s.car}-${s.seat}">${s.car}호차 ${s.seat}</button>${s.rev?` <span style="color:var(--muted)">역방향</span>`:""}`).join(" "):`<span style="color:var(--muted)">시트에 없음</span>`;
    return `<div class="res"><h3>${name}${teacher?' <span class="chip ghost">교사</span>':""}${tm&&tm!=="AB"?` <span class="chip ${tm==="B"?"b":""}">${tm}팀</span>`:""}</h3>
      <dl><dt>객실</dt><dd>${roomLine}</dd>
      <dt>가는 날</dt><dd>${go.length?TRAINS[go[0].key].name.replace("KTX-","")+" · ":""}${seatLine(go)}</dd>
      <dt>오는 날</dt><dd>${back.length?"KTX 40열차 · ":""}${seatLine(back)}</dd></dl>
      ${dup?`<div class="foot" style="margin-top:8px">같은 이름이 여러 번 나와요. 같은 방 친구 이름으로 본인을 확인하세요.</div>`:""}</div>`;
  }).join("");
}

/* ===================== WIRING ===================== */
function renderAll(){renderSchedule();renderRooms();renderTrain();renderCost();renderResults();syncChrome()}
function syncChrome(){
  document.querySelectorAll(".bar .seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.team===S.team));
  document.querySelectorAll("nav.tabs button").forEach(b=>{if(b.dataset.tab===S.tab)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  ["schedule","rooms","train","cost"].forEach(id=>$("#"+id).hidden=id!==S.tab);
}
function setTab(t,scroll=true){S.tab=t;syncChrome();try{history.replaceState(null,"","#"+t)}catch(e){};if(scroll)window.scrollTo({top:0})}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.team){S.team=b.dataset.team;store.set("busan.team",S.team);renderAll()}
  else if(b.dataset.tab){setTab(b.dataset.tab)}
  else if(b.dataset.floor){S.floor=+b.dataset.floor;renderRooms()}
  else if(b.dataset.trip){S.trip=b.dataset.trip;renderTrain()}
  else if(b.dataset.room){const r=roomById(b.dataset.room);S.floor=r.f;renderRooms();setTab("rooms",false);
    requestAnimationFrame(()=>$("#r"+r.no)?.scrollIntoView({block:"center"}))}
  else if(b.dataset.seat){const [key,id]=b.dataset.seat.split("|");
    if(key==="back")S.trip="back";else{S.trip="go";if(key!=="go"+S.team){S.team=key.slice(2);store.set("busan.team",S.team);renderAll()}}
    renderTrain();setTab("train",false);requestAnimationFrame(()=>document.getElementById("s-"+id)?.scrollIntoView({block:"center"}))}
  else if(b.id==="qclear"){$("#q").value="";onQ()}
});
function onQ(){S.q=norm($("#q").value);$("#qclear").hidden=!S.q;renderResults();renderRooms();renderTrain()}
$("#q").addEventListener("input",onQ);

const h0=(location.hash||"").slice(1);
if(["schedule","rooms","train","cost"].includes(h0))S.tab=h0;
renderAll();
setInterval(()=>{if(S.tab==="schedule")renderSchedule()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)renderSchedule()});
</script>

</body>
</html>
