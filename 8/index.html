<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>지구찾기 | 지뢰찾기</title>
<style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#18324a;background:#eef7f3}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.app{width:min(100%,760px);background:#fff;border-radius:24px;padding:28px;box-shadow:0 18px 60px #174a3820}header{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:clamp(1.6rem,4vw,2.2rem)}.sub{margin:6px 0 0;color:#648071}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}select,button{font:inherit;border:1px solid #c9ddd3;background:#fff;color:#18324a;border-radius:12px;padding:10px 14px}button{cursor:pointer;font-weight:700}button.primary{background:#177b59;color:#fff;border-color:#177b59}.status{display:flex;justify-content:space-between;align-items:center;margin:22px 0 14px;padding:12px 16px;background:#f0f8f3;border-radius:14px;font-weight:700}.board-wrap{overflow:auto;padding-bottom:4px}.board{display:grid;gap:5px;width:max-content;margin:auto;touch-action:manipulation;user-select:none}.cell{width:38px;height:38px;border:0;border-radius:8px;background:#d9e8df;box-shadow:inset 0 -3px #c4d8cb;padding:0;font-size:19px;font-weight:800}.cell:hover:not(.open){background:#c8ded1}.cell.open{background:#f5f8f5;box-shadow:inset 0 0 0 1px #e3ece6;cursor:default}.cell.flag{background:#ffe9b8}.cell.earth{font-size:22px}.n1{color:#2674c9}.n2{color:#278b56}.n3{color:#d05245}.n4{color:#684bb4}.n5{color:#a24d27}.help{margin:16px 2px 0;color:#547064;font-size:.9rem;line-height:1.6}.toast{min-height:1.4em;text-align:center;color:#177b59;font-weight:700;margin-top:8px}@media(max-width:520px){.app{padding:20px 14px}.cell{width:32px;height:32px;font-size:16px}.cell.earth{font-size:19px}.status{margin-top:16px}}
</style>
</head>
<body><main class="app">
<header><div><h1>🌍 지구찾기</h1><p class="sub">숨어 있는 지구를 피해 모든 칸을 열어 보세요.</p></div><div class="controls"><label for="level">난이도</label><select id="level"><option value="easy">하</option><option value="medium">중</option><option value="hard">상</option></select><button id="restart" class="primary">새 게임</button></div></header>
<div class="status"><span id="counter">🌍 0</span><span id="message">칸을 눌러 시작하세요</span><span id="timer">⏱ 0초</span></div><div class="board-wrap"><div id="board" class="board" aria-label="게임 보드"></div></div><div class="toast" id="toast"></div><p class="help">왼쪽 클릭: 칸 열기 · 오른쪽 클릭: 깃발 표시 · <b>좌우 클릭을 함께 누르기: 검사</b><br>검사는 주변 칸의 깃발 수가 숫자와 같을 때, 주변의 깃발 없는 칸을 한꺼번에 엽니다. 모바일에서는 열린 숫자 칸을 다시 누르면 검사할 수 있어요.</p>
</main><script>
(()=>{const levels={easy:{rows:9,cols:9,mines:10},medium:{rows:12,cols:12,mines:22},hard:{rows:14,cols:18,mines:40}};let rows,cols,mineTotal,cells,started,ended,seconds,tick;const board=document.querySelector('#board'),level=document.querySelector('#level'),counter=document.querySelector('#counter'),message=document.querySelector('#message'),timer=document.querySelector('#timer'),toast=document.querySelector('#toast');
function start(){clearInterval(tick);({rows,cols,mines:mineTotal}=levels[level.value]);cells=Array.from({length:rows*cols},(_,i)=>({i,mine:false,open:false,flag:false,n:0}));started=false;ended=false;seconds=0;message.textContent='칸을 눌러 시작하세요';counter.textContent=`🌍 ${mineTotal}`;timer.textContent='⏱ 0초';toast.textContent='';board.style.gridTemplateColumns=`repeat(${cols},var(--cell-width,38px))`;draw()}
function neighbors(i){const r=Math.floor(i/cols),c=i%cols,out=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;let rr=r+dr,cc=c+dc;if(rr>=0&&rr<rows&&cc>=0&&cc<cols)out.push(rr*cols+cc)}return out}
function plant(safe){let pool=cells.filter(x=>x.i!==safe).map(x=>x.i);for(let k=0;k<mineTotal;k++){const p=Math.floor(Math.random()*pool.length),i=pool.splice(p,1)[0];cells[i].mine=true}for(const x of cells)x.n=neighbors(x.i).filter(i=>cells[i].mine).length;started=true;tick=setInterval(()=>{seconds++;timer.textContent=`⏱ ${seconds}초`},1000)}
function reveal(i){const x=cells[i];if(ended||x.open||x.flag)return;if(!started)plant(i);if(x.mine){x.open=true;ended=true;clearInterval(tick);message.textContent='지구를 찾았어요!';cells.forEach(y=>{if(y.mine)y.open=true});draw();return}const stack=[i];while(stack.length){const j=stack.pop(),y=cells[j];if(y.open||y.flag||y.mine)continue;y.open=true;if(y.n===0)stack.push(...neighbors(j))}draw();winCheck()}
function chord(i){const x=cells[i];if(!x.open||x.mine||!x.n||ended)return;const ns=neighbors(i),flags=ns.filter(j=>cells[j].flag).length;if(flags!==x.n){toast.textContent=`깃발 ${flags}개 / 필요한 수 ${x.n}개`;setTimeout(()=>toast.textContent='',1400);return}for(const j of ns)if(!cells[j].flag&&!cells[j].open){reveal(j);if(ended)return}}
function winCheck(){if(cells.every(x=>x.mine||x.open)){ended=true;clearInterval(tick);message.textContent='성공! 모든 안전한 칸을 열었어요 🎉'}}
function draw(){board.replaceChildren();counter.textContent=`🌍 ${cells.filter(x=>x.mine&&!x.open).length} · 🚩 ${cells.filter(x=>x.flag).length}`;cells.forEach(x=>{const b=document.createElement('button');b.className='cell'+(x.open?' open':'')+(x.flag?' flag':'')+(x.open&&x.mine?' earth':'');b.setAttribute('aria-label',x.open?(x.mine?'지구':`숫자 ${x.n}`):x.flag?'깃발 표시된 칸':'닫힌 칸');if(x.open){if(x.mine)b.textContent='🌍';else if(x.n){b.textContent=x.n;b.classList.add(`n${Math.min(x.n,5)}`)}}else if(x.flag)b.textContent='🚩';b.addEventListener('click',e=>{if(x.open)chord(x.i);else reveal(x.i)});b.addEventListener('contextmenu',e=>{e.preventDefault();if(!ended&&!x.open){x.flag=!x.flag;draw()}});let left=false,right=false,holdTimer;b.addEventListener('mousedown',e=>{if(e.button===0)left=true;if(e.button===2)right=true;if(left&&right){clearTimeout(holdTimer);chord(x.i)}});b.addEventListener('mouseup',()=>{left=false;right=false});b.addEventListener('mouseleave',()=>{left=false;right=false});b.addEventListener('touchstart',()=>{if(x.open)holdTimer=setTimeout(()=>chord(x.i),450)},{passive:true});b.addEventListener('touchend',()=>clearTimeout(holdTimer));board.append(b)})}
level.addEventListener('change',start);document.querySelector('#restart').addEventListener('click',start);document.addEventListener('mouseup',()=>{});board.addEventListener('contextmenu',e=>e.preventDefault());start()})();
</script></body></html>
