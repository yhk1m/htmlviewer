:root {
  --navy: #1B2A4A;
  --ink: #FFFFFF;
  --ink-soft: rgba(255,255,255,.72);

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: #0E1628; color: var(--ink);
  font-family: Pretendard, "Pretendard Variable", "Noto Sans KR", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
button, input { font: inherit; color: inherit; }
#phone {

  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
@media (min-width: 600px) {

}
#bars { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; gap: 4px; z-index: 20; }

#bars i b { display: block; height: 100%; width: 0; background: #fff; }
#mode { position: absolute; top: 20px; right: 14px; z-index: 21; font-size: 11px; color: var(--ink-soft); }
.card {
  position: absolute; inset: 0; padding: 40px 24px 20px; display: none; flex-direction: column;
  transition: background-color .4s;
}
.card.on { display: flex; animation: fade .35s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; min-height: 0; }
.kicker { font-size: 14px; font-weight: 600; color: var(--accent); letter-spacing: .02em; }
h1 { font-size: 30px; line-height: 1.25; margin: 0; font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: 22px; line-height: 1.35; margin: 0; font-weight: 700; letter-spacing: -.01em; }
.big { font-size: 88px; line-height: 1; font-weight: 900; letter-spacing: -.04em; }
.big small { font-size: 32px; font-weight: 700; margin-left: 4px; }
.mid { font-size: 40px; font-weight: 800; letter-spacing: -.03em; }
.sub { font-size: 17px; line-height: 1.5; color: var(--ink-soft); }
.sub strong { color: #fff; }
.read { font-size: 12px; line-height: 1.5; color: var(--ink-soft); border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.read b { color: #fff; font-weight: 600; }
.warn { font-size: 13px; color: var(--accent); }
.btn {
  border: 0; border-radius: 12px; padding: 13px 16px; background: #fff; color: var(--navy);
  font-weight: 700; font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn.ghost { background: transparent; color: #fff; border: 1px solid var(--line); }
.btn svg { width: 18px; height: 18px; }
.row { display: flex; gap: 8px; }
.row > * { flex: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: rgba(255,255,255,.08); border-radius: 999px; padding: 7px 12px; font-size: 14px; cursor: pointer; }
.chip:hover { background: rgba(255,255,255,.16); }
.search { display: flex; gap: 6px; }
.search input { flex: 1; min-width: 0; border: 1px solid var(--line); background: rgba(255,255,255,.1); border-radius: 12px; padding: 11px 12px; outline: none; }
.search input::placeholder { color: rgba(255,255,255,.5); }
.search button { flex: 0 0 auto; }
#results { display: flex; flex-direction: column; gap: 4px; max-height: 140px; overflow: auto; }
#results button { text-align: left; border: 0; background: rgba(255,255,255,.08); border-radius: 10px; padding: 9px 12px; cursor: pointer; font-size: 14px; }
#results button span { color: var(--ink-soft); font-size: 12px; margin-left: 6px; }
.map { height: 190px; border-radius: 14px; overflow: hidden; background: rgba(255,255,255,.06); }
.map.tall { height: 230px; }
.picked { font-size: 15px; color: var(--ink-soft); min-height: 22px; }
.picked strong { color: #fff; }
.stat { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 15px; }
.stat dt { color: var(--ink-soft); }
.stat dd { margin: 0; font-weight: 700; text-align: right; }
.prob { background: rgba(255,255,255,.08); border-radius: 14px; padding: 12px 14px; }
.prob .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }

.prob label { font-size: 14px; color: var(--ink-soft); }
.prob input[type=range] { width: 100%; accent-color: var(--accent); }
canvas.spag { width: 100%; height: 140px; display: block; }
.legend { font-size: 11px; color: var(--ink-soft); display: flex; gap: 12px; }

.loading { color: var(--ink-soft); font-size: 15px; display: flex; align-items: center; gap: 10px; }

table.cmp th { font-weight: 600; font-size: 12px; color: var(--ink-soft); }

.q {

.q .opts button:hover { border-color: #7A6AA8; }

.jelly svg { width: 180px; height: auto; }
.tagline { display: flex; flex-direction: column; gap: 8px; }

ul.src span { color: var(--ink-soft); }
a { color: var(--accent); }
.toast { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); background: #fff; color: var(--navy); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 30; opacity: 0; transition: opacity .25s; pointer-events: none; }

  const pKeys = Object.keys(h).filter(k => k === 'precipitation' || k.startsWith('precipitation_member'));
  const idx = [];
  h.time.forEach((t, i) => { if (Number(t.slice(11, 13)) % 6 === 0) idx.push(i); });
  const dates = [...new Set(h.time.map(t => t.slice(0, 10)))];
  return {
    generated: new Date().toISOString(),
    times: idx.map(i => h.time[i]),
    temp: tKeys.map(k => idx.map(i => round(h[k][i]))),
    dates,
    rain: pKeys.map(k => dates.map(d => {
      let s = 0, any = false;
      h.time.forEach((t, i) => { if (t.startsWith(d) && h[k][i] != null) { s += h[k][i]; any = true; } });
      return any ? round(s) : null;
    })),
  };
}
function loadEnsemble(p) {
  if (isDemoPlace(p)) return Promise.resolve(DEMO.wn2);
  return cached('ens:' + ck(p), () => getJSON('https://ensemble-api.open-meteo.com/v1/ensemble'
    + `?latitude=${p.lat}&longitude=${p.lon}&hourly=temperature_2m,precipitation&forecast_days=15&timezone=Asia%2FSeoul&models=google_weathernext2_ensemble`)
    .then(normalizeEnsemble));
}
// 여름(6~8월) 평균 최고, 겨울(12~2월) 평균 최저, 연 강수량
function climateStats(time, tmax, tmin, prcp) {
  const jja = [], djf = [], years = new Set();
  let rain = 0;
  for (let i = 0; i < time.length; i++) {
    const m = Number(time[i].slice(5, 7));
    years.add(time[i].slice(0, 4));
    if (m >= 6 && m <= 8 && tmax[i] != null) jja.push(tmax[i]);
    if ((m === 12 || m <= 2) && tmin[i] != null) djf.push(tmin[i]);
    if (prcp[i] != null) rain += prcp[i];
  }
  return { jjaTmax: mean(jja), djfTmin: mean(djf), annRain: rain / years.size };
}
const MODELS = ['EC_Earth3P_HR', 'MRI_AGCM3_2_S', 'MPI_ESM1_2_XR'];
function loadClimate(p) {
  if (isDemoPlace(p)) return Promise.resolve({ present: DEMO.era5, delta: DEMO.climate.delta });
  return cached('clim:' + ck(p), async () => {
    const vars = '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum';
    const cm = (s, e) => getJSON(`https://climate-api.open-meteo.com/v1/climate?latitude=${p.lat}&longitude=${p.lon}&start_date=${s}&end_date=${e}&models=${MODELS.join(',')}${vars}`);
    const [era, now, fut] = await Promise.all([
      getJSON(`https://archive-api.open-meteo.com/v1/archive?latitude=${p.lat}&longitude=${p.lon}&start_date=2015-01-01&end_date=2024-12-31${vars}&timezone=auto`),
      cm('2015-01-01', '2024-12-31'), cm('2040-01-01', '2049-12-31'),
    ]);
    const present = climateStats(era.daily.time, era.daily.temperature_2m_max, era.daily.temperature_2m_min, era.daily.precipitation_sum);
    const ds = MODELS.map(m => {
      const st = r => climateStats(r.daily.time, r.daily['temperature_2m_max_' + m], r.daily['temperature_2m_min_' + m], r.daily['precipitation_sum_' + m]);
      const a = st(now), b = st(fut);
      return { jjaTmax: b.jjaTmax - a.jjaTmax, djfTmin: b.djfTmin - a.djfTmin, annRain: b.annRain - a.annRain };
    });
    const delta = {};
    for (const k of ['jjaTmax', 'djfTmin', 'annRain']) delta[k] = mean(ds.map(d => d[k]));
    return { present, delta };
  });
}

// 델타 방법 닮은꼴: 후보 도시 표준편차로 표준화한 유클리드 거리
function analogs(me, cities, place) {
  const keys = ['jjaTmax', 'djfTmin', 'annRain'];
  const sd = {};
  for (const k of keys) {
    const v = cities.map(c => c[k]); const m = mean(v);
    sd[k] = Math.sqrt(mean(v.map(x => (x - m) ** 2))) || 1;
  }
  return cities.filter(c => haversine(c, place) > 30)
    .map(c => ({ c, d: Math.sqrt(keys.reduce((s, k) => s + ((c[k] - me[k]) / sd[k]) ** 2, 0)) }))
    .sort((a, b) => a.d - b.d).slice(0, 3);
}

// ---------- 동네 정하기 ----------
function setPlace(p) {
  S.place = p;
  if (STATIONS.length) {
    let best = null, bd = Infinity;
    for (const s of STATIONS) { const d = haversine(p, s); if (d < bd) { bd = d; best = s; } }
    S.station = best; S.dist = bd;
  }
  // 미리 불러오기 (카드 1~4를 보는 동안)
  S.ens = loadEnsemble(p); S.ens.catch(() => {});
  S.clim = loadClimate(p); S.clim.catch(() => {});
  const el = $('#picked');
  if (el) el.innerHTML = `<strong>${esc(p.name)}</strong>` + (S.station ? ` 가장 가까운 관측소는 ${esc(S.station.name)} (${fmt(S.dist, 1)}km)` : '');
  const go = $('#startBtn'); if (go) go.disabled = false;
  if (pickMap && window.L) {
    if (pickMarker) pickMarker.setLatLng([p.lat, p.lon]); else pickMarker = L.circleMarker([p.lat, p.lon], { radius: 8, color: '#fff', weight: 3, fillColor: '#FFD166', fillOpacity: 1 }).addTo(pickMap);
    pickMap.setView([p.lat, p.lon], Math.max(pickMap.getZoom(), 10));
  }
}
async function searchPlace(name) {
  const box = $('#results');
  if (!name.trim()) return;
  box.innerHTML = '<div class="loading"><div class="spin"></div>찾는 중</div>';
  try {
    const u = cc => `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name.trim())}&count=8&language=ko${cc ? '&countryCode=KR' : ''}`;
    let res = (await getJSON(u(true))).results || [];
    if (!res.length) res = (await getJSON(u(false))).results || [];
    if (!res.length) { box.innerHTML = '<div class="sub">찾지 못했어요. 지도에서 직접 눌러 보세요.</div>'; return; }
    box.innerHTML = '';

      const b = document.createElement('button');
      const where = [r.admin1, r.admin2, r.country_code !== 'KR' ? r.country : ''].filter(Boolean).join(' ');
      b.innerHTML = `${esc(r.name)}<span>${esc(where)}</span>`;
      b.onclick = () => { box.innerHTML = ''; setPlace({ name: r.name, lat: r.latitude, lon: r.longitude }); };

    }
  } catch { box.innerHTML = '<div class="sub">지금은 검색하지 못했어요. 빠른 선택이나 지도를 써 보세요.</div>'; }
}

function initPickMap() {

}

function ensProbs(e) {
  const n = e.temp.length;
  const cold = e.temp.filter(m => m.some(v => v != null && v <= S.cold)).length / n;
  const rain = e.rain.filter(m => m.some(v => v != null && v >= S.rain)).length / e.rain.length;
  return { cold: Math.round(cold * 100), rain: Math.round(rain * 100) };
}

    $('#cv', el).textContent = S.cold; $('#rv', el).textContent = S.rain;
    $('#cp', el).textContent = p.cold; $('#rp', el).textContent = p.rain;
    drawSpaghetti($('#spag', el), e);
  };
  $('#cs', el).oninput = upd; $('#rs', el).oninput = upd;
  requestAnimationFrame(() => drawSpaghetti($('#spag', el), e));
}
function drawSpaghetti(cv, e) {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const all = e.temp.flat().filter(v => v != null);
  let lo = Math.min(...all, S.cold), hi = Math.max(...all);
  lo = Math.floor(lo - 1); hi = Math.ceil(hi + 1);
  const L = 30, R = 6, T = 6, B = 18, N = e.times.length;
  const x = i => L + (W - L - R) * i / (N - 1), y = v => T + (H - T - B) * (hi - v) / (hi - lo);
  g.font = '10px Pretendard, sans-serif'; g.fillStyle = 'rgba(255,255,255,.6)'; g.strokeStyle = 'rgba(255,255,255,.12)'; g.lineWidth = 1;
  const stepV = (hi - lo) > 20 ? 10 : 5;
  for (let v = Math.ceil(lo / stepV) * stepV; v <= hi; v += stepV) {
    g.beginPath(); g.moveTo(L, y(v)); g.lineTo(W - R, y(v)); g.stroke();
    g.textAlign = 'right'; g.fillText(v + '℃', L - 4, y(v) + 3);
  }
  g.textAlign = 'center';
  e.times.forEach((t, i) => { if (t.endsWith('T00:00') && (i / 4) % 3 === 0) g.fillText(`${Number(t.slice(5, 7))}/${Number(t.slice(8, 10))}`, x(i), H - 4); });
  g.strokeStyle = 'rgba(140,200,255,.28)'; g.lineWidth = 1;
  for (const m of e.temp) {
    g.beginPath(); let s = false;
    m.forEach((v, i) => { if (v == null) { s = false; return; } s ? g.lineTo(x(i), y(v)) : g.moveTo(x(i), y(v)); s = true; });
    g.stroke();
  }
  g.strokeStyle = '#fff'; g.lineWidth = 2.2; g.beginPath();
  for (let i = 0; i < N; i++) {
    const v = e.temp.map(m => m[i]).filter(a => a != null).sort((a, b) => a - b);
    if (!v.length) continue;
    const med = v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2;
    i ? g.lineTo(x(i), y(med)) : g.moveTo(x(i), y(med));
  }
  g.stroke();
  g.strokeStyle = '#FFD166'; g.setLineDash([5, 4]); g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(L, y(S.cold)); g.lineTo(W - R, y(S.cold)); g.stroke(); g.setLineDash([]);
}

// 카드 7~8
function renderTest(el) {
  el.innerHTML = `<div class="main">
    <div class="kicker">나의 재난 대응 유형 테스트</div>

function showQuestion(el, i) {
  const deck = $('#deck', el);
  if (i >= QUESTIONS.length) { next(); return; }
  const q = QUESTIONS[i];
  deck.innerHTML = `<div class="q"><div><div class="n">${i + 1} / ${QUESTIONS.length}</div><h3>${q.q}</h3></div>
    <div><div class="opts"><button data-a="0">${q.l}</button><button data-a="1">${q.r}</button></div>
    <div class="hint" style="margin-top:8px">왼쪽으로 넘기면 왼쪽 답, 오른쪽이면 오른쪽 답</div></div></div>`;
  const card = $('.q', deck);
  const answer = a => {
    S.answers[i] = a;
    card.style.transition = 'transform .3s, opacity .3s';
    card.style.transform = `translateX(${a ? 420 : -420}px) rotate(${a ? 16 : -16}deg)`; card.style.opacity = 0;
    setTimeout(() => showQuestion(el, i + 1), 260);
  };
  card.querySelectorAll('[data-a]').forEach(b => b.onclick = ev => { ev.stopPropagation(); answer(Number(b.dataset.a)); });
  let x0 = null, dx = 0;
  card.addEventListener('pointerdown', ev => { if (ev.target.closest('button')) return; x0 = ev.clientX; dx = 0; card.setPointerCapture(ev.pointerId); card.style.transition = 'none'; });
  card.addEventListener('pointermove', ev => { if (x0 == null) return; dx = ev.clientX - x0; card.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`; });
  const end = () => { if (x0 == null) return; x0 = null; if (Math.abs(dx) > 80) answer(dx > 0 ? 1 : 0); else { card.style.transition = 'transform .2s'; card.style.transform = ''; } };
  card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
}
function myType() {
  const a = S.answers;
  const t = { prep: a[0] ? '미리' : '닥쳐서', info: a[1] ? '주변' : '공식', scope: a[2] ? '함께' : '나', bag: !!a[3] };
  return Object.assign(t, TYPES[t.prep + t.info + t.scope]);
}
function jelly(t) {
  const body = t.prep === '미리' ? '#5CC8A8' : '#FF8A65', dark = t.prep === '미리' ? '#3E9C82' : '#D9694A';
  const blob = (cx, s, fill, edge) => `<g transform="translate(${cx} ${150 - 130 * s}) scale(${s})">
    <path d="M70 6C108 6 132 46 134 86c2 34-22 44-64 44S4 120 6 86C8 46 32 6 70 6Z" fill="${fill}" stroke="${edge}" stroke-width="${3 / s}"/>
    <ellipse cx="46" cy="36" rx="14" ry="8" fill="#fff" opacity=".45" transform="rotate(-25 46 36)"/>
    <circle cx="52" cy="74" r="6" fill="#1B2A4A"/><circle cx="88" cy="74" r="6" fill="#1B2A4A"/>
    <circle cx="54" cy="72" r="2" fill="#fff"/><circle cx="90" cy="72" r="2" fill="#fff"/>
    <path d="M60 92q10 9 20 0" fill="none" stroke="#1B2A4A" stroke-width="${3 / s}" stroke-linecap="round"/>
    <circle cx="40" cy="90" r="6" fill="#FF6B8B" opacity=".35"/><circle cx="100" cy="90" r="6" fill="#FF6B8B" opacity=".35"/></g>`;
  const main = blob(t.scope === '함께' ? 20 : 40, 1, body, dark);
  const friend = t.scope === '함께' ? blob(150, .5, '#FFD166', '#D9A93A') : '';
  // 공식: 손에 든 휴대폰(알림), 주변: 머리 위 더듬이
  const prop = t.info === '공식'
    ? `<g transform="translate(${t.scope === '함께' ? 140 : 168} 70)"><rect x="0" y="0" width="22" height="36" rx="4" fill="#1B2A4A" stroke="#fff" stroke-width="2"/><rect x="4" y="5" width="14" height="20" rx="1" fill="#8CC8FF"/><path d="M27 6q5 6 0 12M31 2q8 10 0 20" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></g>`
    : `<g transform="translate(${t.scope === '함께' ? 90 : 110} 0)"><path d="M0 26Q4 10 -2 2" fill="none" stroke="${dark}" stroke-width="3" stroke-linecap="round"/><circle cx="-2" cy="2" r="5" fill="#FFD166" stroke="${dark}" stroke-width="2"/></g>`;
  return `<svg viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${t.name}">${friend}${main}${prop}</svg>`;
}

// 카드 9
async function myActions() {
  const t = myType(), out = [];
  out.push(t.prep === '닥쳐서' ? ACTIONS.late : !t.bag ? ACTIONS.noBag : t.info === '주변' ? ACTIONS.around : ACTIONS.ready);
  let line2 = null;
  const y = ty(), o = S.station && S.station.y1990s;
  if (y && y.maxRain.mm >= 80) line2 = ACTIONS.rain(fmt(y.maxRain.mm, 1));
  else if (y && o && y.heatDays - o.heatDays >= 5) line2 = ACTIONS.heat(fmt(y.heatDays - o.heatDays, 1));
  else {
    try {
      const e = await Promise.race([S.ens, new Promise((_, r) => setTimeout(r, 3000))]);
      const n = e.temp.length, p = Math.round(e.temp.filter(m => m.some(v => v != null && v <= -10)).length / n * 100);
      if (p >= 30) line2 = ACTIONS.cold(p);
    } catch {}
  }
  out.push(line2 || ACTIONS.base);
  out.push(t.scope === '함께' ? ACTIONS.together : ACTIONS.alone);
  return out;
}
async function renderMyCard(el) {
  const t = myType();
  el.innerHTML = '<div class="main"><div class="loading"><div class="spin"></div>나만의 대응 카드를 만드는 중</div></div>';
  const acts = await myActions();
  S.acts = acts;
  el.innerHTML = `<div class="main">
    <div class="kicker">나만의 대응 카드</div>
    <h2>${esc(S.place.name)}에 사는<br>${t.name}의 할 일 3가지</h2>
    <ol class="acts">${acts.map(a => `<li>${esc(a)}</li>`).join('')}</ol>
    <button class="btn" id="saveImg">${ICON.down}공유 이미지 저장</button>
    <div class="row"><button class="btn ghost" id="copyLink">${ICON.link}링크 복사</button><button class="btn ghost" id="restart">${ICON.again}처음부터</button></div>
  </div><div class="read">이 앱은 교육용입니다. 대피 판단은 기상청 특보와 긴급재난문자를 따르세요.</div>`;
  $('#saveImg', el).onclick = saveImage;

  $('#restart', el).onclick = restart;
}
async function saveImage() {
  if (!window.htmlToImage) { toast('이미지 도구를 불러오지 못했어요'); return; }
  const t = myType(), y = ty(), o = S.station && S.station.y1990s;
  const n1 = y ? `<div><b>${y.rainDays}일</b><span>올해 비나 눈이 온 날</span></div>` : '';
  const n2 = y && o ? `<div><b>${signed(round(y.heatDays - o.heatDays))}일</b><span>1990년대보다 늘어난 폭염일</span></div>`
    : y ? `<div><b>${fmt(y.rainTotal)}</b><span>올해 강수량(mm)</span></div>` : '';
  const node = $('#share');
  node.innerHTML = `<div class="k">${until() ? md(until()) + '까지의 기록' : ''}</div>
    <div class="t">${esc(S.place.name)}의<br>${until() ? until().slice(0, 4) : ''} 날씨 결산</div>
    ${n1 || n2 ? `<div class="nums">${n1}${n2}</div>` : ''}
    ${S.analog ? `<div class="an">2040년대 ${esc(S.place.name)}의 기후는<br>지금의 <strong>${esc(wa(S.analog.name))}</strong> 닮았어요</div>` : ''}
    <div class="ty">${jelly(t)}<b>${t.name}</b></div>
    <ol>${(S.acts || []).map(a => `<li>${esc(a)}</li>`).join('')}</ol>
    <div class="foot">기상청 지상관측자료(기상자료개방포털) / WeatherNext 2 &copy; Google DeepMind / CMIP6, ERA5 &copy; Copernicus, ECMWF / Weather data by Open-Meteo.com<br>교육용 자료예요. 대피 판단은 기상청 특보와 긴급재난문자를 따르세요.</div>`;
  toast('이미지를 만드는 중이에요');
  try {
    const url = await htmlToImage.toPng(node, { width: 1080, height: 1920, pixelRatio: 1, style: { left: '0', position: 'static' } });
    const file = `climate-wrapped-${(until() || '').slice(0, 4)}.png`;
    const blob = await (await fetch(url)).blob();
    const f = new File([blob], file, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [f] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
      await navigator.share({ files: [f], title: '우리 동네 기후 Wrapped' }).catch(() => {});
    } else {
      const a = document.createElement('a'); a.href = url; a.download = file; a.click();
      toast('이미지를 저장했어요');
    }
  } catch (e) { toast('이미지를 만들지 못했어요'); console.error(e); }
}

// ---------- 스토리 진행 ----------
const AUTO_MS = 10000;
let cur = 0, elapsed = 0, paused = false, lastT = 0;
const cardEls = [];
function buildCards() {
  const box = $('#cards');
  CARDS.forEach(c => {
    const el = document.createElement('section');
    el.className = 'card'; el.dataset.id = c.id; el.style.background = c.bg;
    box.appendChild(el); cardEls.push(el);
  });
}
const isSkipped = i => !!(CARDS[i].skip && CARDS[i].skip());
function show(i) {
  cardEls[cur].classList.remove('on');
  cur = i; elapsed = 0;
  const c = CARDS[i], el = cardEls[i];
  el.classList.add('on');
  if (!c.once || !el.dataset.done) { c.render(el); el.dataset.done = 1; countUp(el); }
  if (c.shown) c.shown();
  drawBars();
}
function canLeave(dir) {
  const id = CARDS[cur].id;
  if (dir > 0 && id === 'intro' && !S.place) { const b = $('#startBtn'); if (b) { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); } return false; }
  if (dir > 0 && id === 'test' && S.answers.filter(a => a != null).length < QUESTIONS.length) return false;
  return true;
}
function next() {
  if (!canLeave(1)) return;
  let i = cur + 1; while (i < CARDS.length && isSkipped(i)) i++;
  if (i < CARDS.length) show(i);
}
function prev() {
  let i = cur - 1; while (i > 0 && isSkipped(i)) i--;
  if (i >= 0) show(i);
}
function restart() { S.answers = []; S.acts = null; S.analog = null; show(0); }
function drawBars() {
  const bars = $('#bars');
  const vis = CARDS.map((c, i) => i).filter(i => !isSkipped(i));
  bars.innerHTML = vis.map(i => `<i><b style="width:${i < cur ? 100 : 0}%"></b></i>`).join('');
  bars.dataset.cur = vis.indexOf(cur);
  $('#mode').textContent = PRESENT ? '발표자 모드' : (DEMO ? '데모 모드' : '');
}
function tick(t) {
  const dt = lastT ? t - lastT : 0; lastT = t;
  const c = CARDS[cur];
  const bar = $('#bars').children[Number($('#bars').dataset.cur)];
  if (bar) {
    if (c.auto && !PRESENT && !paused) {
      elapsed += dt;
      if (elapsed >= AUTO_MS) next();
    }
    if (bar.firstChild) bar.firstChild.style.width = (c.auto && !PRESENT ? Math.min(100, elapsed / AUTO_MS * 100) : 100) + '%';
  }
  requestAnimationFrame(tick);
}
// 오른쪽 탭 다음, 왼쪽 탭 이전, 길게 누르면 일시정지
function bindInput() {
  const phone = $('#phone');
  let down = 0, longT = null, wasLong = false;
  const interactive = e => e.target.closest('button, input, a, label, select, .leaflet-container, .deck, #results, .no-tap');
  phone.addEventListener('pointerdown', e => {
    if (interactive(e)) return;
    down = Date.now(); wasLong = false;
    longT = setTimeout(() => { paused = true; wasLong = true; }, 300);
  });
  const up = () => { clearTimeout(longT); paused = false; };
  phone.addEventListener('pointerup', up); phone.addEventListener('pointercancel', up); phone.addEventListener('pointerleave', up);
  phone.addEventListener('click', e => {
    if (interactive(e) || wasLong) { wasLong = false; return; }
    const r = phone.getBoundingClientRect();
    if (e.clientX - r.left < r.width * 0.3) prev(); else next();
  });
  document.addEventListener('keydown', e => {
    if (e.target.matches('input[type=text], input:not([type])')) return;
    if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
    else if (e.key === 'p' || e.key === 'P') { PRESENT = !PRESENT; elapsed = 0; drawBars(); }
  });
}

function showQR() {
  $('#qr').classList.add('on');
  $('#qrurl').textContent = BASE_URL;
  if (window.qrcode) {
    const q = qrcode(0, 'M'); q.addData(BASE_URL); q.make();
    $('#qrcode').innerHTML = q.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
  } else $('#qrcode').textContent = 'QR 도구를 불러오지 못했어요';
}

buildCards();
bindInput();
show(0);
if (DEMO) setPlace({ name: '이화여대', lat: DEMO.lat, lon: DEMO.lon });
if (Q.get('qr') === '1') showQR();
requestAnimationFrame(tick);
