<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>에너지 흐름 · 3D</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1d1d1f;background:#f5f5f7}header{height:66px;background:#fff;border-bottom:1px solid #e8e8ed;display:flex;align-items:center;padding:0 26px;font-weight:750;font-size:20px;letter-spacing:-.6px}header span{font-size:13px;color:#86868b;margin-left:10px}main{height:calc(100dvh - 66px);min-height:550px;display:grid;grid-template-columns:240px minmax(0,1fr) 260px}aside{background:#fff;padding:28px 20px;overflow:auto}.left{border-right:1px solid #e8e8ed}.right{border-left:1px solid #e8e8ed}h2{font-size:12px;color:#86868b;margin:0 0 13px;font-weight:650}section{margin-bottom:30px}.tabs{display:flex;gap:5px}.tabs button{flex:1;border:0;border-radius:9px;padding:11px 4px;background:#f5f5f7;color:#555;font-size:12px;cursor:pointer}.tabs button.active{background:#1d1d1f;color:#fff}select{width:100%;border:1px solid #e8e8ed;background:#f5f5f7;border-radius:10px;padding:12px;color:#1d1d1f;font-size:14px}.legend{display:flex;align-items:center;gap:9px;margin:14px 0;font-size:13px}.dot{width:10px;height:10px;border-radius:50%}.viewer{position:relative;min-width:0;overflow:hidden;background:radial-gradient(ellipse at center,#293c56,#0d1626 75%)}#globe{width:100%;height:100%}#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;background:#101b2a;font-size:14px;padding:30px;text-align:center;z-index:5}.chip{position:absolute;top:18px;left:18px;background:#fff;border-radius:24px;padding:10px 16px;font-size:12px;font-weight:650;pointer-events:none}#name{font-size:28px;font-weight:750;letter-spacing:-1px;margin:4px 0}#english{font-size:13px;color:#86868b;margin-bottom:25px}.group{border-top:1px solid #ededf0;padding:19px 0}.grouphead{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:12px}.grouphead span{color:#86868b;font-weight:400}.trade{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:9px 0}.trade b{font-variant-numeric:tabular-nums}.empty{color:#86868b;font-size:13px}@media(max-width:900px){main{grid-template-columns:190px minmax(0,1fr)}.right{grid-column:1/-1;border-left:0;border-top:1px solid #eee}main{height:auto}.viewer{height:550px}}@media(max-width:600px){main{display:flex;flex-direction:column}.left{padding:20px}.viewer{height:480px}.right{padding:22px}header{height:58px}}
</style></head><body><header>에너지 흐름 <span>2023 · 시뮬레이션</span></header><main><aside class="left"><section><h2>에너지 자원</h2><div class="tabs" id="tabs"><button class="active" data-f="coal">석탄</button><button data-f="oil">석유</button><button data-f="gas">천연가스</button></div></section><section><h2>국가</h2><select id="country"></select></section><section><h2>자원 이동</h2><div class="legend"><i class="dot" style="background:#ff8c61"></i>수출 →</div><div class="legend"><i class="dot" style="background:#40b4f5"></i>수입 ←</div><div class="legend"><i class="dot" style="background:#b49bff"></i>생산량</div></section></aside><div class="viewer"><div id="globe"></div><div id="loading">3D 지구본 불러오는 중…</div><div class="chip" id="chip">석탄 · 수출입</div></div><aside class="right"><h2>선택 국가</h2><div id="name"></div><div id="english"></div><div id="details"></div></aside></main>
<script>
// 시각화 예시 데이터. 실제 2023년 양자 교역 통계가 아님.
const countries={CN:['중국','China',35.9,104.2],IN:['인도','India',20.6,79],US:['미국','United States',39,-98.6],ID:['인도네시아','Indonesia',-2.5,118],AU:['오스트레일리아','Australia',-25.3,133.8],RU:['러시아','Russia',61.5,105.3],JP:['일본','Japan',36.2,138.3],SA:['사우디아라비아','Saudi Arabia',24,45],CA:['캐나다','Canada',56,-106],IQ:['이라크','Iraq',33.2,43.7],KR:['대한민국','South Korea',36.2,127.8],DE:['독일','Germany',51.2,10.5],QA:['카타르','Qatar',25.3,51.2],NO:['노르웨이','Norway',61,8],DZ:['알제리','Algeria',28,2.5],AE:['아랍에미리트','United Arab Emirates',24,54],IT:['이탈리아','Italy',42.8,12.6]};
const data={coal:[['ID','CN',90],['ID','IN',60],['AU','JP',85],['AU','KR',47],['AU','CN',55],['RU','CN',48],['RU','IN',32],['US','JP',20],['CA','KR',15],['CN','KR',8]],oil:[['SA','CN',92],['SA','IN',73],['SA','JP',60],['RU','CN',70],['RU','IN',58],['CA','US',88],['IQ','IN',45],['AE','JP',36],['US','KR',35],['NO','DE',28],['US','CN',19]],gas:[['US','JP',80],['US','KR',70],['US','DE',55],['QA','CN',75],['QA','IN',65],['QA','JP',55],['RU','CN',63],['NO','DE',67],['DZ','IT',35],['AU','JP',72],['AU','KR',48],['CA','US',25]]};
// 학습용 시뮬레이션: 기존 표본에 없는 연결은 결정적 예시값으로 보충한다.
const production={coal:{CN:100,IN:38,ID:29,US:17,AU:14,RU:12,CA:3,KR:1,JP:0.2,DE:2},oil:{US:100,SA:72,RU:65,CA:48,IQ:38,CN:32,AE:30,NO:17,IN:9},gas:{US:100,RU:68,CN:42,QA:25,AU:22,CA:20,NO:15,DZ:10,SA:8}};
function stableValue(a,b,f){let h=17;for(const ch of a+b+f)h=(h*31+ch.charCodeAt(0))%9973;return 12+(h%55)}
function flowsFor(f){const rows=data[f].map(r=>[...r]);const ids=Object.keys(countries);for(const id of ids){for(const direction of [0,1]){let n=rows.filter(r=>r[direction]===id).length;if(n>=3)continue;const partners=ids.filter(other=>other!==id&&!rows.some(r=>direction===0?r[0]===id&&r[1]===other:r[1]===id&&r[0]===other)).sort((a,b)=>stableValue(id,b,f)-stableValue(id,a,f));for(const other of partners){if(n>=3)break;const from=direction===0?id:other,to=direction===0?other:id;if(rows.some(r=>r[0]===from&&r[1]===to))continue;rows.push([from,to,stableValue(from,to,f),true]);n++}}}return rows}
const labels={coal:'석탄',oil:'석유',gas:'천연가스'};let fuel='coal',selected='CN',globe=null,borders=[];const el=id=>document.getElementById(id);
function code(f){const p=f.properties||{};return String(p.ISO_A2_EH||p.ISO_A2||p.iso_a2||'').toUpperCase()}
function choose(id){if(!countries[id])return;selected=id;render();if(globe)globe.pointOfView({lat:countries[id][2],lng:countries[id][3],altitude:2.1},800)}
function render(){el('country').value=selected;el('name').textContent=countries[selected][0];el('english').textContent=countries[selected][1];el('chip').textContent=labels[fuel]+' · 수출입';document.querySelectorAll('[data-f]').forEach(b=>b.classList.toggle('active',b.dataset.f===fuel));const allFlows=flowsFor(fuel);const flows=allFlows.filter(r=>r[0]===selected||r[1]===selected);const max=Math.max(...allFlows.map(r=>r[2]));let html='';for(const [title,index,other] of [['수출',0,1],['수입',1,0]]){const arr=flows.filter(r=>r[index]===selected).sort((a,b)=>b[2]-a[2]);html+='<div class="group"><div class="grouphead">'+title+'<span>'+arr.length+'</span></div>'+(arr.length?arr.map(r=>'<div class="trade"><span>'+countries[r[other]][0]+(r[3]?' · 예시':'')+'</span><b>'+r[2]+'</b></div>').join(''):'<div class="empty">연결 없음</div>')+'</div>'}el('details').innerHTML='<div class="group"><div class="grouphead">생산량 지수<span>예시</span></div><div style="font-size:25px;font-weight:700">'+(production[fuel][selected]||0)+'</div></div>'+html;
if(!globe)return;const arcs=flows.map((r,i)=>({startLat:countries[r[0]][2],startLng:countries[r[0]][3],endLat:countries[r[1]][2],endLng:countries[r[1]][3],color:r[0]===selected?'#ff8c61':'#40b4f5',stroke:0.45+3.2*Math.sqrt(r[2]/max),alt:.16+i*.012,label:countries[r[0]][0]+' → '+countries[r[1]][0]+(r[3]?' (예시 연결)':'')}));const ids=[...new Set([selected,...flows.flatMap(r=>[r[0],r[1]])])];globe.arcsData(arcs).pointsData(ids.map(id=>({id,lat:countries[id][2],lng:countries[id][3],color:id===selected?'#fff':'#ffc48c',radius:id===selected?.32:.17})));const prodMax=Math.max(...Object.values(production[fuel]));globe.pointsData(ids.map(id=>({id,lat:countries[id][2],lng:countries[id][3],color:id===selected?'#fff':'#ffc48c',radius:id===selected?.32:.17})));globe.objectsData(Object.keys(countries).map(id=>({id,lat:countries[id][2],lng:countries[id][3],value:production[fuel][id]||0,max:prodMax})));if(borders.length)globe.polygonsData(borders)}
function start(){if(typeof Globe!=='function'){el('loading').textContent='지구본 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.';return}try{globe=Globe()(el('globe'));globe.globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg').backgroundColor('rgba(0,0,0,0)').showAtmosphere(true).atmosphereColor('#91bfff').objectLat('lat').objectLng('lng').objectAltitude(.02).objectThreeObject(d=>{const T=window.THREE;if(!T||!T.CylinderGeometry)return null;const h=.04+.36*Math.sqrt(d.value/d.max);const g=new T.CylinderGeometry(.013,.013,h,10);const m=new T.MeshBasicMaterial({color:d.id===selected?0xd4b5ff:0x9877df,transparent:true,opacity:.86});const mesh=new T.Mesh(g,m);mesh.position.y=h/2;return mesh}).pointLat('lat').pointLng('lng').pointColor('color').pointRadius('radius').pointAltitude(.015).pointLabel(p=>countries[p.id][0]).onPointClick(p=>choose(p.id)).arcColor('color').arcStroke('stroke').arcAltitude('alt').arcDashLength(.16).arcDashGap(.12).arcDashAnimateTime(2100).arcLabel('label').polygonCapColor(f=>code(f)===selected?'rgba(255,215,95,.28)':'rgba(0,0,0,0)').polygonSideColor(()=>'rgba(0,0,0,0)').polygonStrokeColor(f=>code(f)===selected?'#ffdb6a':'rgba(140,170,205,.22)').polygonAltitude(f=>code(f)===selected?.012:.001).onPolygonClick(f=>choose(code(f)));globe.controls().autoRotate=false;globe.pointOfView({lat:30,lng:85,altitude:2.5});const resize=()=>{const box=el('globe');globe.width(box.clientWidth).height(box.clientHeight)};resize();window.addEventListener('resize',resize);if(window.ResizeObserver)new ResizeObserver(resize).observe(el('globe'));render();el('loading').style.display='none';fetch('https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson').then(r=>r.ok?r.json():Promise.reject()).then(j=>{borders=j.features||[];render()}).catch(()=>{});}catch(e){el('loading').textContent='3D 표시 오류: '+e.message;console.error(e)}}
el('country').innerHTML=Object.entries(countries).sort((a,b)=>a[1][0].localeCompare(b[1][0],'ko')).map(([id,c])=>'<option value="'+id+'">'+c[0]+'</option>').join('');el('country').onchange=e=>choose(e.target.value);el('tabs').onclick=e=>{const b=e.target.closest('[data-f]');if(b){fuel=b.dataset.f;render()}};render();
</script><script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/globe.gl@2.45.0/dist/globe.gl.min.js" onload="start()" onerror="document.getElementById('loading').textContent='3D 라이브러리 연결 실패. 인터넷 연결을 확인해 주세요.'"></script></body></html>
