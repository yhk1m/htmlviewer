<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지형 형성 실험실</title>
<style>
  :root { --ink:#f3f1ea; --sub:#b9b8ae; --line:rgba(255,255,255,.18); --accent:#e4b15a; }
  * { box-sizing:border-box; }
  body { margin:0; background:#1b1f1d; color:var(--ink); font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  main { max-width:880px; margin:0 auto; padding:48px 20px 64px; }
  h1 { font-size:34px; margin:0 0 8px; letter-spacing:-.02em; }
  main > p { color:var(--sub); font-size:17px; line-height:1.6; margin:0 0 32px; }
  h2 { font-size:15px; color:var(--accent); margin:32px 0 6px; }
  .scene { display:flex; justify-content:space-between; gap:16px; align-items:baseline; padding:14px 2px; border-top:1px solid var(--line); color:inherit; text-decoration:none; }
  a.scene:hover b { color:var(--accent); }
  .scene b { font-size:20px; display:block; margin-bottom:3px; }
  .scene span { font-size:14px; color:var(--sub); }
  .scene em { font-style:normal; font-size:13px; color:var(--sub); white-space:nowrap; }
  a.scene em { color:var(--accent); }
  .off b { color:var(--sub); }
</style>
</head>
<body>
<main>
  <h1>지형 형성 실험실</h1>
  <p>지형이 어떻게 만들어지는지 3D로 쌓아 보고, 조건을 바꿔 비교합니다.</p>
  <div id="list"></div>
</main>
<script type="module">
  import { SCENES } from './shared/scenes.js';
  const rows = area => SCENES.filter(s => s.area === area).map(s => s.href
    ? `<a class="scene" href="./${s.href}"><div><b>${s.name}</b><span>${s.shows}</span></div><em>열기</em></a>`
    : `<div class="scene off"><div><b>${s.name}</b><span>${s.shows}</span></div><em>준비 중</em></div>`).join('');
  document.getElementById('list').innerHTML = `<h2>하천</h2>${rows('하천')}<h2>해안</h2>${rows('해안')}`;
  window.__APP_READY = true;
</script>
</body>
</html>
