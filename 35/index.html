<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지형 형성 실험실</title>
<style>
  :root { --ink:#111; --sub:#6b6b6b; --line:#e5e5e5; }
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:var(--ink); font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; letter-spacing:-.02em; }
  .wrap { max-width:1120px; margin:0 auto; padding:0 40px; }
  header { border-bottom:1px solid var(--line); }
  header .wrap { display:flex; align-items:center; justify-content:space-between; height:84px; }
  .brand { font-size:19px; font-weight:800; letter-spacing:-.05em; color:#000; text-decoration:none; }
  header nav { display:flex; gap:28px; }
  header nav a { font-size:17px; color:#666; text-decoration:none; }
  header nav a:hover { color:#000; }
  .hero { padding-top:120px; padding-bottom:96px; }
  .hero h1 { margin:0; font-size:72px; line-height:1.15; font-weight:400; letter-spacing:-.06em; color:#000; }
  .hero p { margin:40px 0 0; max-width:560px; font-size:18px; line-height:1.8; color:#111; }
  #list { padding-bottom:120px; }
  .area { display:grid; grid-template-columns:220px 1fr; gap:40px; padding-top:56px; }
  .area h2 { margin:0; font-size:36px; font-weight:700; letter-spacing:-.05em; line-height:1.2; color:#000; padding-top:14px; }
  .area h2 small { display:block; margin-top:10px; font-size:15px; font-weight:400; letter-spacing:-.01em; color:var(--sub); }
  .area ul { list-style:none; margin:0; padding:0; border-top:1px solid #111; }
  .scene { display:flex; justify-content:space-between; gap:24px; align-items:center; padding:22px 8px; border-bottom:1px solid var(--line); color:inherit; text-decoration:none; }
  .scene b { display:block; font-size:22px; font-weight:600; letter-spacing:-.04em; color:#000; margin-bottom:6px; }
  .scene span { font-size:15px; color:var(--sub); line-height:1.6; }
  .scene em { font-style:normal; font-size:14px; color:#999; white-space:nowrap; }
  a.scene:hover { background:#fafafa; }
  a.scene:hover em { color:#000; }
  a.scene em::after { content:""; display:inline-block; width:7px; height:7px; margin-left:8px; border-top:1.5px solid currentColor; border-right:1.5px solid currentColor; transform:rotate(45deg) translateY(-1px); }
  .off b { color:#aaa; }
  footer { background:#000; color:#9a9a9a; padding:72px 0 88px; font-size:14px; line-height:1.8; }
  footer h3 { margin:0 0 20px; font-size:15px; font-weight:700; color:#fff; letter-spacing:-.02em; }
  footer ul { list-style:none; margin:0; padding:0; }
  footer li + li { margin-top:4px; }
  footer a { color:#c8c8c8; }
  @media (max-width:820px) {
    .wrap { padding:0 16px; }
    header .wrap { height:60px; }
    header nav { gap:16px; }
    header nav a { font-size:15px; }
    .hero { padding-top:64px; padding-bottom:48px; }
    .hero h1 { font-size:38px; letter-spacing:-.05em; }
    .hero p { margin-top:24px; font-size:16px; }
    .area { grid-template-columns:1fr; gap:12px; padding-top:40px; }
    .area h2 { padding-top:0; font-size:26px; display:flex; align-items:baseline; gap:10px; }
    .area h2 small { margin-top:0; font-size:14px; }
    .scene { padding:18px 4px; }
    .scene b { font-size:19px; }
    .scene span { font-size:14px; }
    footer { padding:48px 0 64px; }
  }
  .theme-btn { position:fixed; right:24px; top:24px; z-index:5; font:inherit; font-size:14px; padding:7px 12px; color:#333; background:#fff; border:1px solid #d4d4d4; cursor:pointer; }
  .theme-btn:hover { border-color:#111; color:#111; }
  html[data-theme="dark"] body { background:#16191a; color:#eceae3; }
  html[data-theme="dark"] .hero h1, html[data-theme="dark"] .area h2, html[data-theme="dark"] .scene b { color:#f3f1ea; }
  html[data-theme="dark"] .area ul { border-top-color:#eceae3; }
  html[data-theme="dark"] .scene { border-bottom-color:#2e3332; }
  html[data-theme="dark"] .scene span { color:#a5a59c; }
  html[data-theme="dark"] a.scene:hover { background:#1e2223; }
  html[data-theme="dark"] a.scene:hover em { color:#fff; }
  html[data-theme="dark"] .off b { color:#666; }
  html[data-theme="dark"] .theme-btn { color:#eceae3; background:#1e2223; border-color:#3a3f3e; }
  @media (max-width:820px) { .theme-btn { right:12px; top:12px; font-size:13px; padding:6px 10px; } }
</style>
<script>try{if(localStorage.getItem('landform-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body>
<main>
  <section class="hero wrap">
    <h1>지형 형성 실험실</h1>
  </section>
  <div id="list" class="wrap"></div>
</main>
<footer>
  <div class="wrap">
    <h3>제작</h3>
    <ul>
      <li>김용현(서울대학교 지리교육과 석사과정, <a href="mailto:mapper@snu.ac.kr">mapper@snu.ac.kr</a>)</li>
      <li>김한성(서울대학교 지리교육과 석사과정, <a href="mailto:gkstjd96@snu.ac.kr">gkstjd96@snu.ac.kr</a>)</li>
    </ul>
  </div>
</footer>
<script type="module">
  import { SCENES } from './shared/scenes.js';
  const rows = area => SCENES.filter(s => s.area === area).map(s => s.href
    ? `<li><a class="scene" href="./${s.href}"><div><b>${s.name}</b><span>${s.shows}</span></div><em>열기</em></a></li>`
    : `<li><div class="scene off"><div><b>${s.name}</b><span>${s.shows}</span></div><em>준비 중</em></div></li>`).join('');
  document.getElementById('list').innerHTML = ['하천', '해안', '산지', '카르스트', '화산'].map(a => `<section class="area" id="area-${a}"><h2>${a}<small>${SCENES.filter(s => s.area === a).length}개 장면</small></h2><ul>${rows(a)}</ul></section>`).join('');
  window.__APP_READY = true;
</script>
<script type="module" src="./shared/theme.js"></script>
</body>
</html>
