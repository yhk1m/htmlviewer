<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>선상지 형성 모형</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<style>
  :root { --ink:#f3f1ea; --glass:rgba(22,26,24,.78); --line:rgba(255,255,255,.2); --accent:#e4b15a; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:#20262a; color:var(--ink); overflow:hidden;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  #stage { position:fixed; inset:0; } canvas { display:block; }
  #panel { position:fixed; left:20px; top:20px; width:min(340px,calc(100vw - 40px)); padding:16px 18px; background:var(--glass);
    border:1px solid var(--line); border-radius:6px; backdrop-filter:blur(7px); max-height:calc(100vh - 40px); overflow:auto; }
  h1 { font-size:23px; margin:0 0 8px; letter-spacing:-.02em; }
  .row { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; align-items:center; }
  .row .lab { width:62px; font-size:14px; color:#d6d4ca; }
  button { font:inherit; font-size:14px; color:var(--ink); background:transparent; border:1px solid var(--line); padding:6px 10px; border-radius:4px; cursor:pointer; }
  button:hover { border-color:#fff; }
  button.on { background:var(--accent); border-color:var(--accent); color:#1b1b16; font-weight:600; }
  hr { border:0; border-top:1px solid var(--line); margin:12px 0 8px; }
  .cap { font-size:13px; line-height:1.45; color:#c4c3b9; margin:10px 0 0; }
  #side { position:fixed; right:0; top:0; bottom:0; width:min(600px,42vw); padding:16px 20px; overflow:auto; background:rgba(22,26,24,.92); border-left:1px solid var(--line); }
  #side h2 { font-size:18px; margin:2px 0 8px; display:flex; justify-content:space-between; align-items:baseline; }
  #floods { font-size:14px; color:var(--accent); font-weight:600; }
  #now { font-size:17px; line-height:1.55; min-height:132px; margin:0 0 12px; }
  #section { width:100%; height:auto; border-radius:3px; }
  .bar { display:flex; align-items:center; gap:10px; margin:6px 0; }
  .bar .name { width:42px; font-weight:700; font-size:16px; filter:brightness(1.3); }
  .track { flex:1; height:12px; background:rgba(255,255,255,.08); border-radius:2px; }
  .track i { display:block; height:100%; width:0; border-radius:2px; transition:width .4s; }
  #labels .label { position:fixed; left:0; top:0; pointer-events:none; text-align:center; text-shadow:0 1px 3px rgba(0,0,0,.95),0 0 6px rgba(0,0,0,.6); }
  .label b { display:block; font-size:21px; }
  .label span { display:block; font-size:13px; white-space:nowrap; }
  .label::after { content:""; display:block; width:1px; height:22px; background:#fff; margin:3px auto 0; }
  .label.water b { color:#8fd6ff; font-size:18px; }
  .label.water::after { background:#8fd6ff; }
  #panelToggle { position:absolute; right:12px; top:12px; font-size:13px; padding:4px 8px; }
  h1 { padding-right:74px; }
  body.panel-closed #panel { width:auto; padding:10px 12px; }
  body.panel-closed #panel > :not(h1):not(#panelToggle) { display:none; }
  body.panel-closed #panel h1 { font-size:16px; margin:2px 0; padding-right:90px; }
  @media (max-width:820px) {
    #panel { left:8px; top:8px; width:calc(100vw - 16px); max-height:calc(62vh - 16px); padding:12px; }
    #side { left:0; right:0; top:auto; bottom:0; width:100%; height:38vh; padding:10px 14px; border-left:0; border-top:1px solid var(--line); }
    #side h2 { font-size:15px; }
    #now { font-size:14px; min-height:0; }
    .label b { font-size:15px; }
    .label span { display:none; }
    .label::after { height:12px; }
    .label.water b { font-size:13px; }
    button { padding:7px 9px; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<section id="panel">
  <h1>선상지 형성 모형</h1>
  <button id="panelToggle">접기</button>
  <div class="row" aria-label="지형 선택">
    <a href="./?site=gurye"><button>구례 실제 지형</button></a><a href="./"><button>계산 지형</button></a><button class="on">형성 모형</button>
  </div>
  <hr>
  <div class="row"><button id="playBtn" class="on">멈춤</button><button id="resetBtn">처음부터</button><button id="fastBtn">빠르게</button></div>
  <div class="row"><span class="lab">토사량</span><button data-opt="sediment:low">적음</button><button data-opt="sediment:mid" class="on">보통</button><button data-opt="sediment:high">많음</button></div>
  <div class="row"><span class="lab">물의 양</span><button data-opt="water:low">적음</button><button data-opt="water:mid" class="on">보통</button><button data-opt="water:high">많음</button></div>
  <div class="row"><span class="lab">자갈 비율</span><button data-opt="gravel:low">적음</button><button data-opt="gravel:mid" class="on">보통</button><button data-opt="gravel:high">많음</button></div>
  <hr>
  <div class="row"><button data-view="oblique" class="on">비스듬히</button><button data-view="above">위에서</button><button data-view="mouth">곡구 쪽</button><button id="labelsBtn" class="on">이름표</button></div>
  <p class="cap">물이 적고 자갈이 많으면 짧고 가파른 선상지가, 물이 많으면 더 넓게 퍼진 선상지가 됩니다. 조건을 바꾸면 그때부터 쌓이는 모습이 달라지니, 처음부터 눌러 비교해 보세요.</p>
  <p class="cap">실제 지역이 아닌 설명용 모형입니다. 크기와 시간은 압축했고 높이와 알갱이는 과장했습니다. 입자별 멈춤 기준은 교육용으로 정한 값입니다.</p>
</section>
<aside id="side">
  <h2>지금 일어나는 일 <span id="floods"></span></h2>
  <p id="now"></p>
  <h2>A에서 B로 자른 단면 (계산 결과)</h2>
  <canvas id="section" width="1120" height="420" role="img" aria-label="모형의 중심선을 자른 단면. 계산으로 쌓인 자갈, 모래, 진흙 층이 그대로 나타난다."></canvas>
  <h2 style="margin-top:14px">멈춘 곳까지의 평균 거리</h2>
  <div id="bars"></div>
</aside>
<script type="module" src="./model-main.js"></script>
</body>
</html>
