<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>여울, 소, 모래톱 모식도</title>
<link rel="stylesheet" href="../../shared/ui.css">
<style>
  html,body { background:#1b1f1d; overflow:auto; }
  main { max-width:1180px; margin:0 auto; padding:20px; }
  h1 { padding:0; margin:8px 0 10px; }
  #schem { margin-top:14px; }
  #schem h2 { font-size:18px; margin:18px 0 6px; font-weight:700; }
  #schem figure { margin:8px 0 10px; }
  #schem svg { display:block; width:100%; height:auto; border-radius:3px; background:#23302a; font-family:inherit; }
  .schem-pair { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .schem-pair figure { margin:8px 0 0 !important; }
  .schem-legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:14px; color:#e6e2d4; margin:2px 0 0; }
  .schem-legend span { display:inline-flex; align-items:center; gap:6px; }
  .schem-legend svg { width:22px !important; height:14px !important; flex:none; border-radius:0 !important; }
  .schem-note { font-size:18px; line-height:1.5; margin:10px 0 4px; min-height:54px; }
  .schem-note b { color:var(--accent); margin-right:4px; }
  .schem-cap { font-size:13px; color:#b9b8ae; margin:12px 0 0; }
  @media (max-width:640px) {
    main { padding:16px; }
    .schem-pair { grid-template-columns:1fr; }
    .schem-note { font-size:16px; }
  }
</style>
</head>
<body>
<main>
  <a id="backToList" href="../../index.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4"/></svg>목록으로</a>
  <h1>여울, 소, 모래톱 모식도</h1>
  <div class="row" aria-label="화면 선택">
    <a href="./model.html"><button>형성 모형</button></a><a href="./terrain.html"><button>회룡포 실제 지형</button></a><button class="on">모식도</button>
  </div>
  <div id="schem"></div>
</main>
<script type="module">
  import { createSchematic } from './schematic.js';
  window.__SCHEM = createSchematic(document.getElementById('schem'), { steps: true, stage: 2 });
  window.__APP_READY = true;
</script>
</body>
</html>
