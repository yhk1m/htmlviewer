<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>선상지 3D 지형</title>
<script type="importmap">{"imports":{"three":"../../shared/vendor/three.module.js"}}</script>
<link rel="stylesheet" href="../../shared/ui.css">
<style>
  html,body { background:#1b1f1d; }
  #note { font-size:16px; line-height:1.5; margin:8px 0 12px; color:#e8e6dd; min-height:48px; }
  .label span { color:#eee; }
  #legend { position:fixed; right:20px; bottom:20px; padding:10px 14px; background:var(--glass); border:1px solid var(--line); border-radius:6px; font-size:14px; }
  #legend i { display:block; height:12px; width:220px; margin:6px 0; background:linear-gradient(90deg,#eed6b8,#d96b24,#5a170d); }
  #legend div { display:flex; justify-content:space-between; }
  #load { position:fixed; inset:0; display:grid; place-items:center; background:#1b1f1d; font-size:20px; }
  #load[hidden] { display:none; }
  #corner { position:fixed; left:20px; bottom:14px; z-index:4; max-width:520px; display:flex; flex-direction:column; align-items:flex-start; gap:5px; pointer-events:none; }
  #heightBadge { font-size:13px; padding:3px 9px; background:var(--glass); border:1px solid var(--line); border-radius:4px; }
  #foot { font-size:12px; line-height:1.4; color:#eee; text-shadow:0 1px 2px #000; }
  body.show-map #heightBadge { display:none; }
  body.show-map #corner { left:var(--ml); right:var(--mr); bottom:8px; max-width:none; }
  body.show-map #foot { color:#f0eee6; text-shadow:none; font-size:11px; padding:5px 9px; background:rgba(22,26,24,.92); border:1px solid var(--line); border-radius:4px; }
  #schem { position:fixed; right:0; top:0; bottom:0; width:min(600px,42vw); padding:16px 20px; overflow:auto; background:rgba(22,26,24,.9); border-left:1px solid var(--line); color:var(--ink); }
  #schem[hidden] { display:none; }
  #schem h2 { font-size:18px; margin:4px 0 6px; font-weight:700; }
  #schem figure { margin:0 0 10px; }
  #schem svg { display:block; width:100%; height:auto; border-radius:3px; background:#23302a; font-family:inherit; }
  .schem-note { font-size:17px; line-height:1.5; margin:8px 0 4px; min-height:52px; }
  .schem-note b { color:var(--accent); margin-right:4px; }
  .schem-cap { font-size:13px; color:#b9b8ae; margin:0; }
  #legend { right:calc(min(600px,42vw) + 20px); }
  body.noschem #legend { right:20px; }
  body { --ml:calc(min(360px,100vw - 40px) + 40px); --mr:min(600px,42vw); --mt:0px; --foot:84px; }
  body.noschem { --mr:0px; }
  body.panel-closed { --ml:0px; --mt:56px; }
  #mapView { position:fixed; left:var(--ml); top:var(--mt); width:calc(100vw - var(--ml) - var(--mr)); height:calc(100vh - var(--mt) - var(--foot)); z-index:2; }
  #mapView[hidden] { display:none; }
  @media (max-width:820px) { body, body.panel-closed, body.noschem { --ml:0px; --mr:0px; --mt:56px; --foot:76px; } #mapView { height:calc(62vh - var(--mt) - var(--foot)); } }
  @media (max-width:820px) {
    #note { font-size:14px; min-height:0; }
    #schem { left:0; right:0; top:auto; bottom:0; width:100%; height:38vh; padding:10px 14px; border-left:0; border-top:1px solid var(--line); }
    #corner, body.show-map #corner { left:8px; right:8px; bottom:calc(38vh + 4px); max-width:none; }
    body.noschem #corner, body.noschem.show-map #corner { bottom:6px; }
    #foot, body.show-map #foot { font-size:10px; }
    #legend { right:8px; bottom:calc(38vh + 34px); }
    body.noschem #legend { right:8px; bottom:40px; }
    .schem-note { font-size:14px; min-height:0; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<section id="panel">
  <a href="../../index.html" style="color:var(--accent);font-size:13px;text-decoration:none">장면 목록</a>
  <h1 id="title">선상지</h1>
  <button id="panelToggle">접기</button>
  <div class="row" aria-label="지형 선택" style="margin-bottom:6px">
    <button data-site="gurye">구례 실제 지형</button><button data-site="synthetic">계산 지형</button><button data-site="model">형성 모형</button>
  </div>
  <p id="note"></p>
  <div class="row" aria-label="시간">
    <button data-stage="0">초기</button><button data-stage="1">성장</button><button data-stage="2">오늘날</button><button id="playStages">재생</button>
  </div>
  <div class="row" aria-label="높이 과장">
    <button data-height="1">실제 높이</button><button data-height="3" class="on">높이 3배</button><button data-height="5">높이 5배</button>
  </div>
  <div class="row" aria-label="보기">
    <button data-show="3d" class="on">3D</button><button data-show="map">등고선 지형도</button><button data-show="profile">단면</button>
  </div>
  <div class="row" aria-label="시점">
    <button data-view="oblique" class="on">비스듬히</button><button data-view="above">위에서</button><button data-view="close">가까이</button><button data-view="apex">곡구 쪽</button>
  </div>
  <div class="row">
    <button id="labelsBtn" class="on">이름표</button><button id="grainBtn">입자 크기</button><button id="schemBtn" class="on">모식도</button><button id="qualityBtn"></button>
  </div>
  <p class="cap" id="heightNote"></p>
  <p class="cap" style="margin-top:4px">시간과 규모는 압축했습니다. 선상지가 쌓이는 과정은 형성 모형에서 볼 수 있습니다.</p>
</section>
<canvas id="mapView" hidden></canvas>
<aside id="schem" aria-label="선상지 모식도"></aside>
<div id="legend" hidden>입자 크기<i></i><div><span>작음</span><span>큼</span></div></div>
<div id="corner"><div id="heightBadge"></div><div id="foot">표면 재질: ambientCG (CC0)</div></div>
<div id="load"><span id="status">준비 중</span></div>
<script type="module" src="./terrain-main.js"></script>
</body>
</html>
