<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>용암대지와 한탄강 협곡 모식도</title>
<link rel="stylesheet" href="../../shared/ui.css">
<style>
  html,body { background:#1b1f1d; overflow:auto; }
  main { max-width:1180px; margin:0 auto; padding:20px; }
  h1 { padding:0; margin:8px 0 10px; }
  #schem { margin-top:14px; }
  #schem h2 { font-size:18px; margin:20px 0 6px; font-weight:700; }
  #schem figure { margin:8px 0 10px; }
  #schem svg { display:block; width:100%; height:auto; border-radius:3px; background:#22313a; font-family:inherit; }
  #schem figcaption { font-size:14px; color:var(--ink); margin:5px 0 0; font-weight:600; }
  #schem svg.lp-sec { max-width:900px; }
  .schem-duo { display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:900px; }
  .schem-duo figure { margin:8px 0 0 !important; }
  .schem-legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:14px; color:var(--ink); margin:14px 0 0; max-width:900px; }
  .schem-legend span { display:inline-flex; align-items:center; gap:6px; }
  .schem-legend svg { width:22px !important; height:14px !important; flex:none; border-radius:0 !important; }
  .schem-note { font-size:18px; line-height:1.5; margin:10px 0 4px; min-height:54px; max-width:900px; }
  .schem-note b { color:var(--accent); margin-right:4px; }
  .schem-cap { font-size:13px; color:var(--sub); margin:12px 0 0; max-width:900px; }
  .lp-ex { margin:6px 0 4px; padding-left:20px; font-size:16px; line-height:1.6; color:var(--ink); max-width:900px; }
  .lp-ex b { font-weight:700; }
  @media (max-width:640px) {
    main { padding:16px; }
    .schem-duo { grid-template-columns:1fr; }
    .schem-note { font-size:16px; }
    .lp-ex { font-size:15px; }
  }
</style>
<script>try{if(localStorage.getItem('landform-theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body>
<main>
  <a id="backToList" href="../../index.html"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4"/></svg>목록으로</a>
  <h1>용암대지와 한탄강 협곡 모식도</h1>
  <div class="row" aria-label="화면 선택">
    <a href="./model.html"><button>형성 모형</button></a><a href="./terrain.html"><button>철원 용암대지</button></a><button class="on">모식도</button>
  </div>
  <div id="schem"></div>
</main>
<script type="module">
  import { createSchematic, CANYON_CUT } from './schematic.js';
  window.__SCHEM = createSchematic(document.getElementById('schem'), { steps: true, stage: CANYON_CUT });
  window.__APP_READY = true;
</script>
<script type="module" src="../../shared/theme.js"></script>
</body>
</html>
