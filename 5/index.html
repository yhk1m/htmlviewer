<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>지구를 찾아라 · 지뢰찾기</title>
<style>
:root{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#173447;background:#eaf4f5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px}main{width:min(100%,900px);background:#ffffffed;border:1px solid #d8e7e9;border-radius:22px;box-shadow:0 16px 50px #143d4817;overflow:hidden}.hero{text-align:center;padding:25px 16px 12px}.tag{color:#087c77;font-size:11px;font-weight:800;letter-spacing:.16em}.hero h1{font-size:clamp(26px,5vw,38px);margin:6px 0}.hero p{font-size:14px;color:#607889;margin:0}.tools{display:flex;gap:10px;align-items:center;justify-content:center;padding:14px;flex-wrap:wrap}.tools label{font-size:13px;font-weight:700;color:#607889}.tools select,.tools button{padding:10px 14px;border:1px solid #d7e4e6;border-radius:10px;background:white;color:#173447;font:inherit;font-weight:750}.tools button{background:#087c77;color:white;border-color:#087c77;cursor:pointer}.stats{display:flex;justify-content:center;gap:10px;margin:0 0 14px}.stat{min-width:110px;text-align:center;border:1px solid #e1ecee;background:#f3f8f9;border-radius:12px;padding:7px 12px}.stat small{display:block;font-size:10px;letter-spacing:.12em;color:#607889;font-weight:800}.stat strong{font-size:21px;font-variant-numeric:tabular-nums}.status{height:23px;text-align:center;color:#087c77;font-size:13px;font-weight:750;margin:0 10px 12px}.wrap{margin:0 16px 16px;padding:8px;max-height:62vh;overflow:auto;border:1px solid #d4e2e5;border-radius:13px;background:#dce8ea;display:flex;justify-content:center}.board{display:grid;gap:3px;align-content:start}.cell{width:clamp(27px,4.5vw,40px);height:clamp(27px,4.5vw,40px);border:1px solid #c6d8db;border-radius:6px;background:linear-gradient(145deg,#fff,#e7eff1);box-shadow:0 2px #bed0d3;padding:0;display:grid;place-items:center;font-size:17px;font-weight:900;cursor:pointer;touch-action:manipulation;user-select:none}.cell:hover:not(.open){filter:brightness(.97)}.cell.open{background:#edf4f5;box-shadow:none;border-color:#dce7e9;cursor:default}.cell.flag{color:#d65748}.cell.mine{background:#ffe6e2}.cell.boom{background:#ffc8c1}.n1{color:#2879bd}.n2{color:#21855d}.n3{color:#ce5041}.n4{color:#7053a1}.n5,.n6,.n7,.n8{color:#8a5d27}.pulse{animation:pulse .35s}@keyframes pulse{50%{outline:3px solid #23a49b;outline-offset:1px}}.help{display:flex;justify-content:center;gap:8px 20px;flex-wrap:wrap;padding:0 18px 22px;font-size:12px;color:#607889}.help b{color:#173447}@media(max-width:550px){body{padding:8px}.hero{padding-top:20px}.wrap{margin:0 7px 12px;padding:6px;justify-content:flex-start}.board{margin:auto}.cell{width:clamp(24px,7.7vw,33px);height:clamp(24px,7.7vw,33px);font-size:14px}.stat{min-width:94px}}
</style></head>
<body><main>
<header class="hero"><div class="tag">MINESWEEPER · EARTH EDITION</div><h1>지구를 찾아라 🌍</h1><p>숫자를 단서로 지구가 묻힌 칸을 모두 찾아보세요.</p></header>
<section class="tools"><label for="level">난이도</label><select id="level"><option value="low">하 · 9 × 9</option><option value="mid" selected>중 · 16 × 16</option><option value="high">상 · 30 × 16</option></select><button id="restart">새 게임</button></section>
<section class="stats"><div class="stat"><small>남은 지구</small><strong id="left">040</strong></div><div class="stat"><small>경과 시간</small><strong id="time">000</strong></div></section>
<p class="status" id="status" aria-live="polite">칸을 눌러 게임을 시작하세요.</p>
<div class="wrap"><div class="board" id="board" role="grid" aria-label="지뢰찾기 게임판"></div></div>
<footer class="help"><span>열기 <b>좌클릭</b></span><span>표시 <b>우클릭</b> 또는 길게 누르기</span><span>검사: 숫자 칸에서 <b>좌·우클릭 동시</b> (주변 표시가 맞으면 열기)</span><span>지구가 숨은 칸 🌍</span></footer>
</main><script>
(()=>{
const levels={low:{w:9,h:9,mines:10},mid:{w:16,h:16,mines:40},high:{w:30,h:16,mines:99}},boardEl=document.querySelector('#board'),levelEl=document.querySelector('#level'),leftEl=document.querySelector('#left'),timeEl=document.querySelector('#time'),statusEl=document.querySelector('#status');
let cfg,cells,started,ended,flags,revealed,seconds,timer,longPress;
const pad=n=>String(n).padStart(3,'0');
function setup(){clearInterval(timer);clearTimeout(longPress);cfg=levels[levelEl.value];cells=[];started=ended=false;flags=revealed=seconds=0;timeEl.textContent=pad(0);leftEl.textContent=pad(cfg.mines);statusEl.textContent='칸을 눌러 게임을 시작하세요.';boardEl.style.gridTemplateColumns=`repeat(${cfg.w},auto)`;boardEl.innerHTML='';
for(let i=0;i<cfg.w*cfg.h;i++){const c={mine:false,open:false,flag:false,n:0,el:document.createElement('button')};c.el.type='button';c.el.className='cell';c.el.dataset.i=i;c.el.setAttribute('role','gridcell');c.el.setAttribute('aria-label',`행 ${Math.floor(i/cfg.w)+1}, 열 ${i%cfg.w+1}`);c.el.addEventListener('click',()=>openCell(i));c.el.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(i)});c.el.addEventListener('pointerdown',e=>{if(e.button===2)e.preventDefault();if(e.buttons===3){e.preventDefault();chord(i)}if(e.pointerType==='touch')longPress=setTimeout(()=>toggleFlag(i),500)});c.el.addEventListener('pointerup',()=>clearTimeout(longPress));c.el.addEventListener('pointerleave',()=>clearTimeout(longPress));cells.push(c);boardEl.append(c.el)}}
function neighbors(i){const x=i%cfg.w,y=Math.floor(i/cfg.w),a=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;if(nx>=0&&nx<cfg.w&&ny>=0&&ny<cfg.h)a.push(ny*cfg.w+nx)}return a}
function plant(safe){const pool=cells.map((_,i)=>i).filter(i=>i!==safe);for(let j=pool.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[pool[j],pool[k]]=[pool[k],pool[j]]}pool.slice(0,cfg.mines).forEach(i=>cells[i].mine=true);cells.forEach((c,i)=>{if(!c.mine)c.n=neighbors(i).filter(j=>cells[j].mine).length});started=true;timer=setInterval(()=>{seconds++;timeEl.textContent=pad(seconds)},1000)}
function paint(i){const c=cells[i],el=c.el;el.className='cell';el.removeAttribute('aria-label');let label=`행 ${Math.floor(i/cfg.w)+1}, 열 ${i%cfg.w+1}`;if(c.open){el.classList.add('open');if(c.mine){el.classList.add('mine');el.textContent='🌍';label+=' 지구'}else if(c.n){el.textContent=c.n;el.classList.add(`n${c.n}`);label+=` 주변 지구 ${c.n}개`}else{el.textContent='';label+=' 빈 칸'}}else if(c.flag){el.classList.add('flag');el.textContent='🚩';label+=' 표시'}else{el.textContent='';label+=' 닫힌 칸'}el.setAttribute('aria-label',label)}
function openCell(i){if(ended||cells[i].open||cells[i].flag)return;if(!started)plant(i);const c=cells[i];c.open=true;revealed++;paint(i);if(c.mine){ended=true;clearInterval(timer);cells.forEach((x,j)=>{if(x.mine){x.open=true;paint(j)}});c.el.classList.add('boom');statusEl.textContent='지구를 건드렸어요. 새 게임으로 다시 도전해 보세요.';return}if(c.n===0)neighbors(i).forEach(j=>{if(!cells[j].open&&!cells[j].flag)openCell(j)});if(revealed===cells.length-cfg.mines){ended=true;clearInterval(timer);statusEl.textContent='성공! 모든 지구를 안전하게 표시했어요. 🎉'}}
function toggleFlag(i){if(ended||cells[i].open)return;const c=cells[i];c.flag=!c.flag;flags+=c.flag?1:-1;leftEl.textContent=pad(cfg.mines-flags);paint(i);if(flags===cfg.mines&&cells.every(x=>x.mine===x.flag)){ended=true;clearInterval(timer);statusEl.textContent='성공! 모든 지구를 찾아냈어요. 🎉'}}
function chord(i){const c=cells[i];if(ended||!c.open||c.mine||!c.n)return;const around=neighbors(i),marked=around.filter(j=>cells[j].flag).length;c.el.classList.remove('pulse');void c.el.offsetWidth;c.el.classList.add('pulse');if(marked!==c.n){statusEl.textContent=`주변 표시 ${marked}개 · 숫자는 ${c.n} — 표시를 확인해 주세요.`;setTimeout(()=>{if(!ended)statusEl.textContent='숫자 칸에서 좌·우클릭을 함께 눌러 주변을 검사하세요.'},1600);return}around.forEach(j=>{if(!cells[j].open&&!cells[j].flag)openCell(j)})}
levelEl.addEventListener('change',setup);document.querySelector('#restart').addEventListener('click',setup);setup();
})();
</script></body></html>
