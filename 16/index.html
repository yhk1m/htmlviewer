<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>다 쓴 페트병, 다음은 뭘까?</title>
  <meta name="description" content="초등학생이 직접 조작하며 투명 페트병의 재활용 과정을 배우는 자원순환 체험">
  <style>
/* 다 쓴 페트병, 다음은 뭘까? — 밝은 배경 + 짙은 초록 + 연한 민트 */
:root {
  --bg: #F3F7F2;
  --paper: #FFFFFF;
  --ink: #173B33;
  --ink-2: #4A6A60;
  --ink-3: #7C978D;
  --green: #1E5B4C;
  --green-2: #2B7461;
  --mint: #DDEDE3;
  --mint-2: #EAF4ED;
  --mint-3: #F5FAF6;
  --line: #D3E3D9;
  --lime: #D4EE52;
  --coral: #F06A4F;
  --coral-soft: #FDE3DA;
  --radius: 22px;
  --shadow: 0 10px 30px -18px rgba(23, 59, 51, .45);
  --font: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Nanum Gothic", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.55;
  word-break: keep-all;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
svg { display: block; }
h1, h2, p { margin: 0; }
[hidden] { display: none !important; }

:focus-visible { outline: 4px solid #F2A541; outline-offset: 3px; border-radius: 12px; }
svg :focus-visible { outline: none; }
svg g[role="button"]:focus-visible > * { stroke: #F2A541; stroke-width: 4; }

.app {
  max-width: 1280px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 0 clamp(16px, 3vw, 40px);
}
main { flex: 1; outline: none; }

/* ---------- 상단 ---------- */
.topbar {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 16px;
  padding: 18px 0 14px;
  border-bottom: 1px solid var(--line);
}
.brand {
  display: inline-flex; align-items: center; gap: 10px;
  background: none; border: 0; padding: 4px; cursor: pointer;
}
.brand-mark {
  width: 42px; height: 42px; border-radius: 12px;
  background: var(--green); color: var(--lime);
  display: grid; place-items: center;
}
.brand-mark svg { width: 24px; height: 24px; }
.brand-name { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.brand-name em { font-style: normal; color: var(--coral); }
.topbar-title { text-align: center; font-size: 15px; color: var(--ink-2); }
.topbar-title b { color: var(--ink); }
.topbar-title span { margin-left: 12px; padding-left: 12px; border-left: 1px solid var(--line); }
.top-actions { display: flex; gap: 10px; }
.icon-btn {
  width: 48px; height: 48px; border-radius: 50%;
  border: 1.5px solid var(--line); background: var(--paper);
  display: grid; place-items: center; cursor: pointer;
  transition: background .15s, border-color .15s;
}
.icon-btn svg { width: 24px; height: 24px; }
.icon-btn:hover { background: var(--mint-2); }
.icon-btn .ic-sound-on { display: none; }
.icon-btn.is-on { background: var(--green); color: #fff; border-color: var(--green); }
.icon-btn.is-on .ic-sound-on { display: block; }
.icon-btn.is-on .ic-sound-off { display: none; }

.foot {
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 16px 0 22px; margin-top: 18px;
  border-top: 1px solid var(--line);
  color: var(--ink-3); font-size: 14px;
}

/* ---------- 버튼 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 58px; padding: 0 24px;
  border-radius: 16px; border: 1.5px solid transparent;
  font-size: 18px; font-weight: 700; cursor: pointer;
  touch-action: manipulation; user-select: none;
  transition: transform .12s, background .15s, box-shadow .15s, opacity .15s;
}
.btn svg { width: 22px; height: 22px; flex: none; }
.btn:active:not(:disabled) { transform: translateY(2px); }
.btn.primary { background: var(--green); color: #fff; box-shadow: 0 6px 0 #123D33; }
.btn.primary:active:not(:disabled) { box-shadow: 0 3px 0 #123D33; }
.btn.primary:disabled { background: #C9D9D0; color: #6F8B80; box-shadow: none; cursor: not-allowed; }
.btn.primary svg { color: var(--lime); }
.btn.primary:disabled svg { color: inherit; }
.btn.big { min-height: 70px; padding: 0 34px; font-size: 22px; border-radius: 20px; }
.btn.ghost { background: var(--paper); border-color: var(--line); color: var(--ink); }
.btn.ghost:hover:not(:disabled) { background: var(--mint-2); }
.btn.ghost:disabled { opacity: .45; cursor: not-allowed; }
.btn.soft { background: var(--mint); color: var(--green); }
.btn.soft:hover { background: #CFE5D8; }
.btn.is-ready { animation: ready 1.6s ease-in-out infinite; }
@keyframes ready { 0%, 100% { box-shadow: 0 6px 0 #123D33, 0 0 0 0 rgba(212, 238, 82, .9); } 50% { box-shadow: 0 6px 0 #123D33, 0 0 0 8px rgba(212, 238, 82, .55); } }
#hintBtn.nudge { animation: nudge 1.2s ease-in-out infinite; background: var(--lime); color: var(--ink); }
@keyframes nudge { 0%, 100% { box-shadow: 0 0 0 0 rgba(242, 165, 65, .8); } 50% { box-shadow: 0 0 0 8px rgba(242, 165, 65, .35); } }
.link-btn { background: none; border: 0; color: var(--ink-2); text-decoration: underline; cursor: pointer; padding: 10px; font-size: 16px; }

/* ---------- 시작 화면 ---------- */
.start {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-areas: "copy art" "route route";
  align-items: center;
  gap: 24px 40px;
  padding: clamp(24px, 5vw, 56px) 0 8px;
}
.start-copy { grid-area: copy; }
.kicker {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 16px; font-weight: 700; color: var(--green);
}
.kicker svg { width: 18px; height: 18px; }
.kicker.center { justify-content: center; width: 100%; letter-spacing: .06em; }
.start-title {
  margin: 14px 0 18px;
  font-size: clamp(40px, 6vw, 70px); line-height: 1.12; letter-spacing: -.04em; font-weight: 800;
}
.start-lead { font-size: clamp(18px, 2vw, 21px); color: var(--ink-2); max-width: 30ch; margin-bottom: 30px; }
.start-meta { display: flex; flex-wrap: wrap; gap: 8px 18px; list-style: none; padding: 0; margin: 22px 0 0; color: var(--ink-2); font-size: 15px; }
.start-meta li { display: inline-flex; align-items: center; gap: 6px; }
.start-meta li + li::before { content: ""; width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); margin-right: 10px; }
.start-meta svg { width: 20px; height: 20px; color: var(--coral); }

.start-art { grid-area: art; position: relative; height: clamp(320px, 42vw, 470px); }
.halo {
  position: absolute; inset: 8% 14%;
  border-radius: 50%; background: radial-gradient(circle at 40% 40%, #E3F2D8, #D3EAD9 60%, transparent 61%);
}
.orbit { position: absolute; inset: 2% 6%; border: 1.5px dashed #BBD4C5; border-radius: 50%; }
.hero-bottle {
  position: absolute; left: 50%; top: 50%; width: clamp(140px, 17vw, 200px);
  transform: translate(-50%, -50%) rotate(8deg);
  animation: bob 3.4s ease-in-out infinite;
  filter: drop-shadow(0 18px 18px rgba(23, 59, 51, .18));
}
@keyframes bob { 0%, 100% { transform: translate(-50%, -50%) rotate(8deg); } 50% { transform: translate(-50%, -54%) rotate(4deg); } }
.speech {
  position: absolute; left: 2%; top: 14%;
  background: var(--paper); border-radius: 18px 18px 18px 4px;
  padding: 12px 18px; font-weight: 700; font-size: 17px; line-height: 1.4;
  box-shadow: var(--shadow); z-index: 2;
}
.spark { position: absolute; color: var(--green); width: 30px; }
.spark.s1 { right: 16%; top: 16%; }
.spark.s2 { left: 18%; bottom: 20%; color: var(--coral); width: 24px; }
.badge-round {
  position: absolute; right: 4%; bottom: 14%;
  width: 118px; height: 118px; border-radius: 50%;
  background: var(--coral); color: #fff;
  display: grid; place-content: center; text-align: center;
  font-size: 14px; line-height: 1.3; transform: rotate(-8deg);
  box-shadow: var(--shadow);
}
.badge-round b { display: block; font-size: 20px; }
.badge-round.lime { background: var(--lime); color: var(--ink); border: 2px dashed var(--green); }

.route-wrap { grid-area: route; }
.route {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
  list-style: none; margin: 0; padding: 10px;
  background: var(--mint-2); border-radius: 20px;
}
.route li {
  display: flex; align-items: center; gap: 8px; justify-content: center;
  padding: 12px 6px; border-radius: 14px; background: var(--paper);
  font-weight: 700; font-size: 16px; text-align: center;
}
.route li span { font-size: 13px; color: var(--ink-3); font-weight: 600; }
.model-note { display: flex; align-items: center; gap: 8px; justify-content: center; margin-top: 14px; color: var(--ink-2); font-size: 15px; }
.model-note svg { width: 18px; height: 18px; flex: none; }

/* ---------- 단계 표시 ---------- */
.stepper { padding: 18px 0 6px; }
.stepper ol { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; list-style: none; margin: 0; padding: 0; }
.step-pill {
  width: 100%; min-height: 52px;
  display: flex; align-items: center; gap: 10px;
  padding: 6px 12px; border-radius: 14px;
  border: 0; background: var(--mint-2); color: var(--ink-3);
  font-weight: 700; font-size: 16px; text-align: left; cursor: pointer;
}
.step-pill:disabled { cursor: default; }
.step-pill .num {
  flex: none; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; font-size: 13px;
  background: var(--paper); color: var(--ink-3); border: 1.5px solid var(--line);
}
.step-pill .num svg { width: 16px; height: 16px; }
.step-pill.is-done { background: var(--mint); color: var(--ink); }
.step-pill.is-done .num { background: var(--green); color: #fff; border-color: var(--green); }
.step-pill.is-current { background: var(--green); color: #fff; }
.step-pill.is-current .num { background: var(--lime); color: var(--ink); border-color: var(--lime); }

/* ---------- 체험 화면 ---------- */
.play {
  display: grid;
  grid-template-columns: minmax(280px, 0.85fr) 1.6fr;
  grid-template-rows: auto 1fr;
  grid-template-areas: "head stage" "more stage";
  gap: 4px 36px;
  padding-top: 18px;
}
.guide-head { grid-area: head; }
.guide-more { grid-area: more; display: flex; flex-direction: column; gap: 16px; }
.stage-wrap { grid-area: stage; display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.eyebrow { font-size: 15px; font-weight: 700; color: var(--green); letter-spacing: .02em; }
.step-title { font-size: clamp(30px, 3.4vw, 42px); line-height: 1.18; letter-spacing: -.035em; margin: 8px 0 12px; font-weight: 800; }
.desc { color: var(--ink-2); font-size: 18px; margin-bottom: 14px; }

.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.task { display: flex; align-items: center; gap: 12px; color: var(--ink-3); font-size: 17px; }
.task .tick {
  flex: none; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; font-size: 14px; font-weight: 700;
  border: 1.5px solid var(--line); background: var(--paper);
}
.task .tick svg { width: 16px; height: 16px; }
.task.is-active { color: var(--ink); font-weight: 700; }
.task.is-active .tick { background: var(--lime); border-color: var(--lime); color: var(--ink); }
.task.is-done { color: var(--ink-2); }
.task.is-done .tick { background: var(--green); border-color: var(--green); color: #fff; }

.tip { background: var(--mint-2); border-radius: 16px; padding: 14px 16px; }
.tip strong { display: block; font-size: 15px; margin-bottom: 4px; color: var(--green); }
.tip p { font-size: 15.5px; color: var(--ink-2); }

.hint-box {
  display: flex; gap: 10px; align-items: flex-start;
  background: #FFF6D6; border: 1.5px solid #F2D27A; border-radius: 16px; padding: 12px 14px;
  font-size: 16px; animation: pop .25s ease-out;
}
.hint-box svg { width: 24px; height: 24px; flex: none; color: #B07B00; }
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }

.step-progress { margin-top: auto; font-size: 14px; color: var(--ink-2); }
.step-progress .bar { height: 8px; background: var(--mint); border-radius: 99px; overflow: hidden; margin-top: 6px; }
.step-progress .bar i { display: block; height: 100%; width: 0; background: var(--green); border-radius: 99px; transition: width .2s; }

.stage {
  position: relative;
  background: linear-gradient(180deg, #EDF5EF, #E3EFE7);
  border: 1.5px solid var(--line);
  border-radius: 28px;
  min-height: 470px;
  padding: 16px 18px 18px;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.stage-top { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-3); letter-spacing: .08em; }
.stage-tag { font-weight: 600; }
.model-badge {
  display: inline-flex; align-items: center; gap: 4px; letter-spacing: 0;
  background: rgba(255, 255, 255, .7); border-radius: 99px; padding: 3px 10px; font-size: 12.5px; color: var(--ink-2);
}
.model-badge svg { width: 14px; height: 14px; }
.stage-pct { margin-left: auto; font-weight: 700; color: var(--ink); letter-spacing: 0; font-size: 15px; }

.toast {
  position: absolute; left: 50%; top: 52px; z-index: 5;
  transform: translate(-50%, -8px); opacity: 0; pointer-events: none;
  background: var(--green); color: #fff; font-weight: 700;
  padding: 10px 18px; border-radius: 14px; font-size: 16px;
  max-width: calc(100% - 32px); text-align: center;
  transition: opacity .2s, transform .2s;
}
.toast.is-show { opacity: 1; transform: translate(-50%, 0); }
.toast.is-warn { background: #FFF0E6; color: #9A3C1C; border: 1.5px solid #F7C3A9; }
.toast.is-ok { background: var(--green); }

.activity { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; padding: 30px 0 10px; }
.prompt {
  align-self: center;
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--paper); border-radius: 99px; padding: 10px 20px;
  font-weight: 700; font-size: 17px; box-shadow: var(--shadow); text-align: center;
}
.prompt svg { width: 22px; height: 22px; color: var(--coral); flex: none; }
.prompt.is-done { background: var(--green); color: #fff; }
.prompt.is-done svg { color: var(--lime); }

.controls { display: flex; gap: 10px; flex-wrap: wrap; }
.controls #nextBtn { margin-left: auto; min-width: 190px; }

.hint-pulse { animation: hintPulse .8s ease-in-out 3; }
@keyframes hintPulse {
  0%, 100% { filter: none; }
  50% { filter: drop-shadow(0 0 10px #F2A541) drop-shadow(0 0 4px #F2A541); }
}

/* ---------- 1. 깨끗하게 ---------- */
.clean { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.bottle-holder { position: relative; width: clamp(150px, 17vw, 190px); touch-action: none; }
.bottle-holder.is-pouring .bottle-svg { animation: pour .6s ease-in-out; }
@keyframes pour { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(-24deg); } }
.bottle-svg { width: 100%; height: auto; overflow: visible; }
.bottle-svg .b-water { transition: transform .5s ease; }
.bottle-svg .b-body { transform-origin: 60px 230px; transition: transform .12s linear; cursor: pointer; }
.bottle-svg .b-cap { cursor: pointer; transition: transform .5s cubic-bezier(.3, 1.4, .5, 1), opacity .4s; }
.bottle-svg .b-cap.is-off { transform: translate(-90px, 60px) rotate(-40deg); opacity: 0; pointer-events: none; }
.bottle-svg .b-label { cursor: grab; touch-action: none; }
.bottle-svg .b-label.is-dragging { cursor: grabbing; }
.bottle-svg .face-squish { display: none; }
.bottle-svg.is-squishing .face-happy { display: none; }
.bottle-svg.is-squishing .face-squish { display: inline; }
.bottle-svg.is-flat .b-face { transform: translateY(8px); }
.bottle-svg [role="button"].is-pressing { filter: brightness(.96); }
.drops { position: absolute; inset: 0; pointer-events: none; }
.drop {
  position: absolute; top: 8%; width: 9px; height: 13px;
  background: #71C3DC; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  animation: drip 1s ease-in forwards;
}
@keyframes drip { from { transform: translate(-40px, 0); opacity: 1; } to { transform: translate(-90px, 180px); opacity: 0; } }

.side-spot { display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--ink-3); font-size: 14px; text-align: center; }
.spot-box {
  width: 96px; height: 76px; border-radius: 18px;
  border: 2px dashed #B8D1C3; display: grid; place-items: center; background: rgba(255, 255, 255, .5);
}
.spot-cap, .spot-tag { opacity: 0; transform: scale(.6); transition: opacity .35s .25s, transform .35s .25s cubic-bezier(.3, 1.6, .5, 1); }
.spot-cap { width: 44px; height: 28px; border-radius: 6px; background: var(--green); box-shadow: inset 0 0 0 4px #2B7461; }
.spot-tag { background: var(--lime); padding: 8px 14px; border-radius: 6px; font-weight: 800; color: var(--green); }
.side-spot.is-filled .spot-cap, .side-spot.is-filled .spot-tag { opacity: 1; transform: none; }
.side-spot.is-filled .spot-box { border-style: solid; border-color: var(--line); background: var(--paper); }
.side-spot.is-filled { color: var(--ink-2); }

/* ---------- 2. 올바르게 ---------- */
.sort { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.sort-top { position: relative; display: flex; align-items: center; justify-content: center; }
.drag-bottle {
  width: 120px; cursor: grab; touch-action: none; user-select: none; position: relative; z-index: 4;
  animation: float 2.4s ease-in-out infinite;
}
.drag-bottle.is-dragging { animation: none; cursor: grabbing; filter: drop-shadow(0 16px 12px rgba(23, 59, 51, .25)); }
@keyframes float { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }
.where { position: absolute; left: calc(100% + 8px); top: 18px; white-space: nowrap; font-weight: 700; color: var(--ink-2); }
.bins { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 620px; }
.bin {
  border: 0; background: none; padding: 0; cursor: pointer;
  display: flex; flex-direction: column; align-items: center;
  touch-action: manipulation;
}
.bin-lid { width: 92%; height: 16px; border-radius: 8px 8px 4px 4px; background: color-mix(in srgb, var(--bin) 80%, #173B33); transition: transform .25s; transform-origin: left bottom; }
.bin-body {
  width: 100%; min-height: 112px; margin-top: 3px;
  border-radius: 6px 6px 18px 18px; background: var(--bin); color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  box-shadow: inset 0 -8px 0 rgba(0, 0, 0, .06);
  transition: transform .15s;
}
.bin-body small { font-size: 12px; letter-spacing: .1em; opacity: .75; }
.bin-body b { font-size: 18px; text-align: center; line-height: 1.25; padding: 0 4px; }
.bin:hover .bin-body, .bin.is-over .bin-body { transform: translateY(-4px); }
.bin.is-over .bin-lid, .bin.is-correct .bin-lid { transform: rotate(-24deg); }
.bin.is-over .bin-body { box-shadow: inset 0 -8px 0 rgba(0, 0, 0, .06), 0 0 0 4px var(--green); }
.bin.is-correct .bin-body { box-shadow: 0 0 0 4px var(--green); }
.bin.is-wrong { animation: shake .45s; }
.bin:disabled { cursor: default; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.feedback {
  width: 100%; max-width: 620px;
  background: #FFF4EE; border: 1.5px solid #F7C3A9; border-radius: 16px; padding: 12px 16px;
  animation: pop .25s ease-out;
}
.feedback b { color: #9A3C1C; font-size: 17px; }
.feedback p { font-size: 16px; color: var(--ink); margin-top: 2px; }
.feedback .again { display: flex; align-items: center; gap: 6px; color: var(--green); font-weight: 700; margin-top: 6px; }
.feedback .again svg { width: 18px; height: 18px; }
.journey { display: flex; align-items: center; gap: 8px; list-style: none; padding: 0; margin: 0; flex-wrap: wrap; justify-content: center; }
.journey li { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); font-weight: 700; font-size: 15px; }
.journey li .j-ic {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  background: var(--paper); border: 1.5px solid var(--line); transition: background .3s, color .3s;
}
.journey li .j-ic svg { width: 22px; height: 22px; }
.journey li.is-lit { color: var(--ink); }
.journey li.is-lit .j-ic { background: var(--green); color: var(--lime); border-color: var(--green); animation: pop .3s; }
.journey .j-arrow { color: var(--ink-3); }

/* ---------- 3·4. 기계 + 손잡이 ---------- */
.mech { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 18px; }
.mech-machine { position: relative; display: flex; flex-direction: column; align-items: center; }
.machine-svg { width: 100%; max-width: 270px; height: auto; }
.mech-cap { font-size: 14px; font-weight: 700; color: var(--ink-2); margin-top: 4px; }
.hopper-bottle {
  position: absolute; top: -34px; left: 50%; width: 52px; margin-left: -26px; z-index: 0;

}
.mech-machine .machine-svg { position: relative; z-index: 1; }
.flake { opacity: 0; transition: opacity .2s; }
.flake.is-on { opacity: 1; }
.gear { transition: transform .05s linear; }

.mech-control { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.dial {
  position: relative; width: clamp(190px, 21vw, 236px); aspect-ratio: 1; border-radius: 50%;
  touch-action: none; cursor: grab; user-select: none;
}
.dial.is-dragging { cursor: grabbing; }
.dial-ring {
  --p: 0;
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(var(--green) calc(var(--p) * 360deg), #CFE2D7 0);
  -webkit-mask: radial-gradient(circle, transparent 66%, #000 67%);
  mask: radial-gradient(circle, transparent 66%, #000 67%);
}
.dial-face {
  position: absolute; inset: 14px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #2E7C67, #1E5B4C 70%);
  box-shadow: 0 12px 24px -10px rgba(23, 59, 51, .6), inset 0 -6px 0 rgba(0, 0, 0, .15);
}
.dial-rotor { position: absolute; inset: 0; border-radius: 50%; }
.dial-rotor .knob {
  position: absolute; left: 50%; top: 8px; width: 34px; height: 34px; margin-left: -17px; border-radius: 50%;
  background: var(--lime); box-shadow: 0 3px 0 #9DB52C;
}
.dial-rotor i { position: absolute; left: 50%; top: 50%; width: 6px; height: 34%; margin-left: -3px; background: rgba(255, 255, 255, .14); border-radius: 3px; transform-origin: 50% 0; }
.dial-rotor i:nth-of-type(1) { transform: rotate(0deg); }
.dial-rotor i:nth-of-type(2) { transform: rotate(120deg); }
.dial-rotor i:nth-of-type(3) { transform: rotate(240deg); }
.dial-text {
  position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 4px;
  color: #fff; font-size: 19px; pointer-events: none;
}
.dial-text svg { width: 30px; height: 30px; color: var(--lime); }
.dial.is-done .dial-face { background: radial-gradient(circle at 40% 35%, #3A8F75, #24705C 70%); }
.dial-sub { font-size: 15px; color: var(--ink-2); text-align: center; }
.dial-sub b { color: var(--ink); }
.assist { min-height: 54px; font-size: 17px; touch-action: none; }
.assist.is-pressing, .heat-btn.is-pressing, .weave.is-pressing { transform: scale(.97); }

.heat-btn {
  --p: 0;
  position: relative; width: clamp(190px, 21vw, 236px); aspect-ratio: 1; border-radius: 50%;
  border: 0; padding: 0; background: none; cursor: pointer; touch-action: none; user-select: none;
  transition: transform .1s;
}
.heat-ring {
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(var(--coral) calc(var(--p) * 360deg), #F5D9CF 0);
  -webkit-mask: radial-gradient(circle, transparent 66%, #000 67%);
  mask: radial-gradient(circle, transparent 66%, #000 67%);
}
.heat-face {
  position: absolute; inset: 14px; border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, #FFE6DC, #FBC6B2);
  display: grid; place-content: center; justify-items: center; gap: 2px; color: #B23A1E;
  box-shadow: 0 12px 24px -12px rgba(178, 58, 30, .6);
}
.heat-face svg { width: 38px; height: 38px; }
.heat-face b { font-size: 21px; }
.heat-face small { font-size: 13px; color: #9A4A33; }
.heat-flakes { --melt: 0; transition: opacity .15s; }
.hflake { fill: color-mix(in srgb, #F7A26E calc(var(--melt) * 100%), #9EE0D2); stroke: #5FA79D; stroke-width: .8; }
.melt-glow { transition: opacity .2s; }
.fiber { stroke-dasharray: 6 5; transition: none; }
.fibers { transition: opacity .4s; }
.spool-thread { transition: height .1s, y .1s; }

.flow { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; list-style: none; padding: 0; margin: 14px 0 0; }
.flow li { font-size: 14.5px; font-weight: 700; color: var(--ink-3); }
.flow li:not(.f-arrow) { background: rgba(255, 255, 255, .6); padding: 6px 12px; border-radius: 99px; border: 1.5px solid var(--line); transition: background .3s, color .3s; }
.flow li.is-lit { background: var(--green); color: #fff; border-color: var(--green); }

/* ---------- 5. 다시, 새로! ---------- */
.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.choice {
  background: var(--paper); border: 2px solid var(--line); border-radius: 22px;
  padding: 14px 10px 16px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  transition: transform .15s, border-color .15s, box-shadow .15s;
}
.choice:hover { transform: translateY(-4px); border-color: var(--green); box-shadow: var(--shadow); }
.choice-art { width: 100%; max-width: 150px; }
.choice b { font-size: 20px; }
.choice small { font-size: 14px; color: var(--ink-2); }
.make-b { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; align-items: center; }
.weave {
  background: var(--paper); border: 2px solid var(--line); border-radius: 50%;
  aspect-ratio: 1; width: 100%; max-width: 300px; justify-self: center;
  padding: 26px; cursor: pointer; touch-action: none; user-select: none; transition: transform .1s;
}
.weave.is-done { border-color: var(--green); box-shadow: 0 0 0 6px var(--mint); animation: pop .4s; }
.product-svg { width: 100%; height: auto; }
.weave-side { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.weave-name { font-size: 16px; color: var(--ink-2); }
.weave-name b { font-size: 26px; color: var(--ink); }
.weave-meter { width: 100%; height: 12px; background: var(--paper); border-radius: 99px; overflow: hidden; border: 1.5px solid var(--line); }
.weave-meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #9EE0D2, var(--green)); transition: width .1s; }
.weave-pct { font-weight: 800; font-size: 20px; }

/* ---------- 완성 화면 ---------- */
.finish { position: relative; padding: 28px 0 8px; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.confetti i {
  position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 2px;
  animation: fall linear forwards;
}
@keyframes fall { to { transform: translateY(105vh) rotate(var(--r)); opacity: .9; } }
.finish-hero { text-align: center; }
.finish-title { font-size: clamp(32px, 4.4vw, 52px); line-height: 1.2; letter-spacing: -.035em; margin: 10px 0 12px; font-weight: 800; }
.finish-lead { font-size: 19px; color: var(--ink-2); }
.finish-art { position: relative; width: min(320px, 78vw); aspect-ratio: 1; margin: 18px auto 8px; }
.finish-art .halo { inset: 2%; }
.finish-art .product-svg { position: absolute; inset: 14%; width: 72%; animation: pop .6s ease-out; }
.finish-art .badge-round { right: -18%; bottom: 8%; width: 112px; height: 112px; }
.chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; list-style: none; padding: 0; margin: 10px 0 0; }
.chips li { display: inline-flex; align-items: center; gap: 6px; background: var(--mint-2); padding: 8px 16px; border-radius: 99px; font-weight: 700; font-size: 16px; }
.chips svg { width: 18px; height: 18px; color: var(--green); }
.finish-body { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; margin-top: 28px; }
.recap, .notes { background: var(--paper); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 20px 22px; }
.recap h2, .notes h2 { font-size: 20px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.notes h2 svg { width: 22px; height: 22px; color: var(--green); }
.recap ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.recap li { display: flex; gap: 12px; align-items: flex-start; }
.recap .num { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--green); color: var(--lime); display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.recap b { font-size: 16.5px; }
.recap p { font-size: 15.5px; color: var(--ink-2); }
.notes ul { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 15.5px; color: var(--ink-2); }
.promise { margin-top: 14px; background: var(--mint-2); border-radius: 14px; padding: 10px 14px; font-weight: 700; color: var(--green); font-size: 16px; }
.finish-actions { display: flex; justify-content: center; margin-top: 26px; }

/* ---------- 반응형 ---------- */
@media (max-width: 1020px) {
  .play { grid-template-columns: 1fr; grid-template-areas: "head" "stage" "more"; gap: 16px; }
  .guide-head .desc { margin-bottom: 0; }
  .step-progress { margin-top: 0; }
  .stage { min-height: 430px; }
}
@media (max-width: 900px) {
  .start { grid-template-columns: 1fr; grid-template-areas: "art" "copy" "route"; text-align: center; }
  .start-lead { margin-left: auto; margin-right: auto; }
  .start-meta { justify-content: center; }
  .start-art { height: 330px; max-width: 460px; width: 100%; margin: 0 auto; }
  .route { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .route li { flex-direction: column; gap: 0; font-size: 14px; }
  .finish-body { grid-template-columns: 1fr; }
  .topbar-title span { display: none; }
}
@media (max-width: 640px) {
  body { font-size: 16px; }
  .topbar { grid-template-columns: auto 1fr; }
  .topbar-title { display: none; }
  .top-actions { justify-self: end; }
  .brand-name { font-size: 19px; }
  .step-pill { justify-content: center; padding: 6px; min-height: 48px; }
  .step-pill .txt { display: none; }
  .step-pill.is-current .txt { display: inline; font-size: 14px; }
  .stepper ol { display: flex; }
  .stepper ol li { flex: 1; }
  .stepper ol li:has(.is-current) { flex: 2.6; }
  .toast { font-size: 14.5px; padding: 8px 14px; top: 44px; }
  .stage { padding: 14px 12px; min-height: 0; }
  .stage-top .stage-tag { display: none; }
  .activity { padding-top: 46px; }
  .clean { grid-template-columns: 1fr; justify-items: center; }
  .clean .side-spot { flex-direction: row; }
  .clean .cap-spot { order: 2; }
  .clean .label-spot { order: 3; }

  .bins { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bin-body { min-height: 86px; }
  .where { position: static; margin-left: 8px; }
  .mech { grid-template-columns: 1fr; }
  .machine-svg { max-width: 220px; }
  .choices { grid-template-columns: 1fr; }
  .choice { display: grid; grid-template-columns: 84px 1fr; grid-template-rows: auto auto; column-gap: 14px; row-gap: 0; text-align: left; align-items: center; padding: 10px 14px; }
  .choice-art { grid-row: span 2; width: 84px; }
  .choice b { align-self: end; }
  .choice small { align-self: start; }
  .make-b { grid-template-columns: 1fr; }
  .weave-side { align-items: center; text-align: center; }
  .controls { gap: 8px; }
  .controls .btn { flex: 1 1 0; padding: 0 8px; font-size: 15.5px; gap: 6px; }
  .controls .btn svg { width: 18px; height: 18px; }
  .controls #nextBtn { flex-basis: 100%; margin-left: 0; order: -1; }
  .route li span { display: none; }
  .badge-round { width: 96px; height: 96px; font-size: 12px; }
  .badge-round b { font-size: 16px; }
  .finish-art .badge-round { right: -6%; }
  .foot { font-size: 13px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

      const a = i * step;
      pts.push((cx + Math.cos(a) * rad).toFixed(1) + ' ' + (cy + Math.sin(a) * rad).toFixed(1));
    }
    return 'M' + pts.join(' L') + ' Z';
  }

</script>
  <script>
/* 다 쓴 페트병, 다음은 뭘까? — 화면 흐름과 체험 활동 */
(function () {
  'use strict';

  const ART = window.ART;
  const I = ART.icons;
  const query = new URLSearchParams(location.search);

  const STEPS = RES.steps;
  const view = document.getElementById('view');
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const state = {
    screen: 'start',
    step: 0,
    done: STEPS.map(() => false),
    product: null,
    startedAt: 0,
    keyboard: false

  /* ---------------- 작은 도우미 ---------------- */
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const br = (s) => esc(s).replace(/\n/g, '<br>');
  const pad = (n) => String(n).padStart(2, '0');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const fillProduct = (tpl, p) => tpl.replace('{product}', p.name).replace('{subj}', p.subj).replace('{obj}', p.obj);
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  document.addEventListener('keydown', () => { state.keyboard = true; }, true);
  document.addEventListener('pointerdown', () => { state.keyboard = false; }, true);

  /* ---------------- 소리 (선택) ---------------- */
  const Sound = {
    on: false, ctx: null, lastTick: 0,
    play(type) {
      if (!this.on) return;
      const now = performance.now();
      if (type === 'tick') { if (now - this.lastTick < 90) return; this.lastTick = now; }
      const seqs = {
        tap: [[660, 0.06]],
        tick: [[880, 0.025]],
        ok: [[523, 0.08], [784, 0.14]],
        no: [[330, 0.12], [262, 0.16]],
        done: [[523, 0.09], [659, 0.09], [784, 0.09], [1047, 0.2]],
        whoosh: [[392, 0.05], [523, 0.05], [659, 0.08]]

      try {
        this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
        let t = this.ctx.currentTime;
        (seqs[type] || []).forEach(([f, d]) => {
          const o = this.ctx.createOscillator(), g = this.ctx.createGain();
          o.type = 'sine'; o.frequency.value = f;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(type === 'tick' ? 0.05 : 0.16, t + 0.01);

  const soundBtn = document.getElementById('soundBtn');
  soundBtn.addEventListener('click', () => {
    Sound.on = !Sound.on;

    soundBtn.setAttribute('aria-label', Sound.on ? '소리 끄기' : '소리 켜기');
    soundBtn.classList.toggle('is-on', Sound.on);

  });
  document.getElementById('homeBtn').addEventListener('click', () => renderStart());
  document.getElementById('brandBtn').addEventListener('click', () => renderStart());

  /* ---------------- 조작 도우미: 누르기 / 끌기 / 돌리기 ---------------- */

  /** 짧게 누르면 onTap, 누르고 있으면 onHold(초). Enter/Space 도 onTap. */
  function pressable(node, opts) {
    let down = false, t0 = 0, last = 0, raf = 0, pid = null;
    const loop = (now) => {
      if (!down) return;
      if (now - t0 > 180 && opts.onHold) opts.onHold(Math.min(0.05, (now - last) / 1000));
      last = now;
      raf = requestAnimationFrame(loop);
    };
    const stop = () => { down = false; cancelAnimationFrame(raf); node.classList.remove('is-pressing'); };
    node.addEventListener('pointerdown', (e) => {
      if (e.button > 0) return;

      if (!down) return;

    node.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (opts.onTap) opts.onTap(); }
    });
    node.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  /** 끌기. 거의 안 움직이고 놓으면 onTap. */
  function draggable(node, opts) {
    let s = null;
    node.addEventListener('pointerdown', (e) => {
      if (e.button > 0) return;
      e.preventDefault();
      s = { x: e.clientX, y: e.clientY, id: e.pointerId, moved: false };
      try { node.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
      node.classList.add('is-dragging');
      if (opts.onStart) opts.onStart(e);
    });
    node.addEventListener('pointermove', (e) => {
      if (!s || e.pointerId !== s.id) return;
      const dx = e.clientX - s.x, dy = e.clientY - s.y;
      if (Math.abs(dx) + Math.abs(dy) > 6) s.moved = true;
      if (s.moved && opts.onMove) opts.onMove(dx, dy, e);
    });
    const end = (e) => {
      if (!s) return;
      const st = s; s = null;
      node.classList.remove('is-dragging');
      if (!st.moved) { if (opts.onTap) opts.onTap(); if (opts.onCancel) opts.onCancel(); return; }
      if (opts.onEnd) opts.onEnd(e.clientX - st.x, e.clientY - st.y, e);
    };
    node.addEventListener('pointerup', end);
    node.addEventListener('pointercancel', (e) => { if (s) { s = null; node.classList.remove('is-dragging'); if (opts.onCancel) opts.onCancel(e); } });
    node.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (opts.onTap) opts.onTap(); }
    });
  }

  /** 동그란 손잡이 돌리기. onDelta(도) — 방향 상관없이 쓰려면 절댓값 사용 */
  function rotary(node, onDelta) {
    let prev = null;
    const angleOf = (e) => {
      const r = node.getBoundingClientRect();
      return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
    };
    node.addEventListener('pointerdown', (e) => {
      if (e.button > 0) return;
      e.preventDefault();
      prev = angleOf(e);
      try { node.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
      node.classList.add('is-dragging');
    });
    node.addEventListener('pointermove', (e) => {
      if (prev === null) return;
      const a = angleOf(e);
      let d = a - prev;
      if (d > 180) d -= 360;
      if (d < -180) d += 360;
      prev = a;
      if (Math.abs(d) < 70) onDelta(d);
    });
    const end = () => { prev = null; node.classList.remove('is-dragging'); };
    node.addEventListener('pointerup', end);
    node.addEventListener('pointercancel', end);
    node.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); onDelta(30); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); onDelta(-30); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onDelta(45); }
    });
  }

  function dialMarkup(label, text) {
    return `
      <div class="dial" role="slider" tabindex="0" aria-label="${esc(label)} (화살표 키로도 돌릴 수 있어요)"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="dial-ring"></div>
        <div class="dial-face">
          <div class="dial-rotor"><span class="knob"></span><i></i><i></i><i></i></div>
          <span class="dial-text">${I.spin}<b>${esc(text)}</b></span>
        </div>
      </div>`;
  }

  /* 한 단계가 열려 있는 동안의 타이머 묶음 — 단계를 떠나면 한꺼번에 정리 */
  function makeSession() {
    const timers = new Set();
    let alive = true;
    return {
      alive: () => alive,
      timeout(fn, ms) {
        const t = setTimeout(() => { timers.delete(t); if (alive) fn(); }, ms);
        timers.add(t);

  }

  /* ================================================================
   *  체험 활동 — 단계 데이터의 activity 값으로 골라 써요.
   *  새 자원을 만들 때 같은 활동을 다시 쓰거나, 여기에 새 활동을 추가해요.
   * ================================================================ */
  const ACTIVITIES = {

    /* ---------- 1. 깨끗하게: 뚜껑 열기 → 물 비우기 → 라벨 떼기 → 찌그러뜨리기 ---------- */
    clean(api, step) {
      api.root.innerHTML = `
        <div class="clean">
          <div class="side-spot cap-spot">
            <div class="spot-box"><span class="spot-cap"></span></div>
            <span class="spot-label">뚜껑</span>
          </div>
          <div class="bottle-holder">
            ${ART.bottle({ water: 0.78, interactive: true })}
            <div class="drops" aria-hidden="true"></div>
          </div>
          <div class="side-spot label-spot">
            <div class="spot-box"><span class="spot-tag">라벨</span></div>
            <span class="spot-label">따로 모아요</span>
          </div>
        </div>`;
      const holder = $('.bottle-holder', api.root);
      const svg = $('.bottle-svg', holder);
      const body = $('.b-body', svg), cap = $('.b-cap', svg), label = $('.b-label', svg), water = $('.b-water', svg);
      const drops = $('.drops', holder);
      const capSpot = $('.cap-spot', api.root), labelSpot = $('.label-spot', api.root);
      const N = step.nudges;
      let phase = 0, pours = 0, peel = 0, squash = 0;

      const unitsPerPx = () => 120 / svg.getBoundingClientRect().width;
      api.setTask(0, cap);

      // 0) 뚜껑 열기
      pressable(cap, {
        onTap() {
          if (phase !== 0) return;
          phase = 1;
          cap.classList.add('is-off');
          capSpot.classList.add('is-filled');
          api.sound('tap');
          api.progress(0.25);
          api.setTask(1, body);
          api.toast(N.capNote);
        }
      });

      // 1) 물 비우기 / 3) 찌그러뜨리기 — 둘 다 병 몸통을 눌러요
      const squeeze = (amount) => {
        squash = clamp(squash + amount, 0, 1);
        body.style.transform = `scale(${1 + squash * 0.1}, ${1 - squash * 0.42})`;
        svg.classList.toggle('is-squishing', squash > 0.15);
        api.progress(0.75 + squash * 0.25);
        api.sound('tick');
        if (squash >= 1) {
          phase = 4;
          svg.classList.add('is-flat');
          api.complete();
        }
      };
      const bodyTap = () => {
          if (phase === 0) { api.toast(N.capFirst, 'warn'); api.pulse(cap); api.sound('no'); return; }
          if (phase === 1) {
            pours += 1;
            water.style.transform = `translateY(${(1 - 0.78 * (1 - pours / 3)) * 130}px)`;
            holder.classList.remove('is-pouring'); void holder.offsetWidth; holder.classList.add('is-pouring');
            spawnDrops(drops);
            api.sound('tap');
            api.progress(0.25 + (pours / 3) * 0.25);
            if (pours >= 3) {
              phase = 2;
              api.setTask(2, label);
              api.toast(N.rinsed, 'ok');
            } else {
              api.toast(N.poured);
            }
            return;
          }
          if (phase === 2) { api.toast(step.prompts[2], 'warn'); api.pulse(label); return; }
          if (phase === 3) squeeze(0.25);
      };
      pressable(body, { onTap: bodyTap, onHold(dt) { if (phase === 3) squeeze(dt * 0.95); } });

      // 2) 라벨 떼기 — 옆으로 끌거나 여러 번 누르기
      const placeLabel = (x, animate) => {
        label.style.transition = animate ? 'transform .3s ease' : 'none';
        label.style.transform = `translate(${x}px, ${x * 0.05}px) rotate(${x * 0.08}deg)`;
      };
      const peelOff = () => {
        phase = 3;
        label.style.transition = 'transform .45s ease, opacity .45s ease';
        label.style.transform = 'translate(150px, 30px) rotate(14deg)';
        label.style.opacity = '0';
        labelSpot.classList.add('is-filled');
        api.sound('ok');
        api.progress(0.75);
        api.setTask(3, body);
        api.toast(N.labelOff, 'ok');
      };
      draggable(label, {
        onMove(dx) {
          if (phase !== 2) return;
          placeLabel(clamp(peel * 22 + dx * unitsPerPx(), 0, 110), false);
        },
        onEnd(dx) {
          if (phase !== 2) return;
          const x = peel * 22 + dx * unitsPerPx();
          if (x >= 55) peelOff(); else placeLabel(peel * 22, true);
        },
        onTap() {
          if (phase < 2) { bodyTap(); return; } // 라벨 위를 눌러도 병을 누른 것으로 쳐요

          peel += 1;
          api.sound('tap');
          api.progress(0.5 + peel * 0.07);
          if (peel >= 3) peelOff(); else placeLabel(peel * 22, true);
        }
      });
    },

    /* ---------- 2. 올바르게: 알맞은 수거함 고르기 → 선별장으로 ---------- */
    sort(api, step) {
      api.root.innerHTML = `
        <div class="sort">
          <div class="sort-top">
            <div class="drag-bottle" aria-hidden="true">${ART.flatBottle()}</div>
            <span class="where">어디로 갈까?</span>
          </div>
          <div class="bins" role="group" aria-label="수거함">
            ${step.bins.map((b) => `
              <button class="bin" type="button" data-id="${b.id}" style="--bin:${b.color};--ink:${b.ink}"
                      aria-label="${esc(b.label)} 수거함에 넣기">
                <span class="bin-lid"></span>
                <span class="bin-body"><small>${esc(b.en)}</small><b>${esc(b.label)}</b></span>
              </button>`).join('')}
          </div>
          <div class="feedback" role="status" hidden></div>
          <ol class="journey" aria-label="페트병이 가는 길">
            ${step.journey.map((j, i) => `<li><span class="j-ic">${[I.bin, I.truck, I.factory][i] || I.sparkle}</span>${esc(j)}</li>`).join('<li class="j-arrow" aria-hidden="true">→</li>')}
          </ol>
        </div>`;
      const bottleEl = $('.drag-bottle', api.root);
      const bins = $$('.bin', api.root);
      const feedback = $('.feedback', api.root);
      const correctBin = bins.find((b) => step.bins.find((x) => x.id === b.dataset.id).correct);
      const stops = $$('.journey li:not(.j-arrow)', api.root);
      let solved = false, tries = 0;

      api.setTask(0, bottleEl);

      const binAt = (x, y) => bins.find((b) => {
        const r = b.getBoundingClientRect();
        return x >= r.left && x <= r.right && y >= r.top - 20 && y <= r.bottom;
      });
      const reset = () => {
        bottleEl.style.transition = 'transform .35s cubic-bezier(.3,1.4,.5,1)';
        bottleEl.style.transform = '';
        bins.forEach((b) => b.classList.remove('is-over'));
      };

      const choose = (bin) => {
        if (solved) return;
        const data = step.bins.find((b) => b.id === bin.dataset.id);
        bins.forEach((b) => b.classList.remove('is-over', 'is-wrong'));
        if (data.correct) {
          solved = true;
          feedback.hidden = true;
          bin.classList.add('is-correct');
          const br1 = bottleEl.getBoundingClientRect(), br2 = bin.getBoundingClientRect();
          const cur = new DOMMatrix(getComputedStyle(bottleEl).transform);
          const dx = br2.left + br2.width / 2 - (br1.left + br1.width / 2) + cur.m41;
          const dy = br2.top + 10 - (br1.top + br1.height / 2) + cur.m42;
          bottleEl.style.transition = 'transform .55s ease-in, opacity .55s ease-in';
          bottleEl.style.transform = `translate(${dx}px, ${dy}px) scale(.35)`;
          bottleEl.style.opacity = '0';
          bins.forEach((b) => { b.disabled = true; });
          api.sound('ok');
          api.toast(step.correctMsg, 'ok');
          api.progress(0.5);
          api.setTask(1, null);
          stops.forEach((s, i) => {
            api.session.timeout(() => {
              s.classList.add('is-lit');
              api.sound('tap');
              api.progress(0.5 + ((i + 1) / stops.length) * 0.45);
            }, 500 + i * 650);
          });
          api.session.timeout(() => { api.toast(step.journeyMsg); api.complete(); }, 500 + stops.length * 650);
        } else {
          tries += 1;
          bin.classList.remove('is-wrong'); void bin.offsetWidth; bin.classList.add('is-wrong');
          feedback.innerHTML = `<b>앗, 여기는 ${esc(data.label)} 수거함이에요.</b><p>${esc(data.why)}</p><p class="again">${I.retry}<span>괜찮아요! 다시 골라 볼까요?</span></p>`;
          feedback.hidden = false;
          reset();
          api.sound('no');
          if (tries >= 2) api.pulse(correctBin);
        }
      };

      bins.forEach((b) => b.addEventListener('click', () => choose(b)));

      draggable(bottleEl, {
        onStart() { bottleEl.style.transition = 'none'; },
        onMove(dx, dy, e) {
          if (solved) return;
          bottleEl.style.transform = `translate(${dx}px, ${dy}px) rotate(${clamp(dx / 12, -12, 12)}deg)`;
          const over = binAt(e.clientX, e.clientY);
          bins.forEach((b) => b.classList.toggle('is-over', b === over));
        },
        onEnd(dx, dy, e) {
          if (solved) return;
          const over = binAt(e.clientX, e.clientY);
          if (over) choose(over); else reset();
        },
        onCancel: reset,
        onTap() { if (!solved) api.toast('페트병을 끌어서 수거함에 놓거나, 수거함을 눌러요.'); }
      });
    },

    /* ---------- 3. 잘게잘게: 손잡이를 돌려 플레이크 만들기 ---------- */
    crush(api, step) {
      const TOTAL = (step.turns || 3) * 360;
      api.root.innerHTML = `
        <div class="mech">
          <div class="mech-machine">
            <div class="hopper-bottle">${ART.bottle({ cap: false, label: false })}</div>
            ${ART.crusher()}
            <p class="mech-cap">작은 조각 · 플레이크</p>
          </div>
          <div class="mech-control">
            ${dialMarkup('분쇄기 손잡이', '돌려 주세요')}
            <p class="dial-sub">어느 방향이든 좋아요 · <b class="turns">0 / ${step.turns} 바퀴</b></p>
            <button class="btn soft assist" type="button">${I.spin}<span>눌러서 돌리기</span></button>
          </div>
        </div>`;
      const dial = $('.dial', api.root), rotor = $('.dial-rotor', dial), ring = $('.dial-ring', dial);
      const dialText = $('.dial-text b', dial);
      const g1 = $('.g1', api.root), g2 = $('.g2', api.root);
      const hopper = $('.hopper-bottle', api.root);
      const turnsEl = $('.turns', api.root);
      const flakeLayer = $('.flakes', api.root);
      const colors = ['#9EE0D2', '#CFF1EA', '#7CC8DC', '#FFFFFF', '#BDE7E2'];
      let flakes = '';
      for (let i = 0; i < 40; i++) {
        const x = 78 + Math.random() * 84, y = 188 + Math.random() * 40;
        flakes += `<rect class="flake" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(5 + Math.random() * 6).toFixed(1)}" height="${(3 + Math.random() * 4).toFixed(1)}" rx="1" fill="${colors[i % colors.length]}" stroke="#5FA79D" stroke-width=".8" transform="rotate(${(Math.random() * 80 - 40).toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)})"/>`;
      }
      flakeLayer.innerHTML = flakes;
      const flakeEls = $$('.flake', flakeLayer);
      let angle = 0, total = 0, done = false;

      api.setTask(0, dial);

      const rotateBy = (d) => {
        if (done) return;
        angle += d;
        total += Math.abs(d);
        const p = clamp(total / TOTAL, 0, 1);
        rotor.style.transform = `rotate(${angle}deg)`;
        g1.setAttribute('transform', `rotate(${angle * 1.4} 92 115)`);
        g2.setAttribute('transform', `rotate(${-angle * 1.4} 150 115)`);
        ring.style.setProperty('--p', p);
        hopper.style.transform = `translateY(${p * 70}px) scale(${1 - p * 0.35}, ${1 - p * 0.55})`;
        hopper.style.opacity = String(1 - p * 0.95);
        const show = Math.floor(p * flakeEls.length);
        flakeEls.forEach((f, i) => f.classList.toggle('is-on', i < show));
        turnsEl.textContent = `${(p * step.turns).toFixed(1)} / ${step.turns} 바퀴`;
        dial.setAttribute('aria-valuenow', String(Math.round(p * 100)));
        dial.setAttribute('aria-valuetext', `${Math.round(p * 100)}% 돌렸어요`);
        api.progress(p);
        api.sound('tick');
        if (p >= 1) {
          done = true;
          dialText.textContent = '분쇄 완료!';
          dial.classList.add('is-done');
          api.complete();
        }
      };
      rotary(dial, rotateBy);
      pressable($('.assist', api.root), { onTap: () => rotateBy(45), onHold: (dt) => rotateBy(dt * 320) });
    },

    /* ---------- 4. 실로 변신: 열 더하기 → 손잡이 돌려 실 감기 ---------- */
    spin(api, step) {
      const TOTAL = (step.turns || 2) * 360;
      api.root.innerHTML = `
        <div class="mech spin">
          <div class="mech-machine">
            ${ART.spinner()}
            <p class="mech-cap">세척·건조한 플레이크</p>
          </div>
          <div class="mech-control">
            <button class="heat-btn" type="button" aria-label="열 더하기 (누르고 있거나 여러 번 눌러요)">
              <span class="heat-ring"></span>
              <span class="heat-face">${I.heat}<b>열 더하기</b><small>꾹 누르고 있어요</small></span>
            </button>
            <div class="dial-slot" hidden>${dialMarkup('실 감는 손잡이', '실 감기')}</div>
            <p class="dial-sub"><b class="spin-status">조각을 녹이는 중 0%</b></p>
            <button class="btn soft assist" type="button">${I.heat}<span>눌러서 열 더하기</span></button>
          </div>
        </div>
        <ol class="flow" aria-label="실이 되는 과정">
          ${step.flow.map((f, i) => `<li class="${i === 0 ? 'is-lit' : ''}">${esc(f)}</li>`).join('<li class="f-arrow" aria-hidden="true">→</li>')}
        </ol>`;
      const svgRoot = api.root;
      const heatBtn = $('.heat-btn', svgRoot), dialSlot = $('.dial-slot', svgRoot);
      const dial = $('.dial', svgRoot), rotor = $('.dial-rotor', dial), ring = $('.dial-ring', dial);
      const status = $('.spin-status', svgRoot), assist = $('.assist', svgRoot);
      const flowEls = $$('.flow li:not(.f-arrow)', svgRoot);
      const pool = $('.melt-pool', svgRoot), fibers = $('.fibers', svgRoot);
      const thread = $('.spool-thread', svgRoot), lines = $('.spool-lines', svgRoot);
      const fiberPaths = $$('.fiber', svgRoot);
      const heatLayer = $('.heat-flakes', svgRoot);
      let flakes = '';
      for (let i = 0; i < 26; i++) {
        const x = 62 + Math.random() * 112, y = 30 + Math.random() * 46;
        flakes += `<rect class="hflake" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(5 + Math.random() * 5).toFixed(1)}" height="4" rx="1" transform="rotate(${(Math.random() * 70 - 35).toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)})"/>`;
      }
      heatLayer.innerHTML = flakes;
      let phase = 0, heat = 0, angle = 0, total = 0;

      api.setTask(0, heatBtn);

      const addHeat = (v) => {
        if (phase !== 0) return;
        heat = clamp(heat + v, 0, 1);
        heatBtn.style.setProperty('--p', heat);
        heatLayer.style.setProperty('--melt', heat);
        heatLayer.style.opacity = String(1 - heat * 0.9);
        pool.setAttribute('opacity', String(heat));
        status.textContent = `조각을 녹이는 중 ${Math.round(heat * 100)}%`;
        api.progress(heat * 0.45);
        api.sound('tick');
        if (heat >= 1) {
          phase = 1;
          flowEls[1].classList.add('is-lit');
          heatBtn.hidden = true;
          dialSlot.hidden = false;
          fibers.setAttribute('opacity', '1');
          assist.innerHTML = `${I.spin}<span>눌러서 실 감기</span>`;
          $('.mech-cap', svgRoot).textContent = '녹인 원료 → 가는 섬유 → 실';
          status.textContent = `실 감기 0 / ${step.turns} 바퀴`;
          api.sound('ok');
          api.toast('사르르 녹았어요! 이제 가늘게 뽑아 실을 감아요.', 'ok');
          api.setTask(1, dial);
          if (state.keyboard) dial.focus();
        }
      };
      const wind = (d) => {
        if (phase !== 1) return;
        angle += d;
        total += Math.abs(d);
        const p = clamp(total / TOTAL, 0, 1);
        rotor.style.transform = `rotate(${angle}deg)`;
        ring.style.setProperty('--p', p);
        fiberPaths.forEach((f) => { f.style.strokeDashoffset = String(-angle * 0.25); });
        const h = 3 + p * 30;
        thread.setAttribute('height', h.toFixed(1));
        thread.setAttribute('y', (207 - h / 2).toFixed(1));
        const n = Math.floor(p * 9);
        if (lines.childElementCount !== n) {
          let s = '';
          for (let i = 0; i < n; i++) s += `<path d="M${72 + i * 11} ${207 - h / 2 + 2} V${207 + h / 2 - 2}"/>`;
          lines.innerHTML = s;
        }
        lines.setAttribute('opacity', p > 0 ? '1' : '0');
        if (p > 0.05) flowEls[2].classList.add('is-lit');
        status.textContent = `실 감기 ${(p * step.turns).toFixed(1)} / ${step.turns} 바퀴`;
        dial.setAttribute('aria-valuenow', String(Math.round(p * 100)));
        api.progress(0.45 + p * 0.55);
        api.sound('tick');
        if (p >= 1) {
          phase = 2;
          flowEls[3].classList.add('is-lit');
          $('.dial-text b', dial).textContent = '실 완성!';
          dial.classList.add('is-done');
          status.textContent = '반짝이는 재생 실이 감겼어요';
          $('.mech-cap', svgRoot).textContent = '재생 폴리에스터 실';
          api.complete();
        }
      };
      pressable(heatBtn, { onTap: () => addHeat(0.13), onHold: (dt) => addHeat(dt * 0.5) });
      rotary(dial, wind);
      pressable(assist, {
        onTap: () => (phase === 0 ? addHeat(0.13) : wind(45)),
        onHold: (dt) => (phase === 0 ? addHeat(dt * 0.5) : wind(dt * 320))
      });
    },

    /* ---------- 5. 다시, 새로!: 물건 고르기 → 실 엮기 ---------- */
    make(api, step) {
      const choosePhase = () => {
        api.root.innerHTML = `
          <div class="make">
            <div class="choices" role="group" aria-label="만들 물건 고르기">
              ${step.products.map((p) => `
                <button class="choice" type="button" data-id="${p.id}">
                  <span class="choice-art">${ART.product(p.id, 1)}</span>
                  <b>${esc(p.name)}</b><small>${esc(p.blurb)}</small>
                </button>`).join('')}
            </div>
          </div>`;
        const choices = $$('.choice', api.root);
        api.setTask(0, $('.choices', api.root));
        choices.forEach((c) => c.addEventListener('click', () => {
          state.product = step.products.find((p) => p.id === c.dataset.id);
          api.sound('ok');
          weavePhase(state.product);
        }));
        if (state.keyboard) choices[0].focus();
      };

      const weavePhase = (p) => {
        api.root.innerHTML = `
          <div class="make make-b">
            <button class="weave" type="button" aria-label="${esc(p.name)} 실 엮기 (누르고 있거나 여러 번 눌러요)">
              ${ART.product(p.id, 0)}
            </button>
            <div class="weave-side">
              <p class="weave-name">재생 실로 만드는<br><b>${esc(p.name)}</b></p>
              <div class="weave-meter"><i></i></div>
              <p class="weave-pct">0%</p>
              <button class="btn soft assist" type="button">${I.hand}<span>눌러서 엮기</span></button>
              <button class="link-btn change" type="button">다른 물건 고르기</button>
            </div>
          </div>`;
        const weave = $('.weave', api.root);
        const rect = $('.reveal-rect', weave);
        const meter = $('.weave-meter i', api.root), pct = $('.weave-pct', api.root);
        let w = 0, done = false;
        api.progress(0.3);
        api.setTask(1, weave);
        const add = (v) => {
          if (done) return;
          w = clamp(w + v, 0, 1);
          rect.setAttribute('y', (200 - w * 200).toFixed(1));
          meter.style.width = (w * 100) + '%';
          pct.textContent = Math.round(w * 100) + '%';
          api.progress(0.3 + w * 0.7);
          api.sound('tick');
          if (w >= 1) {
            done = true;
            weave.classList.add('is-done');
            pct.textContent = `${p.name} 완성!`;
            $('.change', api.root).hidden = true;
            api.complete();
          }
        };
        pressable(weave, { onTap: () => add(0.18), onHold: (dt) => add(dt * 0.6) });
        pressable($('.assist', api.root), { onTap: () => add(0.18), onHold: (dt) => add(dt * 0.6) });
        $('.change', api.root).addEventListener('click', () => { state.product = null; choosePhase(); api.progress(0); });
        if (state.keyboard) weave.focus();
      };

      choosePhase();
    }
  };

  function spawnDrops(container) {
    if (reduceMotion) return;
    for (let i = 0; i < 7; i++) {
      const d = document.createElement('span');
      d.className = 'drop';
      d.style.left = (40 + Math.random() * 30) + '%';
      d.style.animationDelay = (i * 0.05) + 's';
      container.appendChild(d);
      setTimeout(() => d.remove(), 1100);
    }
  }

  /* ================================================================
   *  화면 1: 시작
   * ================================================================ */
  function renderStart() {
    if (session) session.end();
    state.screen = 'start';
    document.body.dataset.screen = 'start';
    view.innerHTML = `
      <section class="start">
        <div class="start-copy">
          <p class="kicker">${I.retry}<span>${esc(RES.name)}의 두 번째 여행</span></p>
          <h1 class="start-title">${br(RES.title)}</h1>
          <p class="start-lead">${esc(RES.tagline)}</p>
          <button class="btn primary big" id="startBtn" type="button"><span>여행 시작하기</span>${I.next}</button>
          <ul class="start-meta">
            <li>${I.hand}누르고 · 끌고 · 돌려요</li>
            <li>약 1~2분</li>
            <li>터치 · 마우스 · 키보드</li>
          </ul>
        </div>
        <div class="start-art" aria-hidden="true">
          <div class="halo"></div>
          <div class="orbit"></div>
          <p class="speech">${br(RES.greeting)}</p>
          <div class="hero-bottle">${ART.bottle({ water: 0.25 })}</div>
          <span class="spark s1">${I.sparkle}</span>
          <span class="spark s2">${I.sparkle}</span>
          <div class="badge-round">다시 쓰면<b>새 이야기</b></div>
        </div>
        <div class="route-wrap">
          <ol class="route" aria-label="여행 순서">
            ${STEPS.map((s, i) => `<li><span>${pad(i + 1)}</span>${esc(s.label)}</li>`).join('')}
          </ol>
          <p class="model-note">${I.info}<span>${esc(RES.modelNote)}</span></p>
        </div>
      </section>`;
    $('#startBtn').addEventListener('click', () => {
      state.step = 0;
      state.done = STEPS.map(() => false);
      state.product = null;
      state.startedAt = Date.now();
      Sound.play('whoosh');
      renderPlay();
    });
    if (state.keyboard) $('#startBtn').focus();
  }

  /* ================================================================
   *  화면 2: 체험
   * ================================================================ */
  function renderPlay() {
    state.screen = 'play';
    document.body.dataset.screen = 'play';
    view.innerHTML = `
      <nav class="stepper" aria-label="여행 단계"><ol id="stepList"></ol></nav>
      <div class="play">
        <section class="guide-head" aria-live="polite">
          <p class="eyebrow" id="eyebrow"></p>
          <h1 class="step-title" id="stepTitle"></h1>
          <p class="desc" id="stepDesc"></p>
        </section>
        <section class="guide-more">
          <ol class="tasks" id="tasks"></ol>
          <div class="tip"><strong>알고 나면 더 쉬워요</strong><p id="tipText"></p></div>
          <div class="hint-box" id="hintBox" role="status" hidden></div>
          <div class="step-progress">
            <span id="progText">이번 단계 0%</span>
            <div class="bar"><i id="progBar"></i></div>
          </div>
        </section>
        <section class="stage-wrap">
          <div class="stage" id="stage">
            <div class="stage-top">
              <span class="stage-tag" id="stageTag"></span>
              <span class="model-badge">${I.info}체험용 모형</span>
              <span class="stage-pct" id="stagePct">0%</span>
            </div>
            <p class="toast" id="toast" role="status" aria-live="polite"></p>
            <div class="activity" id="activity"></div>
            <p class="prompt" id="prompt" aria-live="polite"></p>
          </div>
          <div class="controls">
            <button class="btn ghost" id="prevBtn" type="button">${I.prev}<span>이전</span></button>
            <button class="btn ghost" id="retryBtn" type="button">${I.retry}<span>다시 하기</span></button>
            <button class="btn soft" id="hintBtn" type="button">${I.hint}<span>힌트</span></button>
            <button class="btn primary" id="nextBtn" type="button" disabled><span>다음 단계로</span>${I.next}</button>
          </div>
        </section>
      </div>`;

    $('#prevBtn').addEventListener('click', () => { if (state.step > 0) goTo(state.step - 1); });
    $('#retryBtn').addEventListener('click', () => { Sound.play('tap'); mountStep(); });
    $('#hintBtn').addEventListener('click', () => showHint());
    $('#nextBtn').addEventListener('click', () => {
      if (!state.done[state.step]) return;
      if (state.step === STEPS.length - 1) renderFinish();
      else goTo(state.step + 1);
    });
    mountStep();
  }

  function goTo(i) {
    state.step = clamp(i, 0, STEPS.length - 1);
    mountStep();
    $('#view').focus({ preventScroll: true });
    window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
  }

  function renderStepper() {
    $('#stepList').innerHTML = STEPS.map((s, i) => {
      const reachable = i === 0 || state.done[i - 1] || state.done[i];
      const cls = [i === state.step ? 'is-current' : '', state.done[i] ? 'is-done' : ''].join(' ');
      return `<li><button class="step-pill ${cls}" type="button" data-i="${i}" ${reachable ? '' : 'disabled'}
                ${i === state.step ? 'aria-current="step"' : ''} aria-label="${i + 1}단계 ${esc(s.label)}${state.done[i] ? ' (완료)' : ''}">
                <span class="num">${state.done[i] && i !== state.step ? I.check : pad(i + 1)}</span><span class="txt">${esc(s.label)}</span>
              </button></li>`;
    }).join('');
    $$('.step-pill', $('#stepList')).forEach((b) => b.addEventListener('click', () => {
      const i = Number(b.dataset.i);
      if (i !== state.step) goTo(i);
    }));
  }

  let idleTimer = 0;
  function mountStep() {
    if (session) session.end();
    session = makeSession();
    const step = STEPS[state.step];
    const n = state.step;
    let taskIdx = 0, hintTarget = null;

    renderStepper();
    $('#eyebrow').textContent = `STEP ${pad(n + 1)} · ${step.label}`;
    $('#stepTitle').innerHTML = br(step.heading);
    $('#stepDesc').textContent = step.desc;
    $('#tipText').textContent = step.tip;
    $('#stageTag').textContent = `${pad(n + 1)} / ${step.en}`;
    $('#hintBox').hidden = true;
    $('#toast').className = 'toast';
    $('#toast').textContent = '';
    $('#prevBtn').disabled = n === 0;
    $('#hintBtn').classList.remove('nudge');
    const next = $('#nextBtn');
    next.querySelector('span').textContent = n === STEPS.length - 1 ? '완성 화면 보기' : '다음 단계로';
    setNext(state.done[n]);

    const tasksEl = $('#tasks');
    const renderTasks = (active, allDone) => {
      tasksEl.innerHTML = step.tasks.map((t, i) => {
        const isDone = allDone || i < active;
        return `<li class="task ${isDone ? 'is-done' : ''} ${!allDone && i === active ? 'is-active' : ''}">
                  <span class="tick">${isDone ? I.check : i + 1}</span>${esc(t)}</li>`;
      }).join('');
    };

    const setProgress = (p) => {
      const pct = Math.round(clamp(p, 0, 1) * 100);
      $('#progBar').style.width = pct + '%';
      $('#progText').textContent = pct >= 100 ? '준비 완료! 다음 여행으로 가요' : `이번 단계 ${pct}%`;
      $('#stagePct').textContent = pct + '%';
      armIdle();
    };

    const armIdle = () => {
      clearTimeout(idleTimer);
      $('#hintBtn').classList.remove('nudge');
      idleTimer = setTimeout(() => {
        if (session && session.alive() && !state.done[state.step] && state.screen === 'play') {
          $('#hintBtn').classList.add('nudge');
        }
      }, 12000);
    };

    let toastTimer = 0;
    const api = {
      root: $('#activity'),
      session,
      setTask(i, target) {
        taskIdx = i;
        hintTarget = target || null;
        renderTasks(i, false);
        $('#prompt').innerHTML = `${I.hand}<span>${esc(step.prompts[Math.min(i, step.prompts.length - 1)])}</span>`;
        $('#prompt').classList.remove('is-done');
        $('#hintBox').hidden = true;
      },
      progress: setProgress,
      toast(text, tone) {
        const t = $('#toast');
        t.textContent = text;
        t.className = 'toast is-show' + (tone ? ' is-' + tone : '');
        clearTimeout(toastTimer);
        toastTimer = session.timeout(() => { t.classList.remove('is-show'); }, 3200);
      },
      pulse(el) {
        if (!el) return;
        el.classList.remove('hint-pulse'); void (el.getBoundingClientRect());
        el.classList.add('hint-pulse');
        session.timeout(() => el.classList.remove('hint-pulse'), 2600);
      },
      sound: (t) => Sound.play(t),
      complete() {
        state.done[state.step] = true;
        setProgress(1);
        clearTimeout(idleTimer);
        renderTasks(step.tasks.length, true);
        $('#prompt').innerHTML = `${I.check}<span>${esc(step.doneMsg)}</span>`;
        $('#prompt').classList.add('is-done');
        $('#hintBox').hidden = true;
        renderStepper();
        setNext(true);
        Sound.play('done');
        if (state.keyboard) session.timeout(() => next.focus(), 300);
      }
    };

    showHint = () => {
      const text = step.hints[Math.min(taskIdx, step.hints.length - 1)];
      const box = $('#hintBox');
      box.innerHTML = `${I.hint}<p>${esc(text)}</p>`;
      box.hidden = false;
      $('#hintBtn').classList.remove('nudge');
      api.pulse(hintTarget);
      Sound.play('tap');
    };

    renderTasks(0, false);
    setProgress(0);
    if (state.done[n]) { $('#progText').textContent = '이미 해 봤어요! 다시 해 봐도 좋아요'; }
    const activity = ACTIVITIES[step.activity];
    if (activity) activity(api, step);
    else api.root.innerHTML = '<p class="missing">이 활동은 아직 준비 중이에요.</p>';
  }
  let showHint = () => {};

  function setNext(on) {
    const next = $('#nextBtn');
    if (!next) return;
    next.disabled = !on;
    next.classList.toggle('is-ready', !!on);
    next.title = on ? '' : '이번 단계 활동을 마치면 열려요';
  }

  /* ================================================================
   *  화면 3: 완성
   * ================================================================ */
  function renderFinish() {
    if (session) session.end();
    clearTimeout(idleTimer);
    state.screen = 'finish';
    document.body.dataset.screen = 'finish';
    const F = RES.finish;
    const p = state.product || STEPS[STEPS.length - 1].products[0];
    const secs = Math.max(1, Math.round((Date.now() - (state.startedAt || Date.now())) / 1000));
    const timeText = secs >= 60 ? `${Math.floor(secs / 60)}분 ${secs % 60}초` : `${secs}초`;
    let confetti = '';
    if (!reduceMotion) {
      const cs = ['#D4EE52', '#1E5B4C', '#F06A4F', '#7CC8DC', '#9EE0D2'];
      for (let i = 0; i < 34; i++) {
        confetti += `<i style="left:${(Math.random() * 100).toFixed(1)}%;background:${cs[i % cs.length]};animation-delay:${(Math.random() * 1.2).toFixed(2)}s;animation-duration:${(2.4 + Math.random() * 1.6).toFixed(2)}s;--r:${Math.round(Math.random() * 360)}deg"></i>`;
      }
    }
    view.innerHTML = `
      <section class="finish">
        <div class="confetti" aria-hidden="true">${confetti}</div>
        <div class="finish-hero">
          <p class="kicker center">${I.retry}<span>${esc(F.eyebrow)}</span></p>
          <h1 class="finish-title">${br(F.heading)}</h1>
          <p class="finish-lead">${esc(fillProduct(F.lead, p))}</p>
          <div class="finish-art">
            <div class="halo"></div>
            ${ART.product(p.id, 1)}
            <div class="badge-round lime">오늘부터 나도<b>자원순환</b>메이커!</div>
          </div>
          <ul class="chips">
            <li>${I.check}${STEPS.length}단계 여행 완료</li>
            <li>함께한 시간 ${timeText}</li>
          </ul>
        </div>
        <div class="finish-body">
          <div class="recap">
            <h2>페트병이 지나온 길</h2>
            <ol>
              ${STEPS.map((s, i) => `<li><span class="num">${pad(i + 1)}</span><div><b>${esc(s.label)}</b><p>${esc(fillProduct(F.recap[i] || '', p))}</p></div></li>`).join('')}
            </ol>
          </div>
          <div class="notes">
            <h2>${I.info}꼭 알아 두어요</h2>
            <ul>${F.notes.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>
            <p class="promise">${esc(F.promise)}</p>
          </div>
        </div>
        <div class="finish-actions">
          <button class="btn primary big" id="againBtn" type="button"><span>처음부터 다시하기</span>${I.retry}</button>
        </div>
      </section>`;
    Sound.play('done');
    $('#againBtn').addEventListener('click', () => {
      state.step = 0;
      state.done = STEPS.map(() => false);
      state.product = null;
      state.startedAt = Date.now();
      renderPlay();
    });
    window.scrollTo({ top: 0 });
    if (state.keyboard) $('#againBtn').focus({ preventScroll: true });
  }

  renderStart();
})();

</script>
</body>
</html>
