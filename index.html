<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML 미리보기 · 배포</title>
<script>
  // github.io 주소로 들어오면 대표 주소(html.bgnl.kr)로 옮김
  if (location.hostname.endsWith('.github.io')) location.replace('https://html.bgnl.kr/' + location.search);
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="app.css?v=2">
<style>
  body { display: flex; flex-direction: column; }
  main { flex: 1; display: grid; grid-template-columns: var(--split, 50%) 9px minmax(0, 1fr); min-height: 0; }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--bg); container-type: inline-size; }
  @container (max-width: 480px) {
    .pane .bar { flex-wrap: nowrap; padding-left: 16px; padding-right: 12px; }
    .bar .label small, .btn-icon .txt { display: none; }
    .pane .bar button { padding-left: 10px; padding-right: 10px; }
  }

  /* 가운데 크기 조절 막대 */
  .divider { position: relative; cursor: col-resize; touch-action: none; outline: none; }
  .divider::before { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 1px; background: var(--line); transition: background-color .15s, width .15s, left .15s; }
  .divider:hover::before, .divider:focus-visible::before, body.resizing .divider::before { left: 3px; width: 3px; background: var(--text); }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing iframe { pointer-events: none; }

  /* 직접 수정 — 미리보기에서 누른 요소의 코드 줄 강조 (입력칸 선택은 포커스가 없으면 안 보여서 따로 그림) */
  textarea.code { white-space: pre-wrap; overflow-wrap: anywhere; overflow-x: hidden; } /* 칸 너비에 맞춰 줄바꿈 */
  .code-wrap { flex: 1; position: relative; display: flex; min-height: 0; overflow: hidden; }
  .code-mark { position: absolute; left: 0; right: 0; pointer-events: none; display: none;
    background: color-mix(in srgb, var(--text) 9%, transparent); border-left: 3px solid var(--text); } /* 끄는 중에 미리보기가 마우스를 가로채지 않게 */

  /* 전체화면 — 한쪽 칸이 가로로 가득 참 (머리줄·바닥줄은 그대로) */
  main[data-full] { grid-template-columns: minmax(0, 1fr); }
  main[data-full] .divider, main[data-full="editPane"] #previewPane, main[data-full="previewPane"] #editPane { display: none !important; }
  main[data-full="editPane"] #editPane, main[data-full="previewPane"] #previewPane { display: flex !important; }
  .btn-icon svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .bar {
    display: flex; align-items: center; gap: 6px; padding: 12px 24px; min-height: 58px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap;
  }
  .bar .label { margin-right: auto; min-width: 0; display: flex; align-items: baseline; gap: 12px; overflow: hidden; white-space: nowrap; }
  .bar .label em { font-style: normal; font-size: 20px; font-weight: 200; letter-spacing: -0.6px; color: var(--text); }
  .bar .label small { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .bar .label small b { color: var(--text); font-weight: 600; }
  footer.deploy {
    display: flex; align-items: center; gap: 8px; padding: 16px 40px; flex-wrap: wrap; flex: 0 0 auto;
  }
  footer.deploy button { padding: 9px 20px; }
  .tabs { display: none; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    .divider { display: none; }
    main[data-view="edit"] #previewPane { display: none; }
    main[data-view="preview"] #editPane { display: none; }
    .tabs { display: contents; }
    .gnb .wide { display: none; }
    .bar { padding: 10px 16px; min-height: 52px; }
    textarea.code { padding: 14px 16px; }
    footer.deploy { padding: 12px 16px; }
    footer.deploy .status { flex-basis: 100%; }
    footer.deploy button { flex: 1; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><a href="./"><b>HTML 뷰어</b></a><span>ⓒ 2026 Yonghyun Kim | <a href="https://bgnl.kr" target="_blank" rel="noopener">https://bgnl.kr</a></span></div>
  <nav class="gnb">
    <span class="tabs">
      <button data-view="edit" class="on">편집</button>
      <button data-view="preview">미리보기</button>
    </span>
    <a class="on wide" href="./">편집기</a>
  </nav>
</header>

<main id="main" data-view="edit">
  <section class="pane" id="editPane">
    <div class="bar">
      <span class="label"><em>Source</em><small id="editingLabel">새 페이지</small></span>
      <button id="btnOpen">파일 열기</button>
      <button id="btnNew">새로 쓰기</button>
      <button class="btn-icon" data-full="editPane"></button>
      <input type="file" id="file" accept=".html,.htm,text/html" hidden>
    </div>
    <div class="code-wrap">
      <textarea class="code" id="code" spellcheck="false" autocapitalize="off" autocomplete="off"
        placeholder="여기에 HTML을 붙여넣거나 .html 파일을 끌어다 놓으세요."></textarea>
      <div class="code-mark" id="codeMark"></div>
    </div>
  </section>
  <div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="편집·미리보기 너비 조절" tabindex="0" title="끌어서 너비 조절 · 두 번 누르면 반반"></div>
  <section class="pane" id="previewPane">
    <div class="bar">
      <span class="label"><em>Preview</em><small>미리보기</small></span>
      <button id="btnVisual" title="미리보기 글자·그림을 눌러서 바로 고치기">직접 수정</button>
      <button id="btnUndo" hidden disabled title="직접 수정한 것 하나 되돌리기">되돌리기</button>
      <button id="btnWidth">모바일 폭</button>
      <button id="btnReload">새로고침</button>
      <button class="btn-icon" data-full="previewPane"></button>
    </div>
    <div class="stage" id="stage">
      <iframe id="preview" title="미리보기"
        sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox"></iframe>
    </div>
  </section>
</main>

<footer class="deploy foot-dark">
  <div class="status" id="status"></div>
  <button id="btnSave" title="지금 코드를 내 컴퓨터에 .html 파일로 내려받기">HTML 파일로 저장</button>
  <button id="btnUpdate" hidden>덮어쓰기</button>
  <button id="btnDeploy" class="primary">새 페이지로 배포</button>
</footer>

<script src="config.js"></script>
<script src="core.js"></script>
<script src="visual-edit.js?v=3"></script>
<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const DRAFT = 'hp.draft', EDITING = 'hp.editing';

  const code = $('#code');
  const preview = $('#preview');
  const statusEl = $('#status');
  const btnDeploy = $('#btnDeploy');
  const btnUpdate = $('#btnUpdate');
  let editing = null; // 방금 배포한 페이지 { n, key } — 이어서 덮어쓰기 가능
  try { editing = JSON.parse(HP.session.get(EDITING) || 'null'); } catch {}
  if (editing && !editing.key) editing = null;

  const setStatus = (text, kind, url) => HP.setStatus(statusEl, text, kind, url);
  const idleStatus = () => setStatus(`배포하면 ${HP.baseUrl()}번호/ 주소로 올라가요.`);
  function busy(on) { btnDeploy.disabled = on; btnUpdate.disabled = on; }

  function updateEditingUI() {
    const label = $('#editingLabel');
    label.textContent = '';
    if (editing) {
      label.append('이어서 수정: ');
      const b = document.createElement('b'); b.textContent = `${editing.n}번`;
      label.append(b);
      btnUpdate.hidden = false;
      btnUpdate.textContent = `${editing.n}번 덮어쓰기`;
      HP.session.set(EDITING, JSON.stringify(editing));
    } else {
      label.textContent = '새 페이지';
      btnUpdate.hidden = true;
      HP.session.del(EDITING);
    }
  }

  // ---------- 미리보기 ----------
  let timer = 0;
  // 코드 칸 커서가 있는 요소로 미리보기를 옮기는 스크립트 — 미리보기 끝에 붙고 곧바로 자기 태그는 지움.
  // 편집기가 요소까지의 경로(자식 순번 목록)를 보내면 그 요소로 스크롤한다.
  const REVEAL = `<script>(() => {
    document.currentScript.remove();
    let last = null;
    const go = (path, smooth) => {
      let el = document;
      for (const i of path) el = el && el.children[i];
      if (!el || el === document.documentElement || el === document.body) return;
      last = path;
      el.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: el.getBoundingClientRect().height > innerHeight * 0.8 ? 'start' : 'center' });
    };
    addEventListener('message', (e) => { const d = e.data; if (e.source === parent && d && d.hpveReveal) go(d.hpveReveal, d.smooth); });
    addEventListener('load', () => { if (last) go(last); }, { once: true }); // 그림이 늦게 떠서 위치가 밀린 경우
    parent.postMessage({ hpveReady: 1 }, '*');
  })()<\/script>`;
  let revealPending = null; // 다시 그린 미리보기가 준비되면 보낼 경로
  function revealAt(pos) {
    if (!HPVE.ready()) return null;
    const path = HPVE.pathAt(code.value, pos);
    return path.length > 2 ? path : null; // html·body 자체면 옮길 곳 없음
  }
  window.addEventListener('message', (e) => {
    if (e.source !== preview.contentWindow || !e.data || !e.data.hpveReady || !revealPending) return;
    preview.contentWindow.postMessage({ hpveReveal: revealPending }, '*');
    revealPending = null;
  });
  // 코드 칸에서 클릭하거나 화살표로 커서를 옮기면 — 다시 그리지 않고 스크롤만
  let lastCaret = -1, caretTimer = 0;
  const followCaret = () => {
    clearTimeout(caretTimer);
    caretTimer = setTimeout(() => {
      const pos = code.selectionStart;
      if (pos === lastCaret) return;
      lastCaret = pos;
      const path = revealAt(pos);
      if (path) preview.contentWindow.postMessage({ hpveReveal: path, smooth: true }, '*');
    }, 120);
  };
  code.addEventListener('click', followCaret);
  code.addEventListener('keyup', (e) => { if (/^(Arrow|Page|Home|End)/.test(e.key)) followCaret(); });

  // reveal: 다시 그린 뒤 코드 칸 커서가 있는 요소로 미리보기를 옮김 (코드를 직접 고칠 때)
  async function render(reveal = false) {
    setMark(null);
    revealPending = reveal ? revealAt(code.selectionStart) : null;
    lastCaret = code.selectionStart;
    if (!ve.on) {
      preview.srcdoc = code.value + '\n' + REVEAL;
      return;
    }
    const src = code.value;
    try {
      await HPVE.load();
      if (!ve.frame) ve.frame = await (await fetch('visual-edit-frame.js?v=4')).text();
    } catch {
      setVisual(false);
      setStatus('직접 수정 기능을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.', 'err');
      return;
    }
    if (src !== code.value) return; // 그새 바뀜 — 다음 render 가 그림
    const { html, map } = HPVE.instrument(src);
    ve.map = map; ve.src = src;
    preview.srcdoc = html + '\n<script>' + ve.frame + '<\/script>' + REVEAL;
  }

  // ---------- 미리보기에서 직접 수정 ----------
  // 미리보기(iframe)가 고친 요소 번호와 새 내용을 보내면, 코드에서 그 요소 구간만 바꾼다.
  const ve = { on: false, map: null, src: null, frame: null, hist: [] };
  const btnVisual = $('#btnVisual');
  const btnUndo = $('#btnUndo');
  function setVisual(on) {
    ve.on = on;
    btnVisual.classList.toggle('on', on);
    btnUndo.hidden = !on;
    render();
  }
  function syncUndo() { btnUndo.disabled = !ve.hist.length; }
  btnVisual.onclick = () => setVisual(!ve.on);
  btnUndo.onclick = () => {
    if (!ve.hist.length) return;
    code.value = ve.hist.pop();
    HP.local.set(DRAFT, code.value);
    syncUndo();
    render();
  };
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!ve.on || e.source !== preview.contentWindow || !d || d.hpve !== 1) return;
    if (code.value !== ve.src) return render(); // 코드를 직접 고치는 중 — 번호가 안 맞음
    if (d.type === 'locate') return locate(String(d.id), String(d.text || ''), !!d.focus);
    let out = null;
    if (d.type === 'inner') out = HPVE.applyInner(ve.src, ve.map, String(d.id), String(d.html));
    else if (d.type === 'attr' && d.name === 'src') out = HPVE.applyAttr(ve.src, ve.map, String(d.id), 'src', String(d.value));
    if (out == null) return render();
    ve.hist.push(ve.src);
    if (ve.hist.length > 100) ve.hist.shift();
    const top = code.scrollTop;
    code.value = ve.src = out;
    code.scrollTop = top;
    HP.local.set(DRAFT, out);
    syncUndo();
    const mk = ve.markId && ve.map[ve.markId];
    if (mk) { code.setSelectionRange(mk.start, mk.end); setMark(mk.start, mk.end); } else setMark(null);
  });

  // 미리보기에서 누른 부분을 코드에서 보여 줌.
  // 스크립트가 만든 부분(focus) — 그 글자가 코드에 있으면 거기로, 없으면 감싼 요소의 시작 태그로, 코드 칸으로 넘어감.
  // 고치는 부분 — 요소 전체를 선택해 그 줄로 스크롤만 함 (포커스를 가져오면 미리보기 편집이 끊김)
  // 코드 칸은 줄바꿈되므로, 같은 모양의 숨은 칸에 글자를 채워 그 위치의 높이를 잰다
  const mirror = document.createElement('div');
  mirror.setAttribute('aria-hidden', 'true');
  mirror.style.cssText = 'position:absolute; left:-99999px; top:0; visibility:hidden; box-sizing:border-box; white-space:pre-wrap; overflow-wrap:anywhere;';
  document.body.append(mirror);
  function linesTop(offsets) { // 각 글자 위치가 든 줄의 윗변 (코드 칸 내용 기준 px)
    const cs = getComputedStyle(code);
    for (const k of ['font', 'letterSpacing', 'tabSize', 'paddingTop', 'paddingRight', 'paddingBottom', 'paddingLeft']) mirror.style[k] = cs[k];
    mirror.style.width = `${code.clientWidth}px`;
    mirror.textContent = '';
    let prev = 0;
    const marks = offsets.map((o) => {
      mirror.append(code.value.slice(prev, o));
      prev = o;
      const s = document.createElement('span');
      s.style.cssText = `display:inline-block; width:0; height:${cs.lineHeight}; vertical-align:top;`;
      mirror.append(s);
      return s;
    });
    const tops = marks.map((s) => s.offsetTop);
    mirror.textContent = '';
    return tops;
  }
  const codeMark = $('#codeMark');
  let markRange = null, markBox = null; // 원본 글자 위치 [a, b], 잰 결과 { top, height }
  function measureMark() {
    if (!markRange) { markBox = null; return; }
    const [a, b] = markRange;
    const [t1, t2] = linesTop([a, Math.max(a, b - 1)]);
    markBox = { top: t1, height: t2 - t1 + parseFloat(getComputedStyle(code).lineHeight) };
  }
  function drawMark() {
    if (!markBox || !ve.on) { codeMark.style.display = 'none'; return; }
    codeMark.style.display = 'block';
    codeMark.style.top = `${markBox.top - code.scrollTop}px`;
    codeMark.style.height = `${markBox.height}px`;
  }
  function setMark(a, b) { markRange = a == null ? null : [a, b]; measureMark(); drawMark(); }
  code.addEventListener('scroll', drawMark);
  new ResizeObserver(() => { measureMark(); drawMark(); }).observe(code); // 칸 너비가 바뀌면 줄바꿈도 바뀜
  function scrollCodeTo(a) {
    code.scrollTop = Math.max(0, linesTop([a])[0] - code.clientHeight / 3);
  }
  function locate(id, text, focus) {
    const m = ve.map[id];
    let a = -1, b = -1;
    if (text.length >= 2) {
      a = m ? code.value.indexOf(text, m.start) : -1;
      if (a < 0) a = code.value.indexOf(text);
      if (a >= 0) b = a + text.length;
    }
    if (a < 0 && m) { a = m.start; b = focus ? m.tagEnd : m.end; }
    if (a < 0) return;
    if (focus) {
      if (mainEl.dataset.full === 'previewPane') setFull(null);
      const editTab = document.querySelector('.tabs button[data-view="edit"]');
      if (mainEl.dataset.view === 'preview' && editTab.getClientRects().length) editTab.click();
      code.focus({ preventScroll: true });
    }
    code.setSelectionRange(a, b);
    scrollCodeTo(a);
    ve.markId = focus ? null : id; // 고치는 동안 범위가 바뀌면 강조도 따라감
    setMark(a, b);
  }

  code.addEventListener('input', () => {
    ve.hist = []; syncUndo();
    clearTimeout(timer);
    timer = setTimeout(() => { render(true); HP.local.set(DRAFT, code.value); }, 300);
  });
  HP.enableTab(code);
  $('#btnReload').onclick = () => render();
  $('#btnWidth').onclick = (e) => {
    const on = $('#stage').classList.toggle('mobile');
    e.currentTarget.classList.toggle('on', on);
  };
  document.querySelectorAll('.tabs button').forEach((b) => {
    b.onclick = () => {
      $('#main').dataset.view = b.dataset.view;
      document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
      if (b.dataset.view === 'preview') render();
    };
  });

  // ---------- 파일 열기 / 드래그 ----------
  function loadText(text) {
    code.value = text;
    ve.hist = []; syncUndo();
    editing = null; updateEditingUI();
    render(); HP.local.set(DRAFT, text);
  }
  $('#btnOpen').onclick = () => $('#file').click();
  $('#file').onchange = async (e) => {
    const f = e.target.files[0];
    if (f) loadText(await f.text());
    e.target.value = '';
  };
  code.addEventListener('dragover', (e) => { e.preventDefault(); code.classList.add('drag'); });
  code.addEventListener('dragleave', () => code.classList.remove('drag'));
  code.addEventListener('drop', async (e) => {
    code.classList.remove('drag');
    const f = e.dataTransfer.files[0];
    if (!f) return;
    e.preventDefault();
    loadText(await f.text());
  });
  $('#btnNew').onclick = () => {
    if (code.value.trim() && !confirm('지금 내용을 지우고 새로 쓸까요?')) return;
    loadText('');
    idleStatus();
  };

  // ---------- HTML 파일로 저장 (내려받기) ----------
  $('#btnSave').onclick = () => {
    const html = code.value;
    if (!html.trim()) return setStatus('저장할 HTML이 비어 있어요.', 'err');
    // 파일 이름은 <title> → 이어서 수정 중인 번호 → page
    const t = (new DOMParser().parseFromString(html, 'text/html').title || '').trim();
    const name = (t || (editing ? `page-${editing.n}` : 'page')).replace(/[\/:*?"<>|\u0000-\u001f]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 80) || 'page';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
    a.download = `${name}.html`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    setStatus(`${name}.html 로 저장했어요.`, 'ok');
  };

  // ---------- 배포 (중계 서버가 대신 커밋 — 수강생 브라우저에는 토큰이 없음) ----------
  const CODE = 'hp.code';
  async function relay(path, payload) {
    for (let attempt = 0; attempt < 2; attempt++) {
      let res;
      try {
        res = await fetch(HP_CONFIG.relayUrl + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...payload, code: HP.local.get(CODE) || undefined }),
        });
      } catch { throw Object.assign(new Error('배포 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.'), { status: 0 }); }
      const data = await res.json().catch(() => ({}));
      if (res.ok) return data;
      if (data.error === 'code' && attempt === 0) {            // 선생님이 강의 코드를 걸어 둔 경우
        const c = prompt('강의 코드를 입력하세요.');
        if (!c) throw Object.assign(new Error('강의 코드가 있어야 배포할 수 있어요.'), { status: 401 });
        HP.local.set(CODE, c.trim());
        continue;
      }
      throw Object.assign(new Error(data.message || data.error || `배포하지 못했어요. (${res.status})`), { status: res.status, code: data.error });
    }
  }

  let liveSeq = 0;
  async function afterCommit(n, html) {
    const seq = ++liveSeq;
    const url = HP.pageUrl(n);
    setStatus(`${n}번으로 올렸어요. 페이지 준비 중… (보통 30초~2분)`, '', url);
    busy(false);
    const live = await HP.waitLive(n, html);
    if (seq !== liveSeq) return; // 그새 다시 배포했음
    setStatus(live ? '배포 완료' : '올리긴 했는데 아직 준비 확인이 안 됐어요. 잠시 뒤 열어보세요.', live ? 'ok' : 'warn', url);
  }

  btnDeploy.onclick = async () => {
    const html = code.value;
    if (!html.trim()) return setStatus('배포할 HTML이 비어 있어요.', 'err');
    busy(true);
    try {
      setStatus('올리는 중…');
      const { n, key } = await relay('/api/deploy', { html });
      editing = { n, key }; updateEditingUI();
      await afterCommit(n, html);
    } catch (e) { setStatus(e.message, 'err'); }
    finally { busy(false); }
  };

  btnUpdate.onclick = async () => {
    if (!editing) return;
    const html = code.value;
    if (!html.trim()) return setStatus('배포할 HTML이 비어 있어요.', 'err');
    const { n } = editing;
    busy(true);
    try {
      setStatus(`${n}번 덮어쓰는 중…`);
      const r = await relay('/api/update', { n, key: editing.key, html });
      editing.key = r.key; updateEditingUI();
      await afterCommit(n, html);
    } catch (e) {
      if (e.code === 'gone' || e.code === 'key') { editing = null; updateEditingUI(); }
      setStatus(e.message, 'err');
    }
    finally { busy(false); }
  };

  // ---------- 가운데 막대로 너비 조절 ----------
  const SPLIT = 'hp.split';
  const mainEl = $('#main');
  const divider = $('#divider');
  const setSplit = (pct, save = true) => {
    const w = mainEl.getBoundingClientRect().width || 1;
    const min = Math.min(45, (300 / w) * 100); // 양쪽 모두 최소 300px
    pct = Math.min(100 - min, Math.max(min, pct));
    mainEl.style.setProperty('--split', `${pct}%`);
    divider.setAttribute('aria-valuenow', Math.round(pct));
    if (save) HP.local.set(SPLIT, String(pct));
  };
  const savedSplit = Number(HP.local.get(SPLIT));
  if (savedSplit) setSplit(savedSplit, false);
  divider.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    divider.setPointerCapture(e.pointerId);
    document.body.classList.add('resizing');
    const rect = mainEl.getBoundingClientRect();
    const move = (ev) => setSplit(((ev.clientX - rect.left) / rect.width) * 100, false);
    const up = (ev) => {
      divider.removeEventListener('pointermove', move);
      divider.removeEventListener('pointerup', up);
      divider.removeEventListener('pointercancel', up);
      document.body.classList.remove('resizing');
      setSplit(((ev.clientX - rect.left) / rect.width) * 100);
    };
    divider.addEventListener('pointermove', move);
    divider.addEventListener('pointerup', up);
    divider.addEventListener('pointercancel', up);
  });
  divider.addEventListener('dblclick', () => setSplit(50));
  divider.addEventListener('keydown', (e) => {
    const cur = parseFloat(mainEl.style.getPropertyValue('--split')) || 50;
    if (e.key === 'ArrowLeft') { e.preventDefault(); setSplit(cur - 2); }
    if (e.key === 'ArrowRight') { e.preventDefault(); setSplit(cur + 2); }
  });

  // ---------- 전체화면 (편집 / 미리보기 각각) ----------
  const ICON_ENTER = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>';
  const ICON_EXIT = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4"/></svg>';
  const fullButtons = document.querySelectorAll('[data-full]');
  function syncFull() {
    const cur = mainEl.dataset.full;
    fullButtons.forEach((b) => {
      const on = cur === b.dataset.full;
      b.innerHTML = (on ? ICON_EXIT : ICON_ENTER) + `<span class="txt">${on ? '나가기' : '전체화면'}</span>`;
      b.title = on ? '나란히 보기로 돌아가기 (Esc)' : '이 칸을 가로로 가득 채우기';
    });
  }
  function setFull(id) {
    if (id) mainEl.dataset.full = id; else delete mainEl.dataset.full;
    syncFull();
  }
  fullButtons.forEach((b) => { b.onclick = () => setFull(mainEl.dataset.full === b.dataset.full ? null : b.dataset.full); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && mainEl.dataset.full) setFull(null); });
  syncFull();

  // ---------- 시작 ----------
  // 예전 방식에서 이 주소에 저장해 둔 토큰은 지운다 (배포된 페이지가 같은 주소라 읽을 수 있음)
  HP.local.del('hp.token'); HP.session.del('hp.token');
  code.value = HP.local.get(DRAFT) || '';
  HPVE.load().catch(() => {}); // 코드에서 고친 곳으로 미리보기 옮기기에 씀 — 못 불러오면 그 기능만 빠짐
  updateEditingUI();
  render();
  idleStatus();
})();
</script>
</body>
</html>
