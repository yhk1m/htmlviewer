<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML 미리보기 · 배포</title>
<script>
  // github.io 주소로 들어오면 대표 주소(html.bgnl.kr)로 옮김
  if (location.hostname.endsWith('.github.io')) location.replace('https://html.bgnl.kr/' + location.search);
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="app.css">
<style>
  body { display: flex; flex-direction: column; }
  main { flex: 1; display: grid; grid-template-columns: var(--split, 50%) 9px minmax(0, 1fr); min-height: 0; }
  .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--bg); container-type: inline-size; }
  @container (max-width: 480px) {
    .pane .bar { flex-wrap: nowrap; padding-left: 16px; padding-right: 12px; }
    .bar .label small, .btn-icon .txt { display: none; }
    .pane .bar button { padding-left: 10px; padding-right: 10px; }
  }

  /* 가운데 크기 조절 막대 */
  .divider { position: relative; cursor: col-resize; touch-action: none; outline: none; }
  .divider::before { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 1px; background: var(--line); transition: background-color .15s, width .15s, left .15s; }
  .divider:hover::before, .divider:focus-visible::before, body.resizing .divider::before { left: 3px; width: 3px; background: var(--text); }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing iframe { pointer-events: none; } /* 끄는 중에 미리보기가 마우스를 가로채지 않게 */

  /* 전체화면 — 한쪽 칸이 가로로 가득 참 (머리줄·바닥줄은 그대로) */
  main[data-full] { grid-template-columns: minmax(0, 1fr); }
  main[data-full] .divider, main[data-full="editPane"] #previewPane, main[data-full="previewPane"] #editPane { display: none !important; }
  main[data-full="editPane"] #editPane, main[data-full="previewPane"] #previewPane { display: flex !important; }
  .btn-icon svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .bar {
    display: flex; align-items: center; gap: 6px; padding: 12px 24px; min-height: 58px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap;
  }
  .bar .label { margin-right: auto; min-width: 0; display: flex; align-items: baseline; gap: 12px; overflow: hidden; white-space: nowrap; }
  .bar .label em { font-style: normal; font-size: 20px; font-weight: 200; letter-spacing: -0.6px; color: var(--text); }
  .bar .label small { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .bar .label small b { color: var(--text); font-weight: 600; }
  footer.deploy {
    display: flex; align-items: center; gap: 8px; padding: 16px 40px; flex-wrap: wrap; flex: 0 0 auto;
  }
  footer.deploy button { padding: 9px 20px; }
  .tabs { display: none; }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    .divider { display: none; }
    main[data-view="edit"] #previewPane { display: none; }
    main[data-view="preview"] #editPane { display: none; }
    .tabs { display: contents; }
    .gnb .wide { display: none; }
    .bar { padding: 10px 16px; min-height: 52px; }
    textarea.code { padding: 14px 16px; }
    footer.deploy { padding: 12px 16px; }
    footer.deploy .status { flex-basis: 100%; }
    footer.deploy button { flex: 1; }
  }
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="./"><b>HTML 뷰어</b><span>Paste · Preview · Publish</span></a>
  <nav class="gnb">
    <span class="tabs">
      <button data-view="edit" class="on">편집</button>
      <button data-view="preview">미리보기</button>
    </span>
    <a class="on wide" href="./">편집기</a>
  </nav>
</header>

<main id="main" data-view="edit">
  <section class="pane" id="editPane">
    <div class="bar">
      <span class="label"><em>Source</em><small id="editingLabel">새 페이지</small></span>
      <button id="btnOpen">파일 열기</button>
      <button id="btnNew">새로 쓰기</button>
      <button class="btn-icon" data-full="editPane"></button>
      <input type="file" id="file" accept=".html,.htm,text/html" hidden>
    </div>
    <textarea class="code" id="code" spellcheck="false" autocapitalize="off" autocomplete="off"
      placeholder="여기에 HTML을 붙여넣거나 .html 파일을 끌어다 놓으세요."></textarea>
  </section>
  <div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="편집·미리보기 너비 조절" tabindex="0" title="끌어서 너비 조절 · 두 번 누르면 반반"></div>
  <section class="pane" id="previewPane">
    <div class="bar">
      <span class="label"><em>Preview</em><small>미리보기</small></span>
      <button id="btnWidth">모바일 폭</button>
      <button id="btnReload">새로고침</button>
      <button class="btn-icon" data-full="previewPane"></button>
    </div>
    <div class="stage" id="stage">
      <iframe id="preview" title="미리보기"
        sandbox="allow-scripts allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox"></iframe>
    </div>
  </section>
</main>

<footer class="deploy foot-dark">
  <div class="status" id="status"></div>
  <button id="btnUpdate" hidden>덮어쓰기</button>
  <button id="btnDeploy" class="primary">새 페이지로 배포</button>
</footer>

<script src="config.js"></script>
<script src="core.js"></script>
<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const DRAFT = 'hp.draft', EDITING = 'hp.editing';

  const code = $('#code');
  const preview = $('#preview');
  const statusEl = $('#status');
  const btnDeploy = $('#btnDeploy');
  const btnUpdate = $('#btnUpdate');
  let editing = null; // 방금 배포한 페이지 { n, key } — 이어서 덮어쓰기 가능
  try { editing = JSON.parse(HP.session.get(EDITING) || 'null'); } catch {}
  if (editing && !editing.key) editing = null;

  const setStatus = (text, kind, url) => HP.setStatus(statusEl, text, kind, url);
  const idleStatus = () => setStatus(`배포하면 ${HP.baseUrl()}번호/ 주소로 올라가요.`);
  function busy(on) { btnDeploy.disabled = on; btnUpdate.disabled = on; }

  function updateEditingUI() {
    const label = $('#editingLabel');
    label.textContent = '';
    if (editing) {
      label.append('이어서 수정: ');
      const b = document.createElement('b'); b.textContent = `${editing.n}번`;
      label.append(b);
      btnUpdate.hidden = false;
      btnUpdate.textContent = `${editing.n}번 덮어쓰기`;
      HP.session.set(EDITING, JSON.stringify(editing));
    } else {
      label.textContent = '새 페이지';
      btnUpdate.hidden = true;
      HP.session.del(EDITING);
    }
  }

  // ---------- 미리보기 ----------
  let timer = 0;
  const render = () => { preview.srcdoc = code.value; };
  code.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => { render(); HP.local.set(DRAFT, code.value); }, 300);
  });
  HP.enableTab(code);
  $('#btnReload').onclick = render;
  $('#btnWidth').onclick = (e) => {
    const on = $('#stage').classList.toggle('mobile');
    e.currentTarget.classList.toggle('on', on);
  };
  document.querySelectorAll('.tabs button').forEach((b) => {
    b.onclick = () => {
      $('#main').dataset.view = b.dataset.view;
      document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === b));
      if (b.dataset.view === 'preview') render();
    };
  });

  // ---------- 파일 열기 / 드래그 ----------
  function loadText(text) {
    code.value = text;
    editing = null; updateEditingUI();
    render(); HP.local.set(DRAFT, text);
  }
  $('#btnOpen').onclick = () => $('#file').click();
  $('#file').onchange = async (e) => {
    const f = e.target.files[0];
    if (f) loadText(await f.text());
    e.target.value = '';
  };
  code.addEventListener('dragover', (e) => { e.preventDefault(); code.classList.add('drag'); });
  code.addEventListener('dragleave', () => code.classList.remove('drag'));
  code.addEventListener('drop', async (e) => {
    code.classList.remove('drag');
    const f = e.dataTransfer.files[0];
    if (!f) return;
    e.preventDefault();
    loadText(await f.text());
  });
  $('#btnNew').onclick = () => {
    if (code.value.trim() && !confirm('지금 내용을 지우고 새로 쓸까요?')) return;
    loadText('');
    idleStatus();
  };

  // ---------- 배포 (중계 서버가 대신 커밋 — 수강생 브라우저에는 토큰이 없음) ----------
  const CODE = 'hp.code';
  async function relay(path, payload) {
    for (let attempt = 0; attempt < 2; attempt++) {
      let res;
      try {
        res = await fetch(HP_CONFIG.relayUrl + path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...payload, code: HP.local.get(CODE) || undefined }),
        });
      } catch { throw Object.assign(new Error('배포 서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.'), { status: 0 }); }
      const data = await res.json().catch(() => ({}));
      if (res.ok) return data;
      if (data.error === 'code' && attempt === 0) {            // 선생님이 강의 코드를 걸어 둔 경우
        const c = prompt('강의 코드를 입력하세요.');
        if (!c) throw Object.assign(new Error('강의 코드가 있어야 배포할 수 있어요.'), { status: 401 });
        HP.local.set(CODE, c.trim());
        continue;
      }
      throw Object.assign(new Error(data.message || data.error || `배포하지 못했어요. (${res.status})`), { status: res.status, code: data.error });
    }
  }

  let liveSeq = 0;
  async function afterCommit(n, html) {
    const seq = ++liveSeq;
    const url = HP.pageUrl(n);
    setStatus(`${n}번으로 올렸어요. 페이지 준비 중… (보통 30초~2분)`, '', url);
    busy(false);
    const live = await HP.waitLive(n, html);
    if (seq !== liveSeq) return; // 그새 다시 배포했음
    setStatus(live ? '배포 완료' : '올리긴 했는데 아직 준비 확인이 안 됐어요. 잠시 뒤 열어보세요.', live ? 'ok' : 'warn', url);
  }

  btnDeploy.onclick = async () => {
    const html = code.value;
    if (!html.trim()) return setStatus('배포할 HTML이 비어 있어요.', 'err');
    busy(true);
    try {
      setStatus('올리는 중…');
      const { n, key } = await relay('/api/deploy', { html });
      editing = { n, key }; updateEditingUI();
      await afterCommit(n, html);
    } catch (e) { setStatus(e.message, 'err'); }
    finally { busy(false); }
  };

  btnUpdate.onclick = async () => {
    if (!editing) return;
    const html = code.value;
    if (!html.trim()) return setStatus('배포할 HTML이 비어 있어요.', 'err');
    const { n } = editing;
    busy(true);
    try {
      setStatus(`${n}번 덮어쓰는 중…`);
      const r = await relay('/api/update', { n, key: editing.key, html });
      editing.key = r.key; updateEditingUI();
      await afterCommit(n, html);
    } catch (e) {
      if (e.code === 'gone' || e.code === 'key') { editing = null; updateEditingUI(); }
      setStatus(e.message, 'err');
    }
    finally { busy(false); }
  };

  // ---------- 가운데 막대로 너비 조절 ----------
  const SPLIT = 'hp.split';
  const mainEl = $('#main');
  const divider = $('#divider');
  const setSplit = (pct, save = true) => {
    const w = mainEl.getBoundingClientRect().width || 1;
    const min = Math.min(45, (300 / w) * 100); // 양쪽 모두 최소 300px
    pct = Math.min(100 - min, Math.max(min, pct));
    mainEl.style.setProperty('--split', `${pct}%`);
    divider.setAttribute('aria-valuenow', Math.round(pct));
    if (save) HP.local.set(SPLIT, String(pct));
  };
  const savedSplit = Number(HP.local.get(SPLIT));
  if (savedSplit) setSplit(savedSplit, false);
  divider.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    divider.setPointerCapture(e.pointerId);
    document.body.classList.add('resizing');
    const rect = mainEl.getBoundingClientRect();
    const move = (ev) => setSplit(((ev.clientX - rect.left) / rect.width) * 100, false);
    const up = (ev) => {
      divider.removeEventListener('pointermove', move);
      divider.removeEventListener('pointerup', up);
      divider.removeEventListener('pointercancel', up);
      document.body.classList.remove('resizing');
      setSplit(((ev.clientX - rect.left) / rect.width) * 100);
    };
    divider.addEventListener('pointermove', move);
    divider.addEventListener('pointerup', up);
    divider.addEventListener('pointercancel', up);
  });
  divider.addEventListener('dblclick', () => setSplit(50));
  divider.addEventListener('keydown', (e) => {
    const cur = parseFloat(mainEl.style.getPropertyValue('--split')) || 50;
    if (e.key === 'ArrowLeft') { e.preventDefault(); setSplit(cur - 2); }
    if (e.key === 'ArrowRight') { e.preventDefault(); setSplit(cur + 2); }
  });

  // ---------- 전체화면 (편집 / 미리보기 각각) ----------
  const ICON_ENTER = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>';
  const ICON_EXIT = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4"/></svg>';
  const fullButtons = document.querySelectorAll('[data-full]');
  function syncFull() {
    const cur = mainEl.dataset.full;
    fullButtons.forEach((b) => {
      const on = cur === b.dataset.full;
      b.innerHTML = (on ? ICON_EXIT : ICON_ENTER) + `<span class="txt">${on ? '나가기' : '전체화면'}</span>`;
      b.title = on ? '나란히 보기로 돌아가기 (Esc)' : '이 칸을 가로로 가득 채우기';
    });
  }
  function setFull(id) {
    if (id) mainEl.dataset.full = id; else delete mainEl.dataset.full;
    syncFull();
  }
  fullButtons.forEach((b) => { b.onclick = () => setFull(mainEl.dataset.full === b.dataset.full ? null : b.dataset.full); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && mainEl.dataset.full) setFull(null); });
  syncFull();

  // ---------- 시작 ----------
  // 예전 방식에서 이 주소에 저장해 둔 토큰은 지운다 (배포된 페이지가 같은 주소라 읽을 수 있음)
  HP.local.del('hp.token'); HP.session.del('hp.token');
  code.value = HP.local.get(DRAFT) || '';
  updateEditingUI();
  render();
  idleStatus();
})();
</script>
</body>
</html>
